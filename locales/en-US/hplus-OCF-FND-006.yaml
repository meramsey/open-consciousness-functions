  hplus.function.ocf-fnd-006.function-body:
    status: draft
    version: 1.1.0
    text: |-
      At any time from this moment forward, when a temporary OCF Function is
      in application and the need for it has been accomplished, bring that
      Function clearly into your mind.

      Know the Function you are now using and that you desire to place on hold.

      Inhale deeply and hold your breath.

      Then say or think in your mind:

      PLUS-RELEASE.

      Then exhale slowly through your mouth.

      When you do this, the particular Function you have selected will cease its
      present application.

      Its temporary effect will fade quickly and easily.

      Your physical, mental and emotional patterns will return smoothly to their
      normal condition, balanced and equalized in every way.

      The Function itself is not erased.

      The learning and knowledge of the Function remain within you, ready for
      future recall and use whenever the proper command is given again.

      If several temporary Functions are being used together for one special
      situation, hold that grouping clearly in your mind before you state:

      PLUS-RELEASE.

      The active grouping will then be placed on hold, and you will return
      smoothly to your normal condition.

      Use RELEASE only when the temporary Function is no longer needed and its
      purpose has been accomplished.

      Do not use RELEASE to remove the learning of a Function.

      It ends only the Function's present application.

      All when you state:

      PLUS-RELEASE.

      The more you use this method correctly, the easier and more effective it
      will become.
    notes: 'User-proposed reconstruction draft with user-directed terminology edit; original input lines 138–185. Not a recovered historical transcript. Historical source availability remains unavailable; reimplementation remains planned. Proposed input: Release/Release_881002_reconstructed_clean.txt; SHA-256 9ed934ca3624cf5474757154f9342a761753604794a52a50e880b9c6a3b125bf. H-PLUS changed to OCF per user''s standing instruction; original reference remains unchanged. Identity checked against the document title and listed legacy commands; confirmation/authenticity claims remain unverified. Suggested timing is not measured evidence. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending.'
  hplus.function.ocf-fnd-006.closer:
    status: draft
    version: 1.1.0
    text: |-
      Remember, when a temporary OCF Function is no longer needed, bring that
      Function clearly into your mind.

      Inhale deeply and hold your breath.

      Say in your mind:

      PLUS-RELEASE.

      Then exhale slowly through your mouth.

      The present application will end, and the Function will remain on hold,
      ready for future recall and use.

      This is the end of your OCF Function learning exercise.
