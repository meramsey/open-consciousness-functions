entries:
  hplus.function.ocf-slp-001.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to direct your total self

      toward deep restoration, healing, and regeneration

      throughout your natural sleep.'
  hplus.function.ocf-slp-001.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-SLP-001
      allowed:
      - cue.primary
    text: 'From this moment forward, whenever you prepare for sleep,

      you can direct your total self toward deep healing,

      restoration, and regeneration throughout your rest.


      Bring into awareness any part of your physical body

      or total being that you desire to restore.

      Form a clear intention for complete balance,

      renewal, and natural, healthy functioning.


      Inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,

      as though gently blowing out a candle.


      You will move easily and calmly into deep,

      peaceful, natural sleep.


      As you sleep, your conscious mind can rest

      while your subconscious mind and higher self

      work together with your physical body,

      directing their resources toward restoration.


      Your entire system will adjust, equalize,

      and return toward its natural balance.

      Areas of weariness, strain, or imbalance

      will receive the attention needed for renewal.


      Your total self will continue this restorative pattern

      smoothly and automatically throughout your sleep,

      supporting the healing, repair, and regeneration

      you have clearly intended.


      Each part of your being will cooperate with the others,

      restoring harmony and strengthening natural vitality.

      There is no need to follow or direct each step.

      The process continues while you rest.


      As your sleep is complete, you will awaken

      naturally, deeply rested and refreshed,

      with renewed energy, clarity, and strength.


      Your ability to invoke this restorative sleep pattern

      will remain permanently available whenever you choose.

      Each use will make entering restful sleep

      and directing your total self toward healing

      easier, smoother, and more effective.'
  hplus.function.ocf-slp-001.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-SLP-001
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to direct your total self

      toward healing and restoration during sleep,

      inhale deeply and hold your breath.


      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,

      as though gently blowing out a candle.


      This concludes your OCF Restorative Sleep exercise.'
