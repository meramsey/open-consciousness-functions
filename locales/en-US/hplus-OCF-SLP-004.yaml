    text: |-
      From this moment forward, whenever you desire
      an answer, understanding, or a constructive solution,
      you can invite your total self to help you during sleep.

      Bring your question or problem clearly into your mind.
      Know what you wish to understand or resolve.
      State your intention simply and directly,
      then allow the question to rest within you.

      Inhale deeply and gently hold your breath.
      Think or say in your mind, "{{ cue.primary }}."
      Then exhale and breathe slowly and deeply.

      You will move calmly and easily into
      normal, natural, restful sleep.
      Your conscious mind can rest while your
      subconscious awareness, higher self,
      and total being work together on your request.

      You will draw upon your experience, memory,
      deeper understanding, and the wider awareness
      available through your total self.
      Connections and possibilities will come together,
      revealing the most constructive answer or direction.

      The answer may emerge as clear inner knowing,
      a remembered dream, a picture, a phrase,
      a feeling of certainty, or a practical next step.
      You need not control how it arrives.
      Your total self will bring forward what is useful
      in a form you can recognize and understand.

      When you awaken, the answer or guidance
      will come clearly into your awareness.
      You will remember what matters, recognize
      its meaning, and know how to begin using it.

      This ability to seek help through sleep
      will remain permanently available to you.
      Each time you use {{ cue.primary }},
      receiving and remembering useful insight
      will become easier, clearer, and more effective.

