  hplus.function.ocf-emg-001.function-body:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-adapted narration based on the user-proposed
      Emergency: Injury reconstruction. Proposed input:
      Emergency: Injury/Emergency_Injury_88R1040_reconstructed_clean.txt;
      SHA-256 e3ff345f97c903b01f8b1a90d777147c2c24e19687d1a1fefd9d739500b72276;
      proposed extent lines 147–200. Original reconstruction
      remains unchanged. Historical source availability
      remains unavailable and reimplementation remains planned.
      The narration has been reorganized into automatic injury
      recognition, coordinated protection, physiological balance,
      natural repair, conscious reinforcement, and continuing
      restoration. The original proposal of automatic activation
      when conscious command is unavailable remains preserved
      as an intended suggestion, not an established capability.
      The exact Plus Control Balance Restore command and original
      inhale, hold, command, and exhale sequence are preserved.
      OCF-authored suggestions add context-sensitive clotting,
      circulation, immune defense, inflammatory regulation,
      tissue regeneration, and coordinated restoration.
      Permanent availability applies to the proposed adaptive
      response, not continuously elevated emergency activity.
      Redundant command repetition, companion-function references,
      and extended medical-care narration are omitted.
      One reusable body supports repeated playback across
      Focus 11 and Focus 20.
      Shared preparation, state, and return wording excluded.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    text: |-
      From this moment forward, whenever physical injury
      occurs, your entire living system will immediately
      begin its natural processes of protection,
      balance, healing, and restoration.

      Your body will recognize the injury
      and automatically coordinate its responses
      according to what is needed.

      Your nervous system, circulation,
      immune defenses, and healing processes
      will work together in precise coordination.

      Your body will protect the injured area,
      control bleeding when necessary,
      maintain appropriate circulation,
      and preserve the strength and resources
      needed for recovery.

      Your natural inflammatory and immune responses
      will operate in proper balance,
      protecting damaged tissues
      and preparing the area for repair.

      Cells and tissues will begin the processes
      of healing, rebuilding, and regeneration,
      restoring damaged structures
      toward their healthy form and function.

      Every part of your physical system
      will work together to support
      the best possible recovery.

      This automatic response is now
      permanently established within you,
      ready whenever physical injury occurs.

      Whether you are awake, asleep,
      or temporarily unconscious,
      your body's protective and restorative
      processes will activate automatically,
      without requiring conscious direction.

      When you are conscious and able,
      you can strengthen this response
      through a simple command.

      Inhale deeply and gently hold your breath.

      Think or say in your mind,
      "Plus Control Balance Restore."

      Then exhale slowly through your mouth.

      Your body's natural protective,
      balancing, and healing processes
      will become stronger and more coordinated.

      Your mind will remain as calm,
      clear, and responsive as possible,
      helping you recognize what is needed
      and take appropriate action.

      As the injury stabilizes,
      your body will naturally adjust its response,
      directing more energy toward repair,
      restoration, and complete recovery.

      The more you use this function,
      the easier and more effective
      its conscious reinforcement will become.

      Your body's natural intelligence
      will continue directing its resources
      toward protection, balance,
      and restoration whenever needed.

  hplus.function.ocf-emg-001.closer:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-adapted closer based on the user-proposed Emergency:
      Injury reconstruction. Proposed input:
