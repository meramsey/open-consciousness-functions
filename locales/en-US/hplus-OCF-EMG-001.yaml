      SHA-256 e3ff345f97c903b01f8b1a90d777147c2c24e19687d1a1fefd9d739500b72276;
      proposed extent lines 321–336. Original reconstruction
      remains unchanged. Historical source availability
      remains unavailable.
      The closer is shortened to one purpose reminder,
      the exact Plus Control Balance Restore activation command,
      the original breathing sequence, and the standard
      OCF ending. Automatic/unconscious activation is taught
      in the body rather than repeated in the closer.
      This is OCF-authored adapted narration, not historical
      transcript wording.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    cue_template:
      function_id: OCF-EMG-001
      allowed: [cue.primary]
    text: |-
      Remember, whenever physical injury occurs
      and you are conscious and able,
      you can reinforce your body's natural
      protective and healing response.

      Inhale deeply and hold your breath.

      Think or say in your mind,
      "{{ cue.primary }}."

      Then exhale slowly through your mouth.

      This concludes your OCF Injury Response exercise.
