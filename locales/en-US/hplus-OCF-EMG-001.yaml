  hplus.function.ocf-emg-001.closer:
    status: draft
    version: 1.0.0
    text: |-
      Remember, when physical injury occurs and you are conscious, inhale deeply
      and hold your breath.

      Say in your mind:

      PLUS-CONTROL, BALANCE, RESTORE.

      Then exhale slowly through your mouth.

      If injury makes you unconscious and you cannot give the command, the Function
      will move into application without the command.

      Use the command when conscious to speed up and enhance the process, while you
      obtain appropriate first aid and treatment.

      This is the end of your H-PLUS Function learning exercise.
