  hplus.function.ocf-emg-001.function-body:
    status: draft
    version: 1.0.0
    text: |-
      From this moment forward, whenever physical injury occurs, all parts of your
      living system will begin immediately to increase their natural patterns of
      control, balance and restoration.

      Your autonomic system will respond to the injury and will direct the actions
      of your physical body toward the best balance available under the condition.

      The injured area and all related parts of your physical system will work
      together more smoothly and completely.

      Protective and balancing patterns will move into operation.

      Repair and restoration patterns will begin and will continue in the natural
      way of your physical body.

      Your physical system will use the strength and resources available to it to
      support control, balance and restoration.

      If you are conscious when an injury occurs, inhale deeply and hold your
      breath.

      Then say or think in your mind:

      PLUS-CONTROL, BALANCE, RESTORE.

      Then exhale slowly through your mouth.

      When you do this, the natural healing and balancing response of your physical
      body will be strengthened and enhanced.

      Your mind will remain as clear and calm as the condition permits so that you
      can obtain help, apply first aid and take the action that is needed.

      All when you state:

      PLUS-CONTROL, BALANCE, RESTORE.

      If injury causes you to become unconscious and you cannot give the command,
      this Function will move into application without the command.

      If you are conscious, use of the command will speed up and enhance the
      process.

      This Function assists and potentiates the natural defense mechanisms of your
      physical body.

      It does not replace first aid, emergency assistance or other methods of
      treatment.

      Use THINK FAST, RELAX, SHORT FIX and RESTORATIVE SLEEP with EMERGENCY:
      INJURY when their separate purposes are appropriate.

      The more correctly you use this method, the smoother and easier it will
      become.
