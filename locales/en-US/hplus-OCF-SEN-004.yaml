  hplus.function.ocf-sen-004.function-body:
    status: reviewed
    version: 1.1.0
    text: |-
      At any time from this moment forward, whenever you desire to control the way you taste and perceive flavor, all you need do is close your eyes, inhale deeply, and hold your breath.

      Then say or think in your mind, PLUS-TASTE MORE, or PLUS-TASTE LESS.

      Then exhale slowly through your mouth and open your eyes.

      When you do this, if you state more, your physical sense of taste will become much sharper and clearer.

      You will perceive and identify even the most subtle taste to enter your system.

      You will perceive and enjoy pleasant tastes more fully.

      All when you state PLUS-TASTE MORE.

      When you state PLUS-TASTE LESS, your sense of taste will become less and less sensitive each time you state PLUS-TASTE LESS, until any unwanted, distracting, or unpleasant taste sensation is no longer important.

      You will also be able to tune down enjoyable taste sensations whenever you desire to do so.

      Whenever you use this method of taste control, it will continue until you desire to return your sense of taste to its normal condition.

      The more you use this method, the easier and more effective it will become.
    notes: 'User-proposed reconstruction draft; input lines 128–148. User-proposed reconstruction, not a recovered historical transcript. Historical source availability remains unavailable; reimplementation remains planned. Proposed input: Sensory (Taste)/Sensory_Taste_reconstructed_clean.txt; SHA-256 c54c04e19d6a7e395133e8d4059f61fecf80d21eb6ccedd591bacf8258f29e13; header ''SENSORY: TASTE — RECONSTRUCTED H-PLUS-STYLE AUDIO SCRIPT''. Identity checked against the document title and listed legacy commands, not inferred from the filename. Header claims of confirmation/authenticity are not independently verified. Only selected narration is reused; shared sections, production directions and non-narration prefatory notes remain separate. Suggested input timings are not measured evidence. User-directed terminology edit: proposed GREATER/LESSER cue wording changed to canonical MORE/LESS; original reference remains unchanged. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending.'
  hplus.function.ocf-sen-004.closer:
    status: reviewed
    version: 1.1.0
    text: |-
      Remember, to direct your physical sense of taste, inhale deeply and hold your breath.

      Say in your mind, PLUS-TASTE MORE, if you wish to increase your sense of taste, or PLUS-TASTE LESS, if you want to tune down what and how you taste.

      Then exhale slowly through your mouth as if you are blowing out a candle.

      This is the end of your Function learning exercise.
