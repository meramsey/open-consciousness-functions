  hplus.function.ocf-fnd-005.function-body:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-adapted body based on the unverified Reset transcript.
      Original SOURCE +Transcripts From available tapes/Reset/Reset.txt;
      SHA-256 7c0ffbc8d6d4d781e1edcc474d1e8069651f7508a4f180b604309b6138646bc2;
      lines 30–51. Original reference remains unchanged. The repeated
      historical body pass remains excluded. The exact Plus Reset Reset
      command and source sequence of inhale, close eyes, hold breath,
      command, exhale, and open eyes are preserved. OCF-authored additions
      strengthen immediate wakeful renewal, calm confidence, clarity,
      and lasting availability with conscious activation. Reset remains
      distinct from brief restorative sleep through Recharge and does not
      establish permanent stimulation. One reusable body supports four
      playback passes across Focus 11 and Focus 20. Shared preparation,
      state, and return wording remains excluded. Effects described in the
      narration are intended suggestions, not independently verified outcomes.
      Rights: user_cleared, per user's lawyer-clearance attestation.
      Revised wording awaits final editorial approval.
      Finished-session release pending.
    text: |-
      From this moment forward, you have the ability
      to change your physical and mental pattern
      quickly and completely whenever you desire.

      Whenever you feel tired, weary, or emotionally low,
      you can immediately reset your state and return
      to renewed strength, clarity, and confidence.

      Inhale deeply, close your eyes,
      and gently hold your breath.

      Think or say in your mind, "Plus Reset Reset."

      Then exhale slowly through your mouth
      and open your eyes.

      As you exhale, weariness and heaviness
      will flow out of your body and mind.
      With each new breath, fresh energy and vitality
      will flow throughout your entire system.

      Your body will feel renewed, balanced,
      comfortable, and ready for action.
      Your mind will become clear, clean, sharp,
      and smooth, with bright, steady awareness.

      Your emotions will return to balance.
      You will feel strong and sure,
      calm and confident, ready to move forward.

      This change will take place immediately,
      bringing your entire being into the
      clear, energized state you have chosen.

      From this moment forward, this ability
      to reset your state is permanently
      available whenever you wish to use it.

      Your natural balance remains intact,
      and you can invoke this renewed wakefulness
      whenever a change of pattern is desired.

      Each time you use Plus Reset Reset,
      this shift becomes easier, faster,
      and more effective.

