  hplus.function.ocf-fnd-005.function-body:
    status: reviewed
    version: 1.1.0
    notes: 'Reference-derived wording with human edit; transcript_unverified. Original SOURCE +Transcripts From available tapes/Reset/Reset.txt; SHA-256 7c0ffbc8d6d4d781e1edcc474d1e8069651f7508a4f180b604309b6138646bc2; lines 30–51. Human wording review: user approved the body with its repeated second pass removed; first pass retained verbatim. Original SOURCE remains unchanged. Effect statements remain source claims, not established outcomes. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      At any point in the future, whenever you are tired and emotionally low,
      and you wish to change immediately, all you need do is inhale deeply,
      close your eyes and hold your breath, then say or think in your mind,
      plus, reset, reset, then exhale slowly and open your eyes.
      When you do this, all weariness and fatigue will flow out of your body,
      and bright new energy will flow in with every breath you take.
      And your entire mental process will become clear, clean, sharp, and smooth,
      and you will immediately feel and be strong and sure, calm and confident,
      better in every way.
      The more you use this method of changing your pattern,
      the easier and more effective it will become.
