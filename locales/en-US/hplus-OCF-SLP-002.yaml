  hplus.function.ocf-slp-002.opener:
    status: draft
    version: "1.0.0"
    notes: Reference-derived candidate; Sleep lines 7–8. Wording review pending.
    text: |-
      This is your H Plus function exercise so that you can learn to sleep
      whenever you so desire.
  hplus.function.ocf-slp-002.function-body:
    status: draft
    version: "1.0.0"
    notes: Reference-derived candidate; Sleep lines 72–116. Physiological and efficacy claims retained for human review. Reuse this one key for all session passes.
    text: |-
      At any point
      from this moment on
      whenever you desire to move into normal, natural, restful sleep
      all you need do is breathe slowly and deeply
      and as you exhale think or say in your mind
      plus 20.
      The more you do this the deeper and deeper you will move into calm,
      relaxing, restful sleep and you will awaken when you desire to do so.

      When you sleep this normal sleep
      your body will become so equalized as to overcome all those things
      that may hinder or prevent it from being and giving its normal
      and natural total self.
      The mental will send those signals as to create harmony and balance to the entire self.
      The nerve system will carry such signals as to direct
      each portion of the body to restore and operate smoothly and easily
      that which it was designed to perform.
      Perfectly normal, perfectly balanced, perfectly equalized will be the result
      whenever you sleep this normal, natural, restful sleep.
      When you awaken you will be completely refreshed
      full of new energy, wide awake both physically and mentally
      and better in every way.
