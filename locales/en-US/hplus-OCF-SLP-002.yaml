  hplus.function.ocf-slp-002.closer:
    status: draft
    version: "1.0.0"
    notes: Reference-derived candidate; Sleep lines 315–317. Wording review pending.
    text: |-
      Remember, whenever you wish to move into normal, natural, restful sleep, all you need do is breathe slowly and deeply, and say or think, plus twenty, twenty, in your mind.
      The more you give this signal, the deeper you will move into normal, restful sleep.
      This is the end of this H-plus function exercise.
