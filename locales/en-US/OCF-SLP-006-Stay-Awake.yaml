entries:
  hplus.function.ocf-slp-006.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to call upon

      immediate mental and physical alertness when

      an essential need requires you to remain awake.'
  hplus.function.ocf-slp-006.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-SLP-006
      allowed:
      - cue.primary
    text: 'From this moment forward, you have the ability

      to call upon a powerful state of waking alertness

      whenever an essential, immediate need arises.


      When you must remain awake and responsive,

      bring the present need clearly into your awareness.

      Know what requires your attention and action.


      Inhale deeply and gently hold your breath.

      Think or say in your mind,

      "{{ cue.primary }}."

      Then exhale slowly through your mouth.


      Immediately, your total self will begin to shift

      into clear, active, focused wakefulness.

      Your thoughts will become sharp and orderly.

      Your awareness will brighten and become steady.

      Your mind will recognize what matters now.


      Your eyes, hearing, and other senses will work

      together in clear awareness of your surroundings.

      Your physical body will become responsive,

      coordinated, and ready for the action required.


      Feel heaviness and mental dullness receding.

      Your attention will gather around the present need.

      Unnecessary thoughts will fall away,

      leaving calm, decisive, wakeful awareness.


      Your conscious mind, subconscious awareness,

      and physical body will cooperate as one,

      directing their available strength and energy

      toward remaining alert in this essential moment.


      This response is temporary and purposeful.

      It will serve the immediate need for wakefulness,

      then give way naturally when that need has passed

      and you can allow yourself to rest.


      The ability to call upon this alertness

      will remain permanently available within you,

      without keeping you continually stimulated.

      Each time you use this function,

      the response will become clearer,

      easier, and more effective.'
  hplus.function.ocf-slp-006.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-SLP-006
      allowed:
      - cue.primary
    text: 'Remember, when an essential need requires

      immediate waking alertness, inhale deeply

      and hold your breath.

      Think or say in your mind,

      "{{ cue.primary }}."

      Then exhale slowly through your mouth.


      This concludes your OCF Stay Awake exercise.'
