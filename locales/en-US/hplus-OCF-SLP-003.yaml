    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Sweet Dreams/Sweet Dreams.txt; SHA-256 5bae75dc8c9da67c1e51a2d6aeac79bdc4b665bcbf19bcd04af4054ab5dde3d3; lines 37–69. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Numeric transcript labels inside the selected body are retained for review; trailing Thank you excluded.'
    text: |-
      At any point in the future, whenever you desire to have your own special dream experience,
      all you need do is think calmly and easily of the pattern you wish to dream.
      Then inhale deeply and hold your breath.
      Say in your mind, plus, theme, dream, sleep.
      Then exhale and breathe slowly and deeply.
      When you do this, you will move calmly and easily into normal and natural sleep
      and your total self will act upon the dream pattern of your desire
      and compose and conduct you through a similar dream experience
      which you will remember joyfully and in great detail when you awaken.
      The more you use this way to experience and remember a special dream,
      the easier it will become.
