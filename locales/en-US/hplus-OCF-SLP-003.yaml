    text: |-
      From this moment forward, you can choose
      the dreams you desire to experience during sleep.

      Whenever you wish to dream a particular dream,
      bring its theme clearly into your awareness.
      It may be a place, a person, an experience,
      a question, a possibility, or a world of your creation.

      Picture what you wish to experience.
      Know how you wish the dream to feel.
      Include the sights, sounds, sensations,
      and emotions that give your dream its character.

      Inhale deeply and gently hold your breath.
      Think or say in your mind, "{{ cue.primary }}."
      Then exhale and breathe slowly and deeply.

      You will move calmly and easily
      into peaceful, normal, natural sleep.
      As you sleep, your total self will receive
      the pattern you have chosen and begin
      composing a dream experience around it.

      Your conscious intention, subconscious awareness,
      and higher self will work together,
      shaping a living dream of images, feelings,
      movement, and meaningful experience.

      The dream may unfold in ways beyond
      what you first imagined, while remaining
      connected to the theme you have selected.
      You will experience it naturally and vividly,
      allowing each scene to lead into the next.

      When you awaken, the dream will return
      clearly to your awareness. You will remember
      its scenes, sensations, emotions, and details
      with joy, and recognize the experience as your own.

      This ability to choose, experience, and remember
      your dreams will remain permanently available.
      Each time you use {{ cue.primary }},
      your dream experiences and their recall
      will become clearer, richer, and easier.

