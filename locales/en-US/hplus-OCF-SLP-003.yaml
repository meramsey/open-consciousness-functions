      Remember to experience the dream you wish.
      All you need to do is think of your dream desire.
      Inhale and hold your breath.
      Say in your mind, plus, theme, dream, sleep.
      Then exhale and breathe slowly and deeply.
      This is the end of this function learning exercise.
