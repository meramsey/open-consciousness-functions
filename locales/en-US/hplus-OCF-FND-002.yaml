entries:
  hplus.function.ocf-fnd-002.opener:
    status: reviewed
    version: 1.3.0
    text: |-
      This OCF exercise will strengthen your ability
      to focus your attention completely,
      whenever and wherever you choose.
  hplus.function.ocf-fnd-002.function-body:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-FND-002
      allowed:
      - cue.primary
    text: |-
      From this moment forward, your ability to direct
      and sustain your attention is becoming stronger,
      clearer, and more effective.

      Whenever you wish to focus completely,
      choose the activity, thought, or experience
      to which you desire to give your attention.

      Inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      Your mind, body, and senses will immediately
      bring their attention together, directing
      your awareness toward the purpose you have chosen.

      Your concentration will become clear,
      steady, and unwavering.

      Unnecessary distractions will fade away,
      and your attention will remain naturally
      centered on what matters to you.

      You will perceive important details clearly,
      understanding what you see, hear, feel,
      and experience with greater awareness.

      The information you attend to will become
      vivid and distinct in your memory,
      ready for clear and accurate recall.

      You will remain bright, alert, calm,
      confident, and completely at ease.

      From this moment forward, this ability
      to focus your attention is permanently
      available to you whenever you desire.

      Once you select your focus, your mind
      will maintain it smoothly and naturally,
      without unnecessary strain or effort.

      You remain in complete control,
      able to direct or shift your attention
      whenever you choose.

      Each time you use {{ cue.primary }},
      concentration becomes easier, stronger,
      and more effective.

      Your natural ability to focus will continue
      improving through every experience,
      becoming an effortless part of your daily life.
  hplus.function.ocf-fnd-002.closer:
    status: reviewed
    version: 1.4.0
    cue_template:
      function_id: OCF-FND-002
      allowed:
      - cue.primary
    text: |-
      Remember, whenever you wish to focus your attention
      completely, choose what you desire to concentrate on.

      Inhale deeply and hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      This concludes your OCF Focus exercise.
