schema_version: "1.0"
locale: en-US
domain: narration
entries:
  hplus.function.ocf-fnd-002.opener:
    status: reviewed
    version: "1.1.0"
    notes: Reference-derived candidate; Attention lines 1–2 (shared preparation removed at the existing preview boundary). Wording review pending. H plus→OCF terminology applied per user directive.
    text: This is your OCF function exercise to focus your attention.
  hplus.function.ocf-fnd-002.function-body:
    status: reviewed
    version: "1.1.0"
    notes: Reference-derived candidate; Attention lines 31–50. Both source repetitions retained. Reuse this one key for all session passes. Wording review pending. Duplicate passage removed per user preference.
    text: |-
      From this moment on, when you want to focus your attention narrowly and closely,
      all you need do is inhale, hold your breath, and say in your mind,
      plus focus. When you do this, your mind and body will direct and hold all your senses,
      all your thoughts, and all of your thinking into one area of activity, whatever you so desire.
      When you do focus your attention by this method, you will remember in great detail
      all of that which you perceive and experience, and you will feel good,
      bright, and calmly sure. All of these will be yours when you inhale deeply and hold your
      breath and say, plus, focus in your mind, and then exhale through your mouth as if you
      were blowing out a candle. The more you perform this exercise of focusing your attention,
      the easier and more effective it will become.
  hplus.function.ocf-fnd-002.closer:
    status: reviewed
    version: "1.1.0"
    notes: Reference-derived candidate; Attention lines 84–86. Wording review pending. H-plus→OCF terminology applied per user directive.
    text: |-
      Remember, whenever you wish to focus your attention completely, all you need to do is
      inhale, hold your breath, and say or think in your mind, plus. Focus. Then exhale slowly,
      like blowing out a candle. Use it. This is the end of this OCF function exercise.
