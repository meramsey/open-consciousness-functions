    status: reviewed
    version: 1.1.0
    text: |-
      Remember, for immediate and temporary de-tuning of a new, non-chronic
      discomfort or pain signal, bring the exact body area clearly into your mind.

      Inhale deeply and hold your breath.

      Say in your mind:

      PLUS-GO NUMB, GO NUMB.

      Then exhale slowly through your mouth.

      When the temporary effect is no longer desired, use:

      PLUS-RELEASE.

      This is the end of your OCF Function learning exercise.
