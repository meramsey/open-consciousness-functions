    text: |-
      Beginning now, from this moment on, more and more your nerve system is responding
      more rapidly and evenly to coordinate signals to your muscles.
      And your muscle system is acting upon such signals so as to provide the entire body
      with easy and rapid movement, smoothly and evenly.
      This process is becoming more and more effective each hour, each week, each year that you live.
      Also, at any point in the future, whenever you desire to increase even more this ability
      to let your body move smoothly, gracefully, and evenly, all you need do is inhale,
      hold your breath, and say in your mind,
      Plus, smooth, fast, then exhale slowly through your mouth as if you're blowing out a candle.
