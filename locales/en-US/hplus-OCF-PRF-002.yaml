    notes: 'Reference-derived wording; transcript_unverified. SOURCE +Transcripts From available tapes/Eight-Great/Eight-Great.txt; SHA-256 7ac620d57646f6f4e4c29193bc31ffc3ad17e6d70b4248de879c816fc8f1ba0f; lines 210–215. Human wording review: user approved closer unchanged. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      Increase even more the strength of your total inner self into your life activity.
      All you need do is inhale deeply.
      Hold your breath. Say or think in your mind.
      Plus. Eight. Great.
      Then exhale slowly and easily.
      This is the end of your function learning exercise.
