    text: Now, learn to use the inner strength that is you.
  hplus.function.ocf-prf-002.function-body:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Eight-Great/Eight-Great.txt; SHA-256 7ac620d57646f6f4e4c29193bc31ffc3ad17e6d70b4248de879c816fc8f1ba0f; lines 33–49 (starts at ''beginning now''). Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Body begins with the function-specific continuation on the same line as the shared opening; consolidation at 50–53 excluded.'
    text: |-
      beginning now right at this moment, from
      this moment forward, more and more, you will know again the greatness and power that you
      are in your total self.
      With such greatness and power, you will calmly, surely, and easily meet and handle any
      questions, problems, and special moments in your life activities.
      You will then perform and function smoothly, quickly, and correctly, and with quiet happiness
      because you know the strength of your total capability.
      Such knowing and such knowledge of your total self will become more and more apparent
      to you each day, each month, each year in the time to come.
      So, at any time in the future when you desire to increase even more, even more rapidly,
      this knowledge and knowing of your total self, all you need do is inhale, hold your
      breath, and say in your mind, plus, eight, great, then exhale as if you are blowing
      out a candle.
      When you do this, you will even increase more and more this knowing and knowledge of
      your total self.
      The more you perform this pattern of greatness, the easier and more quickly and more
      effective it will become.
  hplus.function.ocf-prf-002.closer:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Eight-Great/Eight-Great.txt; SHA-256 7ac620d57646f6f4e4c29193bc31ffc3ad17e6d70b4248de879c816fc8f1ba0f; lines 210–215. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Body begins with the function-specific continuation on the same line as the shared opening; consolidation at 50–53 excluded.'
    text: |-
      Increase even more the strength of your total inner self into your life activity.
      All you need do is inhale deeply.
      Hold your breath. Say or think in your mind.
      Plus. Eight. Great.
      Then exhale slowly and easily.
      This is the end of your function learning exercise.
