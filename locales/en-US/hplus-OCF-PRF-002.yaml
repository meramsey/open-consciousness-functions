entries:
  hplus.function.ocf-prf-002.opener:
    status: reviewed
    version: 1.1.0
    text: |-
      This OCF exercise will teach you to recognize
      and express the greatness, strength, and power
      of your total self in every part of your life.
  hplus.function.ocf-prf-002.function-body:
    status: reviewed
    version: 1.1.1
    cue_template:
      function_id: OCF-PRF-002
      allowed:
      - cue.primary
    text: |-
      Beginning now, and from this moment forward,
      you will recognize more fully the greatness
      and power that are already within your total self.

      Your conscious mind, subconscious mind,
      higher self, and entire being are united
      in the knowledge of your true inner strength.

      This greatness is a natural part of who you are.
      You will recognize it clearly, trust it completely,
      and express it calmly in your daily life.

      Whenever you encounter questions, challenges,
      or important moments, your total self will respond
      with wisdom, clarity, strength, and assurance.

      You will think and act smoothly, quickly,
      and effectively, drawing upon the full range
      of your abilities without strain or hesitation.

      You will meet life's experiences with quiet happiness,
      calm confidence, and the certainty that your
      inner resources are available whenever needed.

      Each day, your awareness of the strength,
      knowledge, and capability of your total self
      will become clearer and more complete.

      This knowing is permanently established within you,
      growing naturally through everything you experience.

      Whenever you wish to bring this awareness
      even more strongly into your life,
      inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      Your awareness of your total self will immediately
      become stronger, clearer, and more complete.
      You will feel and express your natural inner power
      with calmness, confidence, and ease.

      The more you use {{ cue.primary }},
      the easier and more effective this recognition
      and expression of your total self will become.
  hplus.function.ocf-prf-002.closer:
    status: reviewed
    version: 1.1.1
    cue_template:
      function_id: OCF-PRF-002
      allowed:
      - cue.primary
    text: |-
      Remember, whenever you wish to strengthen
      your awareness and expression of your total self,
      inhale deeply and hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      This concludes your OCF Inner Power exercise.
