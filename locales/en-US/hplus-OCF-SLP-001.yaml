    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Restorative Sleep/Restorative Sleep.txt; SHA-256 059b990045c92c24597d27bba2795a4c825f5113799809cbba4101428f7d9411; lines 33–52 (starts at ''At any time''). Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Body starts within the shared-opening line so the complete instruction is retained; frozen Sleep Easy pilot decisions are unchanged. Duplicate passage removed per user preference.'
    text: |-
      At any time from this moment forward, whenever
      you wish to restore and heal your physical body while you sleep, all you need
      do is inhale deeply, hold your breath, and say or think in your mind, plus, heal,
      heal, then exhale slowly as if you were blowing out a candle. When you do this,
      you will move easily and calmly into deep, restful sleep. And during such sleep,
      while you sleep this deep, restful sleep, your body will so adjust, equalize,
      and balance as to restore and regenerate all those areas within your total self to
      their normal, natural being. You then will wake up rested and refreshed, full of
      vital energy, better and stronger in every way. The more you use this way to
      become more balanced and equalized, the easier it will become.
