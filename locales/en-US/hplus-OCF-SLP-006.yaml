schema_version: '1.0'
locale: en-US
domain: narration
entries:
  hplus.function.ocf-slp-006.opener:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF adaptation of user-proposed Stay Awake reconstruction; proposed input
      Stay Awake/Stay_Awake_881001_reconstructed_clean.txt; SHA-256
      f21255d2ca3bb77c2619d726fd9d1d70e1c7fc7334cce2672696a3b0775dae4e;
      input line 47. Source unavailable and authenticity unverified. Emphasizes
      consciously invoked, temporary alertness for an essential immediate need.
      Rights: user_cleared per user's lawyer-clearance attestation. Finished-session release remains pending.
    text: |-
      This OCF exercise will teach you to call upon
      immediate mental and physical alertness when
      an essential need requires you to remain awake.

  hplus.function.ocf-slp-006.function-body:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF adaptation of user-proposed Stay Awake reconstruction; proposed input
      Stay Awake/Stay_Awake_881001_reconstructed_clean.txt; SHA-256
      f21255d2ca3bb77c2619d726fd9d1d70e1c7fc7334cce2672696a3b0775dae4e;
      input lines 146–191. Historical transcript not recovered and authenticity
      unverified. Preserves the exact five-part spoken command Plus One Awake
      Alert One One, inhale-hold-command-exhale sequence, immediate temporary
      alertness intention, clear cognition and senses, and focused responsive
      movement. OCF adaptation strengthens coordinated total-self wakeful
      awareness and the distinction between a temporary invocation and the
      learned ability remaining available. Specific scenarios, repeated command
      rehearsal, and non-narrative precaution language omitted. The exercise
      does not establish verified resistance to sleep deprivation or involuntary
      sleep. One reusable body supports four passes across Focus 11 and Focus 20.
      Rights: user_cleared per user's lawyer-clearance attestation. Finished-session release remains pending.
    cue_template:
      function_id: OCF-SLP-006
      allowed: [cue.primary]
    text: |-
      From this moment forward, you have the ability
      to call upon a powerful state of waking alertness
      whenever an essential, immediate need arises.

      When you must remain awake and responsive,
      bring the present need clearly into your awareness.
      Know what requires your attention and action.

      Inhale deeply and gently hold your breath.
      Think or say in your mind,
      "{{ cue.primary }}."
      Then exhale slowly through your mouth.

      Immediately, your total self will begin to shift
      into clear, active, focused wakefulness.
      Your thoughts will become sharp and orderly.
      Your awareness will brighten and become steady.
      Your mind will recognize what matters now.

      Your eyes, hearing, and other senses will work
      together in clear awareness of your surroundings.
      Your physical body will become responsive,
      coordinated, and ready for the action required.

      Feel heaviness and mental dullness receding.
      Your attention will gather around the present need.
      Unnecessary thoughts will fall away,
      leaving calm, decisive, wakeful awareness.

      Your conscious mind, subconscious awareness,
      and physical body will cooperate as one,
      directing their available strength and energy
      toward remaining alert in this essential moment.

      This response is temporary and purposeful.
      It will serve the immediate need for wakefulness,
      then give way naturally when that need has passed
      and you can allow yourself to rest.

      The ability to call upon this alertness
      will remain permanently available within you,
      without keeping you continually stimulated.
      Each time you use this function,
      the response will become clearer,
      easier, and more effective.

  hplus.function.ocf-slp-006.closer:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-adapted closer based on user-proposed Stay Awake reconstruction;
      proposed input Stay Awake/Stay_Awake_881001_reconstructed_clean.txt;
      SHA-256 f21255d2ca3bb77c2619d726fd9d1d70e1c7fc7334cce2672696a3b0775dae4e;
      input lines 312–324. Historical source unavailable and authenticity
      unverified. Contains one purpose reminder, exact command and breathing
      sequence, and standard OCF ending. Rights: user_cleared per user's
      lawyer-clearance attestation. Finished-session release remains pending.
    cue_template:
      function_id: OCF-SLP-006
      allowed: [cue.primary]
    text: |-
      Remember, when an essential need requires
      immediate waking alertness, inhale deeply
      and hold your breath.
      Think or say in your mind,
      "{{ cue.primary }}."
      Then exhale slowly through your mouth.

      This concludes your OCF Stay Awake exercise.
