  hplus.function.ocf-slp-006.function-body:
    status: reviewed
    version: 1.1.0
    text: |-
      At any time from this moment forward, whenever an essential need exists for
      you to restore full mental and physical alertness, inhale deeply and hold
      your breath.

      Then say or think in your mind:

      PLUS-ONE, AWAKE, ALERT, ONE, ONE.

      Then exhale slowly through your mouth.

      When you do this, your mind and physical body will begin immediately to
      move into full waking alertness.

      Your mind will become clear, quick and awake.

      Your thoughts will move cleanly and easily.

      Your attention will remain upon the act, event or condition before you.

      Your physical body will become awake, active and responsive.

      Your eyes will see clearly.

      Your hearing and all of your other physical senses will operate cleanly
      and sharply.

      Heaviness and dullness will fade.

      The impulse to drift into sleep will move into the background.

      You will remain mentally and physically alert for the essential activity
      before you.

      All when you state:

      PLUS-ONE, AWAKE, ALERT, ONE, ONE.

      This restoration of alertness is immediate and temporary.

      Use it only when the need is essential, such as when driving or in a
      similar situation.

      This Function is not for continuous application.

      The more you use this Function, the easier and more effective it will become.
