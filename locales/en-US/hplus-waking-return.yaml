locale: en-US
domain: narration
entries:
  hplus.shared.waking.begin:
    status: reviewed
    version: "1.0.0"
    text: |-
      I'm going to count now from twenty down to one, and when I reach the count of one,
      you will be completely wide awake and rested both physically and mentally. All of your
      senses will be operating clearly, cleanly, strongly, sharply, and beautifully. All when
      I reach the count of one. I'm going to count now. Twenty. Nineteen. Eighteen.
      Seventeen. Sixteen.
      Fifteen. Fourteen.
      Thirteen. Twelve.
      Eleven. Ten.
      Nine. Eight. Seven.
      When I reach the count of one, you will be completely wide awake both physically
      and mentally, and completely refreshed and full of new energy, with all of your five
      physical senses operating clearly, cleanly, sharply, and beautifully. All when I reach
      the count of one. Seven. Six. Five. Four. Three. Two. One. Wake up. Wake up. Open
      your eyes. You're completely wide awake and full of new energy.
