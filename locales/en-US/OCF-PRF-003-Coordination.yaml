entries:
  hplus.function.ocf-prf-003.opener:
    status: reviewed
    version: 1.1.0
    text: |-
      This OCF exercise will strengthen the synchronization
      of your mind, nervous system, and muscles,
      allowing your body to move smoothly, rapidly,
      precisely, and with natural ease.
  hplus.function.ocf-prf-003.function-body:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-PRF-003
      allowed:
      - cue.primary
    text: |-
      Beginning now, and from this moment forward,
      your mind, nervous system, and muscles
      will work together in ever greater harmony.

      Signals throughout your nervous system
      will travel smoothly, evenly, and rapidly.
      Your muscles will respond in precise coordination,
      producing the movement you intend
      at exactly the time it is needed.

      Your entire body will move with greater balance,
      grace, accuracy, and natural ease.
      Each motion will flow into the next,
      without unnecessary hesitation, tension, or effort.

      Your awareness of your body's position,
      movement, and timing will become clearer.
      Your hands, feet, eyes, and entire physical system
      will coordinate naturally as one.

      When quick movement is needed,
      your responses will be swift and accurate.
      When careful control is needed,
      your movements will be steady and precise.
      Speed and smoothness will work together,
      each in harmony with your intention.

      This improved coordination will become
      an increasingly natural part of your daily life,
      growing stronger through movement and experience.
      You will not need to consciously manage
      each separate muscle or action.
      Your total self will coordinate them together.

      Whenever you wish to strengthen
      this synchronization even further,
      inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      Your entire physical system will immediately
      come into clearer, smoother coordination,
      responding with effortless speed and control.

      Each time you use {{ cue.primary }},
      this natural harmony of mind and body
      will become easier, stronger, and more effective.
  hplus.function.ocf-prf-003.closer:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-PRF-003
      allowed:
      - cue.primary
    text: |-
      Remember, whenever you wish to increase
      the speed, smoothness, and coordination
      of your movement, inhale deeply
      and hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      This concludes your OCF Coordination exercise.
