    version: 1.1.0
    notes: >-
      OCF-adapted narration based on the unverified Passages
      transcript. Original SOURCE +Transcripts From available
      tapes/Passages/Passages.txt;
      SHA-256 d5376e95889c5200e9f081ca6c61b7bca72e23080a6838ef7dbbfbd7f0d69a88;
