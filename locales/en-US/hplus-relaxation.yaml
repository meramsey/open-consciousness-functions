schema_version: "1.0"
locale: en-US
domain: narration
entries:
  hplus.shared.relaxation.begin:
    status: reviewed
    version: "1.0.0"
    text: |-
      Now you will begin the 10-point system of total relaxation.
      By the time you reach the count of ten, your body will be totally and completely relaxed
      in all parts, in all ways.
      The higher the number, the more deeply relaxed you will become.
  hplus.shared.relaxation.face:
    status: reviewed
    version: "1.0.0"
    text: |-
      First, let your jaw, the muscles of your jaw, let them go limp.
      Relax.
      Let the muscles and nerves of your jaw go limp.
      Relax.
      Now your eyelids.
      Let your eyelids relax.
      Go limp.
      Now your lips.
      Let the muscles and nerves of your lips relax.
      Relax easily and go limp.
      Now the muscles in your forehead.
      let the muscles in your forehead relax go limp now the muscles in your cheeks
      in each cheek let them relax the muscles in your cheeks relax and go limp
      now the muscles in your scalp over the top of your head in your scalp let the
      muscles in your scalp relax, relax. Now the muscles in your neck, let the muscles in your
      neck relax, relax. Now your eyes, let the muscles in your eyes, the muscles that control
      your eyes, let them relax, relax. Now let this relaxation of the nerves and muscles
      in your head. Let this relaxation sink inward. Let it sink inward. Let it flow into your
      brain. Let it flow into your brain. Let this relaxation flow into your brain. Let it flow
      and sink easily and deeply into your brain feel it sinking inward easily and
      calmly until your entire brain feels more and more relaxed more and more
      relaxed now that your brain feels and understands this relaxation now that it
      feels and understands this relaxation.
  hplus.shared.relaxation.shoulders:
    status: reviewed
    version: "1.0.0"
    text: |-
      As I count to 10, let this relaxation flow from your brain.
      Flow from your brain into every part of your physical body.
      Two, your relaxed brain tells your neck and shoulders to relax.
      Let go.
      Sleep.
  hplus.shared.relaxation.hands:
    status: reviewed
    version: "1.0.0"
    text: |-
      Three. Your arms. Your brain tells your arms to relax. Let go. Sleep. Your brain tells
      your hands and fingers. Each hand and each finger. Relax. Let go. Sleep.
  hplus.shared.relaxation.torso:
    status: reviewed
    version: "1.0.0"
    text: |-
      Your brain
      tells your back, up and down your back, each muscle and nerve in your back to relax, let
      go, sleep.
      Six.
      Your brain tells your upper body, your chest, your heart, your lungs, your diaphragm.
      Your brain tells this part and these parts of your physical body to relax.
      Let go.
      Sleep.
      Seven.
      Your brain tells your lower body.
      Your abdomen.
      Your abdomen down to your hips.
      Your kidneys.
      Your liver.
      Your stomach.
      your intestines, your genitals.
      Your brain tells all of these parts in your lower body to relax and let go.
      Sleep.
  hplus.shared.relaxation.legs:
    status: reviewed
    version: "1.0.0"
    text: |-
      Your brain tells your hips, each hip, the muscles and nerves in each hip, to relax.
      Let go, sleep.
      Your brain tells your legs, each leg from your hip down to your foot, your legs.
      Your brain tells the muscles and nerves in your legs to relax.
      Let go, sleep.
      Your feet and your toes.
      Your brain tells the muscles and nerves in each foot and each toe to relax.
      Let go.
      Sleep.
