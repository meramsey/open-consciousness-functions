      Now bring into your awareness
      A time when you felt strong
      Agile
      Alert
      Vigorous
      Vigorous
      And very alive
      Now say in your mind
      Plus
      Energize
      From your knowledge and experience
      Reach in deeper
      Reach in
      Reach in and perceive the energy
      Behind the experience
      The energy source that created and constructed all of what you are
