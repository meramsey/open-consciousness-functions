      The pure energy of you
      The energy that you use so easily without trying
      The energy you use to think and be
      The energy that you are
      Now explore this energy
      Move in and discover the original
      Pure source of it
      You can do this calmly and easily and serenely
      Because it is you
      It is simply a knowing
      Become completely familiar with it
      Then gather a portion of it together for a special use
      Become familiar with this energy
      Begin this exploration now

      Now you are just as you were, but with the knowledge of the energy that waits within you.
      For you to direct, for you to use, because it is you.
      Call it your M energy.
      At any point in the future when you wish to direct this energy, whenever and however you so desire,
      all you need to do is say in your mind, plus energize,
      and then picture the form in which you will use it.
      Here it is again. At any point in the future when you wish to direct this energy,
      when you wish to direct this energy, this M energy,
      whenever and however you so desire,
      all you need to do is say in your mind, plus energize,
      then picture the form in which you will use it.

      The more you willfully direct this pure M energy, the easier and more effective it will become.
