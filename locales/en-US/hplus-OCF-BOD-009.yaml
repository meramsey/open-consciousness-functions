  hplus.function.ocf-bod-009.function-body:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-adapted narration based on the partial, unverified Lung
      Support and Maintenance transcript. Original SOURCE
      +Transcripts From available tapes/Lung Support and Maintenance/Lung Support and Maintenance.txt;
      SHA-256 f390b85a71f1c00cc1f5c16708e7f0981da0d588edb67a26f365555a2dac2f87;
      lines 31–59. Original reference remains unchanged.
      The narration has been reorganized into airway function,
      natural filtration, lung gas exchange, respiratory muscle
      coordination, cellular maintenance, automatic regulation,
      conscious activation, and reinforcement.
      Source references to waving follicles are clarified as
      cilia, and oxygen exchange is described through the alveoli.
      Suggestions of tissue replacement have been adapted to
      natural cellular maintenance and renewal rather than
      guaranteed regeneration of damaged lung structures.
      OCF-authored suggestions establish lasting, automatic,
      appropriately regulated respiratory maintenance.
      The exact Plus Breathe Better activation command and
      breathing sequence are preserved. One reusable body is
      intended for four playback passes across Focus 11 and
      Focus 20. Shared preparation, state, return wording,
      and consolidation at lines 60–63 remain excluded.
      Affirmative suggestions express the intended exercise,
      not medically established treatment effects.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    text: |-
      From this moment forward, your entire respiratory
      system is becoming stronger, healthier,
      and more efficient.

      Bring your awareness to your nose, throat,
      airways, and lungs, working together
      to provide the oxygen your body needs.

      Feel your nasal passages becoming clear
      and comfortable, allowing air to flow
      smoothly and naturally.

      Tiny protective cilia help move mucus
      and trapped particles out of your airways,
      while incoming air is warmed and moistened.

      Your airways remain clear and open,
      supporting smooth, comfortable breathing.

      Now bring your awareness to your lungs.

      Deep within them, millions of tiny air sacs
      called alveoli exchange oxygen and carbon dioxide.

      Oxygen passes into your bloodstream,
      while carbon dioxide moves from your blood
      into your lungs to be released as you exhale.

      This exchange is becoming smoother,
      more balanced, and more efficient.

      Your diaphragm and breathing muscles
      work together with strength and coordination,
      moving air naturally and without unnecessary effort.

      Your body's natural processes of cellular
      maintenance and renewal continually support
      the healthy function of your respiratory system.

      From this moment forward, this pattern
      of efficient breathing and maintenance
      is permanently established within you.

      Whether awake, resting, or sleeping,
      your breathing continues automatically,
      adjusting smoothly to your body's needs.

      Your respiratory system maintains
      its natural strength, flexibility,
      and efficient function without conscious effort.

      Whenever you wish to reinforce this
      improving pattern, inhale deeply
      and gently hold your breath.

      Think or say in your mind, "Plus Breathe Better."

      Then exhale slowly through your mouth.

      Your breathing will become smoother,
      easier, and more efficient,
      strengthening this established pattern
      of healthy respiratory function.

      Each time you use Plus Breathe Better,
      this reinforcement becomes easier,
      faster, and more effective.

      Your respiratory system will continue
      its natural maintenance and renewal
      automatically, every day and every night.

  hplus.function.ocf-bod-009.closer:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-authored closer adapted from the previously approved
      suggestion. The partial Lung Support and Maintenance
      transcript ends in ellipsis runs and supplies no
      recoverable function-specific closer. This is not
      historical transcript wording. The closer has been
      shortened to the standardized OCF format: one purpose
      reminder, the exact Plus Breathe Better activation
      command and breathing sequence, and the closing sentence.
      Additional reinforcement is reserved for the function body.
      Historical source remains partial_transcript and unverified.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    text: |-
      Remember, whenever you wish to reinforce
      your respiratory system's natural strength
      and healthy function, inhale deeply
      and hold your breath.

      Think or say in your mind, "Plus Breathe Better."

      Then exhale slowly through your mouth.

      This concludes your OCF Breathe Better exercise.
