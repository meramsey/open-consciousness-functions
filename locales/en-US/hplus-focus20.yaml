entries:
  hplus.shared.focus20.enter:
    status: reviewed
    version: "1.0.0"
    notes: Preserve the approved "Fifteen. Sixty." wording; do not silently repair counts.
    text: |-
      You will move now into easy and normal, restful sleep as I guide you. When I reach
      the count of twenty, you will be in normal, natural, restful sleep. Remember, the higher
      the number, the more deeply relaxed you become, and the more you drift easily and calmly into
      natural, complete sleep. I'm going to count now. Ten. Eleven.
      Twelve. Thirteen.
      Fourteen.
      Fifteen. 
      Sixteen.
      Seventeen.
      Eighteen.
      Nineteen.
      Twenty. 
      Twenty.
