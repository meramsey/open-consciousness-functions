    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Tune-Up/Tune-Up.txt; SHA-256 1ad524e718e8a18952c533321d45ecb98e6745d27c5b45fbb67a51ab93430ff1; lines 190–196. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. '
    text: |-
      Remember to perceive and balance any portion of your physical body.
      All you need to do is close your eyes.
      Inhale deeply and hold your breath.
      Look with your closed eyes at that portion of your body system that concerns you.
      And say in your mind, plus, balance, heal.
      Then exhale slowly through your mouth and open your eyes.
      This is the end of your H Plus Function Learning Exercise.
