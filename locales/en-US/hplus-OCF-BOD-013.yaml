    text: |-
      From this moment forward, your body's natural
      processes of balance, healing, and regeneration
      are becoming stronger, smoother, and more effective.

      Every part of your physical body is supported
      by its natural ability to maintain, repair,
      and renew itself.

      Your body's systems work together in harmony,
      recognizing what needs attention and directing
      the appropriate processes of restoration.

      Your cells, tissues, and organs receive
      the nourishment and support they need
      to maintain their healthy function.

      Whenever an area requires additional care,
      your body's natural processes of healing
      and regeneration will respond,
      restoring strength, balance, and harmony.

      From this moment forward, this pattern
      of whole-body maintenance and renewal
      is permanently established within you.

      Whether awake, resting, or sleeping,
      your body continues these processes
      automatically, without conscious effort.

      Whenever you wish to perceive and improve
      any particular part of your body,
      you can do so quickly and easily.

      Simply close your eyes and bring
      your awareness to the area you wish to improve.

      Look inward and become consciously aware
      of that part of your physical body.

      Take a deep breath in and gently hold it.

      Think or say in your mind,
      "{{ cue.primary }}."

      Then exhale slowly through your mouth
      and open your eyes.

      Your body's natural processes of repair
      and regeneration will respond,
      directing their activity toward the chosen area.

      That part of your body will move steadily
      toward its natural state of health,
      strength, and balanced function.

      Your entire system knows how to coordinate
      these processes and will perform
      them smoothly and effectively.

      Each time you use {{ cue.primary }},
      your ability to perceive and direct
      this process becomes easier,
      faster, and more effective.

      Your body's natural pattern of healing,
      renewal, and balanced maintenance
      will continue automatically,
      every day and every night.
