  hplus.function.ocf-bod-013.function-body:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Tune-Up/Tune-Up.txt; SHA-256 1ad524e718e8a18952c533321d45ecb98e6745d27c5b45fbb67a51ab93430ff1; lines 31–48. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. '
    text: |-
      At any point from this moment forward, whenever you desire to know the condition of any part of your physical body system,
      and then to balance and regenerate such part, all you need do is close your physical eyes, inhale deeply, and hold your breath.
      Look with your closed eyes at that portion of your physical system you wish to know and direct.
      Then say in your mind, plus, balance, heal.
      Then exhale slowly through your mouth and open your eyes.
      When you do this, you will immediately become consciously aware of the condition in that portion of your physical body.
      And your entire system will quickly and smoothly move to bring that portion into a normal, natural, and equalized state of being.
      Your system knows and remembers how to do this, and will so perform when you instruct it by this method.
      The more you perform this method of perceiving and balancing any portion of your physical body system, the easier and more effective it will become.
