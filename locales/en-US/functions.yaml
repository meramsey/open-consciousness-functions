schema_version: "1.0"
locale: "en-US"
domain: "narration"
entries:
  function.learning.attend:
    text: "Listen for what is useful to you, and give yourself room to make sense of it."
    version: "1.0.0"
    status: draft
    notes: "Replaces guaranteed reception in the OCF-owned historical learn shell; deliberate participation, not unconscious reception."
  function.learning.rehearse:
    text: "Treat this as a skill to practice: try the steps deliberately and notice what you can recognize and repeat."
    version: "1.0.0"
    status: draft
    notes: "Replaces automatic installation beneath conscious effort. This repairs the old shell, not final Function Installation wording."
  function.learning.reflect:
    text: "Let the practice rest for now. You can return to it later, recall the steps, and decide how you want to use them."
    version: "1.0.0"
    status: draft
    notes: "Replaces automatic integration beneath awareness with rest, recall and intentional use."
  # Function narration is parameterized by the function record. `command` holds a
  # canonical OCF command (PLUS-...), which is language-independent metadata and
  # is never translated: a localized pack may explain the command in its own
  # grammar, but the command string itself stays as authored. `ocf locale
  # validate` rejects a template whose `command` value is not a real command.
  function.intro.name:
    text: "This exercise is for the {function_name} function."
    variables: ["function_name"]
    version: "1.0.0"
  function.activation.command:
    text: "The activation command is {command}."
    variables: ["command"]
    version: "1.0.0"
    pronunciation:
      PLUS-FOCUS:
        espeak-ng: "[[p l Q s f Q k]]"
        notes: "Compound command spoken letter by letter; hint only, never visible text."
  function.repetition.count:
    text: "Repeat the command {count, plural, one {# more time} other {# more times}}."
    variables: ["count"]
    version: "1.0.0"
  function.release.command:
    text: "Release with {command} when the exercise is complete."
    variables: ["command"]
    version: "1.0.0"
  function.state.eleven.material:
    text: "In the eleventh state, the material for {function_name} is yours to read."
    variables: ["function_name"]
    version: "1.0.0"
