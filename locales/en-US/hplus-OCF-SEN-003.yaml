      scent ability as an OCF extension, canonical commands Plus Smell More
      and Plus Smell Less, and full source eye/breath sequence, followed by
      standard OCF ending. Rights: user_cleared per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    cue_template:
      function_id: OCF-SEN-003
      allowed: [cue.primary]
    text: |-
      Remember, to regulate your perception of aromas
      or strengthen your inner sense of smell, close your eyes,
      inhale deeply, and hold your breath.
      Think or say in your mind, "{{ cue.primary }}"
      or "Plus Smell Less," according to your intention.
      Then exhale slowly through your mouth and open your eyes.

      This concludes your OCF Smell exercise.
