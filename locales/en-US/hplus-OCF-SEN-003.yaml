  hplus.function.ocf-sen-003.function-body:
    status: reviewed
    version: 1.1.0
    text: |-
      At any time from this moment forward, whenever you desire to control the way you smell and perceive odors, all you need do is close your eyes, inhale deeply, and hold your breath.

      Then say or think in your mind, PLUS-SMELL MORE, or PLUS-SMELL LESS.

      Then exhale slowly through your mouth and open your eyes.

      When you do this, if you state more, your sense of smell will become much sharper and clearer.

      You will identify and measure the strength of even the faintest airborne particles to enter your system.

      You will discriminate and enjoy pleasant aromas more fully.

      All when you state PLUS-SMELL MORE.

      When you state PLUS-SMELL LESS, your sense of smell will become less and less sensitive each time you state PLUS-SMELL LESS, until the input from any distracting, disturbing, or unpleasant odor is no longer important.

      Whenever you use this method of smell control, it will continue until you desire to return your sense of smell to its normal condition.

      The more you use this method, the easier and more effective it will become.
    notes: 'User-proposed reconstruction draft; input lines 128–146. User-proposed reconstruction, not a recovered historical transcript. Historical source availability remains unavailable; reimplementation remains planned. Proposed input: Sensory (Smell)/Sensory_Smell_reconstructed_clean.txt; SHA-256 7a1b03b324f5842b5e0c9f4c0a4ae7febaa1a1edfa0c096cf37638c3f3923873; header ''SENSORY: SMELL — RECONSTRUCTED H-PLUS-STYLE AUDIO SCRIPT''. Identity checked against the document title and listed legacy commands, not inferred from the filename. Header claims of confirmation/authenticity are not independently verified. Only selected narration is reused; shared sections, production directions and non-narration prefatory notes remain separate. Suggested input timings are not measured evidence. User-directed terminology edit: proposed GREATER/LESSER cue wording changed to canonical MORE/LESS; original reference remains unchanged. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending.'
  hplus.function.ocf-sen-003.closer:
    status: reviewed
    version: 1.1.0
    text: |-
      Remember, to regulate your sense of smell, inhale deeply and hold your breath.

      Say in your mind, PLUS-SMELL MORE, if you wish to increase your sense of smell, or PLUS-SMELL LESS, if you want to tune down what and how you smell.

      Then exhale slowly through your mouth as if you are blowing out a candle.

      This is the end of your Function learning exercise.
