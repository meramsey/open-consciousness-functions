    text: |-
      This OCF exercise will teach you to regulate your sense
      of smell and strengthen your ability to remember,
      imagine, and experience aromas within your mind.

  hplus.function.ocf-sen-003.function-body:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF adaptation of user-proposed Sensory: Smell reconstruction,
      input lines 128–146; proposed source
      Sensory (Smell)/Sensory_Smell_reconstructed_clean.txt;
      SHA-256 7a1b03b324f5842b5e0c9f4c0a4ae7febaa1a1edfa0c096cf37638c3f3923873.
      Original reconstruction unchanged; authenticity unverified. Retains
      user-canonical Plus Smell More and Plus Smell Less in place of proposed
      GREATER/LESSER wording; closes eyes, inhales, holds, selects command,
      exhales through mouth, then opens eyes. Physical smell adjustment is
      conscious and temporary until changed or returned to normal.
      User-directed OCF enhancement establishes permanently developing
      olfactory imagination, scent recall, and deliberate construction of
      imagined aromas without external odor. Same two commands may reinforce
      the sensory quality of an intended inner scent, without inventing a
      third cue. No claim of verified physical or nonphysical sensory effects.
      One body serves four playback passes across Focus 11 and Focus 20.
      Rights: user_cleared per user's lawyer-clearance attestation.
      Finished-session release remains pending.
    text: |-
      From this moment forward, you have the ability
      to regulate your sense of smell and develop
      the richness of your inner scent awareness.

      Your sense of smell will become more responsive
      to your conscious intention. You can notice
      delicate aromas more clearly or allow unwanted
      odors to fade into the background.

      To increase your perception of smell, close your eyes,
      inhale deeply, and gently hold your breath.
      Think or say in your mind, "Plus Smell More."
      Then exhale slowly through your mouth and open your eyes.

      Faint scents will become clearer and more distinct.
      You will recognize subtle differences between aromas
      and appreciate their character and richness.

      To reduce the prominence of an unwanted odor,
      use the same eye and breathing sequence,
      thinking or saying, "Plus Smell Less."
      Its presence in your awareness will grow quieter,
      while you remain free to change your adjustment
      or return to your usual sense of smell.

      Your inner sense of smell will also grow stronger.
      You will recall familiar fragrances and imagine
      new ones, even when no physical aroma is present.
      You can bring a remembered scent into awareness,
      hold it clearly, distinguish its subtle qualities,
      and combine or transform aromas through imagination.

      Your mind will connect scents with memories,
      places, experiences, and images more vividly.
      This ability to imagine and remember aromas
      will become a lasting part of your total self.

      Whenever you choose, your intention and these
      commands can help make an inner aroma more vivid
      or let an imagined scent gently fade.

      With each use, your physical smell regulation
      and inner scent imagery will become easier,
      clearer, and more effective.

  hplus.function.ocf-sen-003.closer:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-adapted concise closer based on proposed reconstruction,
      input lines 252–258; source
      Sensory (Smell)/Sensory_Smell_reconstructed_clean.txt;
