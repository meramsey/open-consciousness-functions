    notes: 'User-provided human wording based on the transcript_unverified candidate. Original SOURCE +Transcripts From available tapes/Eat-No Eat/Eat-No Eat.txt; SHA-256 3e39ac300dbbb7d9b1d1f659f1d238147283a5ca0a602767a7f275eaaf09292f; candidate lines 17–35. The transcript passage contains omissions and apparent ASR errors; this approved working wording is not a verbatim transcript or a correction to SOURCE. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      At any point from this moment on, whenever you feel hungry for food and you consciously desire not to eat, all you need do is inhale and hold your breath, then say or think in your mind plus, satisfied, supplied and exhale slowly and easily.
      When you do this, your system will quickly and easily turn down
      and diminish all signals of hunger or food that may be reaching your brain.
      Your sense of smell will reject any aroma of food.
      Your sense of taste will turn off any response to food that may reach it, and your entire system will seek and obtain new energy by other means, other ways.
      The more you use this method of directing your appetite for food, the easier it will become.
