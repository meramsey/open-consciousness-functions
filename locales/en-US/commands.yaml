  functions.ocf-bod-005.lifecycle.scopes.capability.description: The ability to recognize unnecessary
    cravings and choose deliberately remains available.
  functions.ocf-bod-005.lifecycle.scopes.baseline.description: Appetite awareness and deliberate eating
    choices persist while genuine nutritional needs and freedom to eat remain intact.
  functions.ocf-bod-005.lifecycle.scopes.application.description: Conscious release of one selected unnecessary
    craving; not permanent hunger suppression.
  functions.ocf-cog-004.lifecycle.scopes.capability.description: Learned imprinting ability remains available.
  functions.ocf-cog-004.lifecycle.scopes.baseline.description: Deliberately imprinted material is retained
    and maintained; storage is distinct from an individual recall action.
  functions.ocf-cog-004.lifecycle.scopes.application.description: A single deliberate imprint or recall
    invocation; no continuously running imprinting or recall.
  functions.ocf-cog-005.lifecycle.scopes.capability.description: The ability to explore possibilities
    remains available.
  functions.ocf-cog-005.lifecycle.scopes.baseline.description: Connections and insights continue forming
    in the background; no selected situation remains permanently active.
  functions.ocf-cog-005.lifecycle.scopes.application.description: One consciously chosen, situation-focused
    exploration.
  functions.ocf-prf-004.lifecycle.scopes.capability.description: The learned movement ability remains
    available.
  functions.ocf-prf-004.lifecycle.scopes.baseline.description: The everyday movement pattern continues
    without conscious cue use.
  functions.ocf-prf-004.lifecycle.scopes.application.description: Optional conscious reinforcement of
    the movement baseline; not permanently intensified movement.
  functions.ocf-aut-001.lifecycle.scopes.capability.description: The ability to develop automatic skills
    remains available.
  functions.ocf-aut-001.lifecycle.scopes.baseline.description: Correctly learned selected skill patterns
    are retained; each performance remains observable, adjustable and stoppable.
  functions.ocf-aut-001.lifecycle.scopes.application.description: One deliberate cue invocation or chosen
    performance; not continuously performing an action.
  functions.ocf-bod-007.lifecycle.scopes.capability.description: The ability to reinforce cardiovascular
    awareness and relaxation remains available.
  functions.ocf-bod-007.lifecycle.scopes.baseline.description: The narrated adaptive cardiovascular maintenance
    baseline persists, adjusting to rest and activity; not fixed pressure or continuous lowering.
  functions.ocf-bod-007.lifecycle.scopes.application.description: Optional conscious reinforcement of
    the adaptive baseline; not a permanently intensified state.
  functions.ocf-bod-011.lifecycle.scopes.capability.description: The ability to reinforce hormonal balance
    remains available.
  functions.ocf-bod-011.lifecycle.scopes.baseline.description: The narrated regulation and adaptation
    baseline persists as hormonal needs change; not fixed levels or heightened endocrine activity.
  functions.ocf-bod-011.lifecycle.scopes.application.description: Optional conscious reinforcement of
    regulation and adaptation.
  functions.ocf-bod-013.lifecycle.scopes.capability.description: The ability to direct attention toward
    a selected body area remains available.
  functions.ocf-bod-013.lifecycle.scopes.baseline.description: The narrated whole-body maintenance and
    renewal baseline persists.
  functions.ocf-bod-013.lifecycle.scopes.application.description: Conscious selected-area reinforcement;
    not continuous intensified repair in that area.
  functions.ocf-cog-001.lifecycle.scopes.capability.description: Access to the personal knowledge library
    remains available.
  functions.ocf-cog-001.lifecycle.scopes.baseline.description: Personal knowledge continues to be organized
    and connected in the background.
  functions.ocf-cog-001.lifecycle.scopes.application.description: One consciously chosen information request;
    not a permanently active search or stream of answers.
  functions.ocf-lif-001.lifecycle.scopes.capability.description: The ability to change selected unwanted
    habits remains available.
  functions.ocf-lif-001.lifecycle.scopes.baseline.description: The intended change to the deliberately
    selected habit is lasting; useful memories, knowledge and skills remain intact.
  functions.ocf-lif-001.lifecycle.scopes.application.description: One deliberate intervention when the
    selected habit arises; not continuous behavioral suppression or cancellation of other functions.
  functions.ocf-emg-001.lifecycle.scopes.capability.description: Narrated injury-response readiness remains
    available, including when conscious invocation is unavailable.
  functions.ocf-emg-001.lifecycle.scopes.application.description: Optional manual reinforcement when conscious
    and able.
  functions.ocf-emg-001.lifecycle.scopes.episode.description: The narrated adaptive response lasts for
    the injury episode and adjusts as the injury stabilizes.
  functions.ocf-emg-002.lifecycle.scopes.capability.description: Narrated harmful-exposure response readiness
    remains available, including when conscious invocation is unavailable.
  functions.ocf-emg-002.lifecycle.scopes.application.description: Optional manual reinforcement when conscious
    and able.
  functions.ocf-emg-002.lifecycle.scopes.episode.description: The narrated exposure response operates
    only as strongly and for as long as needed for the actual substance and exposure.
