entries:
  hplus.function.ocf-fnd-003.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to enter a short,

      natural sleep and rapidly recharge your body,

      mind, and total self, awakening refreshed and alert.'
  hplus.function.ocf-fnd-003.function-body:
    status: reviewed
    version: 1.1.0
    cue_template:
      function_id: OCF-FND-003
      allowed:
      - cue.primary
    text: 'From this moment forward, you have the ability

      to recharge and restore yourself through

      a short period of natural, restful sleep.


      Whenever you choose to take a brief rest,

      settle comfortably and allow your body

      and mind to become quiet and relaxed.


      Inhale deeply and gently hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth,

      as though gently blowing out a candle.


      You will move easily and quickly

      into peaceful, natural sleep.


      As you sleep, your total self will begin

      a rapid process of balance, equalization,

      and restoration throughout your system.


      Your body will release unnecessary tension.

      Your mind will settle and become clear.

      Your natural energies will replenish,

      bringing renewed strength and vitality.


      Every part of your being will work together,

      restoring harmony and refreshing you

      in the short time you have chosen to rest.


      Within minutes, as your brief sleep completes,

      you will awaken naturally, calm and confident,

      with a clear mind and renewed energy.


      You will feel refreshed, alert, and ready

      to continue what you wish to do.


      From this moment forward, the ability

      to enter restorative short sleep

      is permanently available whenever you choose.


      Your normal wakefulness remains bright and clear,

      and this response begins when you deliberately

      choose to use {{ cue.primary }}.


      Each time you use this function,

      falling asleep briefly, restoring your energy,

      and awakening refreshed will become

      easier, smoother, and more effective.'
  hplus.function.ocf-fnd-003.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-FND-003
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to restore yourself

      through a short period of natural sleep,

      inhale deeply and hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth,

      as though gently blowing out a candle.


      This concludes your OCF Quick Recharge exercise.'
