entries:
  hplus.shared.body-comfort:
    status: reviewed
    version: "1.0.0"
    text: To prepare for this OCF function exercise, move now to make your body comfortable, whatever is best for you. You have made sure that you will not be interrupted during this learning period, and now get your body into your most relaxed position. Loosen any tight clothing. Stretch your arms and legs and let them droop, limp and relaxed. Turn your head slowly from side to side. Breathe easily and deeply. I will wait while you do this.
