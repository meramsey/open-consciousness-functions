entries:
  hplus.function.ocf-sen-002.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will strengthen your entire system

      of seeing, bringing greater clarity to your physical sight

      and to the images you create and perceive within your mind.'
  hplus.function.ocf-sen-002.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-SEN-002
      allowed:
      - cue.primary
    text: 'From this moment forward, your entire system of seeing,

      both physical and within your mind, will become

      clearer, sharper, and more effective.


      Your eyes will maintain comfortable, balanced moisture.

      Your eyelids will blink smoothly, distributing

      tear fluid evenly and protecting your eyes.


      Your eyes will adapt naturally to changing light.

      Their focusing structures will bring the patterns

      of light into increasingly clear detail.


      Your inner eyes will receive these patterns accurately,

      and your visual centers will process and understand

      them with greater clarity, ease, and precision.


      At the same time, your inner vision will grow stronger.

      You will create images within your mind more readily,

      seeing them vividly, clearly, and in rich detail.


      You can picture people, places, objects, and events;

      hold an image steadily; and change its shape,

      color, distance, or movement whenever you choose.


      Images from memory will become easier to recall,

      and new possibilities easier to picture.

      Your mind''s eye will respond naturally to intention,

      imagination, and the direction of your total self.


      These abilities will continue developing together,

      becoming a permanent part of the way you see,

      remember, imagine, and understand.


      Whenever you wish to strengthen your physical sight,

      your inner visualization, or both, inhale deeply

      and gently hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth.


      Your entire seeing system will respond to your intention,

      becoming clearer, smoother, and more capable.

      Each time you use {{ cue.primary }}, these abilities

      will become easier, stronger, and more effective.'
  hplus.function.ocf-sen-002.closer:
    status: reviewed
    version: 1.3.1
    cue_template:
      function_id: OCF-SEN-002
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to strengthen your

      physical sight or the clarity of your inner images,

      inhale deeply and hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth.


      This concludes your OCF Seeing exercise.'
