schema_version: "1.0"
locale: en-US
domain: narration
entries:
  hplus.function.ocf-bod-002.opener:
    status: draft
    version: "1.0.0"
    notes: Reference-derived candidate; partial Circulation transcript line 2. Wording review pending.
    text: Now, learn to direct the improvement of blood circulation in your physical body.
  hplus.function.ocf-bod-002.function-body:
    status: draft
    version: "1.0.0"
    notes: Reference-derived candidate; partial Circulation transcript lines 47–74. The generic consolidation at lines 75–79 belongs to the shared close section and is not duplicated here. Physiological and efficacy claims retained for human review.
    text: |-
      From this moment on, with each second, minute, hour, and day to come,
      the blood flow throughout your entire physical body is becoming more and more smooth and even,
      more effective in every way, more and more to the perfection of function
      as is the original design of such system.
      Feel as every vessel and channel, large and small, in your blood system
      is becoming stronger and stronger, yet more and more flexible.
      Watch as any blockages or restrictions in such channels
      that may hinder or prevent the normal, even, and smooth flow of your blood
      are slowly dissolving into very tiny pieces,
      so small that they can be carried away easily by your blood flow and eliminated.
      Look as the intake and insertion into your blood of needed materials and energy
      through your lungs and digestive system becomes easier and more efficient.
      Know that the elimination of unwanted energy and material in your blood
      is taking place more rapidly and smoothly through your lungs and other body organs.
      Know, too, that more and more such body systems of intake and elimination
      are restraining the entry to and eliminating from your bloodstream
      any substance and organisms that may hinder or prevent your entire self
      from becoming and being the perfection as you are designed to function.
      This entire process of blood circulation in your physical body
      is growing smoother, more even, more equalized and balanced
      with each coming second, minute, hour, day, and year.
      Your body is so doing because it knows the perfection it can become.

      Also, whenever you wish any part of your blood circulation system
      to improve even more rapidly, all you need do is close your eyes, inhale and hold your breath.
      Look with your closed eyes at that part you wish to improve even more
      and say in your mind, plus, flow, smooth, then exhale slowly through your mouth.
      The more you use this method of improving your blood flow,
      the easier and more effective it will become.
  hplus.function.ocf-bod-002.closer:
    status: draft
    version: "1.0.0"
    notes: Reference-derived candidate; partial Circulation transcript lines 161–166. Wording review pending.
    text: |-
      Remember, to improve any part of your blood circulation even more,
      all you need to do is close your eyes, inhale deeply, and hold your breath.
      Look with your closed eyes at that part you wish to improve.
      Then say in your mind, plus, flow, smooth.
      Then exhale slowly through your mouth.
      This is the end of your function learning exercise.
