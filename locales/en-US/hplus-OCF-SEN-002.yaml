      inner-visualization enhancement, which is not historical wording.
      Exact Plus See Better cue, original breathing sequence, and standard
      OCF ending remain. Rights: user_cleared, per user's lawyer-clearance
      attestation. Revised wording awaits editorial approval;
      finished-session release pending.
    text: |-
      Remember, whenever you wish to strengthen your
      physical sight or the clarity of your inner images,
      inhale deeply and hold your breath.

      Think or say in your mind, "Plus See Better."

      Then exhale slowly through your mouth.

      This concludes your OCF Sensory: Seeing exercise.