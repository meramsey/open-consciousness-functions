    text: Now, learn to improve your physical sight and seeing ability.
  hplus.function.ocf-sen-002.function-body:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Sensory (Seeing)/Sensory (Seeing).txt; SHA-256 54b00c862197e7e806bfd5cc2bc8f3da7f49ec4db1f7887ab0b6e7ee47919e6c; lines 35–58. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Consolidation at 59–63 and trailing Thank you at 235 excluded.'
    text: |-
      From this moment on, your system of seeing with your physical eyes is beginning to change
      more and more so that you can see more clearly, sharply and easily.
      Feel as your glands that produce tear fluid for your outer eyes.
      Such glands are acting more smoothly and evenly, providing exactly the amount of liquid
      needed to keep your outer eyes in their best balance and equalization.
      Feel as your eyelids are responding more and more rapidly as the need arises, distributing
      the tear fluid evenly and reacting to light and other signals to protect your eyes.
      Watch as your eyes adjustment to light strength is becoming faster and more accurate so that
      just exactly the proper amount of light for your best seeing reaches your inner eyes.
      Look as the focusing of your eyes is becoming more clear and more sharp so that light
      patterns reach your inner eyes in much greater detail.
      Know as your inner eyes are perceiving much more accurately and are sending quick and
      smooth nerve signals to your brain easily and more comfortably.
      Know as your physical seeing center in your brain is processing and understanding
      such nerve signals much more cleanly and sharply, providing very accurate information
      signals to other parts of your brain and thus to your mind.
      Feel as your entire system of physical seeing is becoming better and more efficient, more
      balanced and equalized in every way.
      All of this improving change will continue until your ability to see physically is exactly
      that which you desire.
      Such improvement will be increased even more when you inhale and hold your breath
      and say in your mind, plus, see, better, then exhale slowly through your mouth.
      The more you use this method of improving your eyesight, the easier and more effective
      it will become.
  hplus.function.ocf-sen-002.closer:
    status: draft
    version: 1.1.0
    notes: 'Reference-derived candidate with user-directed OCF terminology edit; transcript_unverified. Original SOURCE +Transcripts From available tapes/Sensory (Seeing)/Sensory (Seeing).txt; SHA-256 54b00c862197e7e806bfd5cc2bc8f3da7f49ec4db1f7887ab0b6e7ee47919e6c; lines 232–234. H plus changed to OCF per user''s standing instruction; original SOURCE remains unchanged. Shared consolidation at 59–63 and trailing Thank you at 235 remain excluded. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending.'
    text: |-
      Remember, to improve your ability to see more, inhale and hold your breath.
      Say in your mind, plus see better, then exhale slowly through your mouth.
      This is the end of your OCF function exercise.
