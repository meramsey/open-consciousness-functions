    text: Now, learn to regulate your hearing of sound.
  hplus.function.ocf-sen-001.function-body:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Sensory (Hearing)/Sensory (Hearing).txt; SHA-256 5a2ddc67141e3c6f8eacf5ca2aaec24801a52f2d2e3a88d438c965748dc1349e; lines 36–47. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Source here less wording retained as transcription uncertainty. This separate source-derived draft does not change frozen Hearing pilot resources.'
    text: |-
      At any time from this moment forward, whenever you desire to control the way you hear,
      and perceive sound, all you need do is close your eyes, inhale deeply, and hold your breath.
      Then say or think in your mind, plus here more, or plus here less.
      Then exhale slowly through your mouth and open your eyes.
      When you do this, if you state more, your hearing system will become much sharper and clearer.
      You will perceive and understand even the softest sound to enter your system.
      You will perceive both higher and lower sounds that you have never heard before.
      All when you state plus here more.
      When you state plus here less, your hearing will become quieter and quieter each time you state
      plus here less, until any distracting or disturbing sound is no longer important.
      Whenever you use this method of hearing control, it will continue until you desire to return to your
      normal hearing condition. The more you use this method, the easier and more effective it will become.
  hplus.function.ocf-sen-001.closer:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Sensory (Hearing)/Sensory (Hearing).txt; SHA-256 5a2ddc67141e3c6f8eacf5ca2aaec24801a52f2d2e3a88d438c965748dc1349e; lines 168–173. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Source here less wording retained as transcription uncertainty. This separate source-derived draft does not change frozen Hearing pilot resources.'
    text: |-
      Remember, to regulate your sense of hearing,
      relax your breath, then say in your mind, plus, hear more,
      if you wish to increase your hearing, or plus, hear less,
      if you want to tune down what and how you hear.
      Then, exhale through your mouth as if you're blowing out a candle.
      This is the end of your function learning exercise.
