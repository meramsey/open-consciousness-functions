    text: Now, learn to regulate your hearing of sound.
  hplus.function.ocf-sen-001.function-body:
    status: reviewed
    version: 1.1.0
    notes: 'Reference-derived wording with human correction; transcript_unverified. Original SOURCE +Transcripts From available tapes/Sensory (Hearing)/Sensory (Hearing).txt; SHA-256 5a2ddc67141e3c6f8eacf5ca2aaec24801a52f2d2e3a88d438c965748dc1349e; lines 36–47. Human wording review: user approved body with all five here cue spellings corrected to hear; remaining wording retained. Original SOURCE remains unchanged. Effect statements remain source claims, not established outcomes. This separate draft does not change frozen Hearing pilot resources. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      At any time from this moment forward, whenever you desire to control the way you hear,
      and perceive sound, all you need do is close your eyes, inhale deeply, and hold your breath.
      Then say or think in your mind, plus hear more, or plus hear less.
      Then exhale slowly through your mouth and open your eyes.
      When you do this, if you state more, your hearing system will become much sharper and clearer.
      You will perceive and understand even the softest sound to enter your system.
      You will perceive both higher and lower sounds that you have never heard before.
      All when you state plus hear more.
      When you state plus hear less, your hearing will become quieter and quieter each time you state
      plus hear less, until any distracting or disturbing sound is no longer important.
      Whenever you use this method of hearing control, it will continue until you desire to return to your
      normal hearing condition. The more you use this method, the easier and more effective it will become.
  hplus.function.ocf-sen-001.closer:
