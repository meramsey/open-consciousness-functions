    version: 1.0.0
    notes: 'Reference-derived wording; transcript_unverified. SOURCE +Transcripts From available tapes/Sensory (Hearing)/Sensory (Hearing).txt; SHA-256 5a2ddc67141e3c6f8eacf5ca2aaec24801a52f2d2e3a88d438c965748dc1349e; lines 168–173. Human wording review: user approved closer unchanged. This separate draft does not change frozen Hearing pilot resources. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      Remember, to regulate your sense of hearing,
      relax your breath, then say in your mind, plus, hear more,
      if you wish to increase your hearing, or plus, hear less,
      if you want to tune down what and how you hear.
      Then, exhale through your mouth as if you're blowing out a candle.
      This is the end of your function learning exercise.
