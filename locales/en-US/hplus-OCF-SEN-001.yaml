      This OCF exercise will teach you to regulate
      your sense of hearing and strengthen your ability
      to remember, imagine, and experience sounds within your mind.

  hplus.function.ocf-sen-001.function-body:
    status: reviewed
    version: 1.3.0
    notes: >-
      OCF adaptation of the unverified Sensory (Hearing) transcript;
      SOURCE +Transcripts From available tapes/Sensory (Hearing)/Sensory (Hearing).txt;
      SHA-256 5a2ddc67141e3c6f8eacf5ca2aaec24801a52f2d2e3a88d438c965748dc1349e;
      source lines 36–47. Original source unchanged. Preserves corrected
      'hear' spelling, canonical Plus Hear More and Plus Hear Less commands,
      closing the eyes, inhaling, holding, choosing a command, exhaling through
      the mouth, and opening the eyes. Retains enhanced perception of faint,
      high, and low sounds and reduced prominence of distracting sound, with
      conscious choice to change or return to usual hearing. Adds user-directed
      permanent inner auditory imagery: familiar and novel voices, music,
      pitch, rhythm, timbre, spatial position, and auditory memory. The same
      existing commands can intensify or soften intended imagined sounds;
      no additional command is invented. Imagined and externally heard sounds
      remain distinguishable. The physical adjustment is selected, not a
      continuous default; the auditory imagination is a lasting learned ability.
      Effects are experiential suggestions, not verified physiological changes.
      One reusable body supports four passes across Focus 11 and Focus 20.
      Rights: user_cleared per user's lawyer-clearance attestation.
      Finished-session release remains pending.
      Frozen Hearing pilot resources remain unchanged.
    text: |-
      From this moment forward, you have the ability
      to regulate your hearing and develop vivid,
      clear sound within your imagination.

      Your hearing will respond to your intention.
      You can bring subtle sounds into clearer awareness
      or allow unwanted sounds to fade into the background.

      To enhance your hearing, close your eyes,
      inhale deeply, and gently hold your breath.
      Think or say in your mind, "Plus Hear More."
      Then exhale slowly through your mouth and open your eyes.

      Faint sounds will become clearer and more distinct.
      You will notice delicate differences in pitch,
      tone, rhythm, and sounds both high and low.
      Your awareness will recognize the sounds
      you wish to hear with greater ease.

      To reduce unwanted sound, use the same eye
      and breathing sequence, thinking or saying,
      "Plus Hear Less."
      Distracting sounds will become less prominent,
      while you remain free to change the adjustment
      or return to your usual hearing condition.

      Your inner sense of hearing will also grow stronger.
      You will recall familiar voices, melodies,
      conversations, and sounds of places you remember.
      Even in silence, you can imagine a voice speaking,
      music playing, or a sound moving through space.

      You can hold an inner sound clearly, hear its
      pitch and rhythm, change its volume or tone,
      and create new combinations through imagination.
      You will recognize the difference between sounds
      you imagine and sounds around your physical body.

      This ability to remember and create sound within
      your mind will become a permanent part of your total self.
      Whenever you choose, these commands can strengthen
      an imagined sound or allow it to gently fade.

      Each time you use this function, your hearing regulation
      and inner auditory imagery will become easier,
      clearer, and more effective.

  hplus.function.ocf-sen-001.closer:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-authored concise closer adapted from the unverified Sensory (Hearing)
      transcript; SOURCE +Transcripts From available tapes/Sensory (Hearing)/Sensory (Hearing).txt;
      SHA-256 5a2ddc67141e3c6f8eacf5ca2aaec24801a52f2d2e3a88d438c965748dc1349e;
      source lines 168–173. Includes the user-directed inner auditory imagery
      enhancement, both exact commands, complete eye-and-breath sequence,
      and standard OCF ending. No new reset command is introduced.
      Rights: user_cleared per user's lawyer-clearance attestation.
      Finished-session release remains pending.
      Frozen Hearing pilot resources remain unchanged.
    text: |-
      Remember, to regulate your hearing or strengthen
      your inner experience of sound, close your eyes,
      inhale deeply, and hold your breath.
      Think or say in your mind, "Plus Hear More"
      or "Plus Hear Less," according to your intention.
      Then exhale slowly through your mouth and open your eyes.

      This concludes your OCF Sensory: Hearing exercise.
