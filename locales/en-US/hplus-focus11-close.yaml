schema_version: "1.0"
locale: en-US
domain: narration
entries:
  hplus.shared.focus11.close.prepare:
    status: reviewed
    version: "1.0.0"
    text: |-
      You will remember and act upon this knowledge function at any point from this moment on.
      You will so act with your entire being when your conscious waking self gives the
      correct action signal, the one you have just learned. The more you use this signal and
      function, the smoother and easier it will become.
  hplus.shared.focus11.close:
    status: reviewed
    version: "1.0.0"
    text: |-
      You will close your plus access channel now as
      I guide you. Ten. Ten. You are moving back to the ten state of total relaxation as the
      access signal goes away. Ten. The access signal is fading more and more. Ten. The access signal,
      the access channel is closed. It will stay closed until your next function learning exercise.
