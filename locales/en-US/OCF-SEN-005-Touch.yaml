entries:
  hplus.function.ocf-sen-005.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to regulate

      your physical sense of touch and strengthen your ability

      to remember, imagine, and experience touch within your mind.'
  hplus.function.ocf-sen-005.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-SEN-005
      allowed:
      - cue.id.OCF-CMD-SEN-005-TOUCH-LESS
      - cue.primary
    text: 'From this moment forward, you have the ability

      to regulate your sense of touch and develop

      a clear, vivid sense of touch within your mind.


      Your physical sense of touch will respond to your intention.

      You can notice delicate sensations more clearly,

      or allow unwanted sensations to fade into the background.


      To increase your awareness of touch, close your eyes,

      inhale deeply, and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth and open your eyes.


      The lightest contact will become more distinct.

      You will recognize subtle differences in texture,

      pressure, warmth, coolness, and movement across your skin.


      To reduce the prominence of an unwanted sensation,

      use the same eye and breathing sequence,

      thinking or saying, "{{ cue.id.OCF-CMD-SEN-005-TOUCH-LESS }}."

      The selected feeling will become less distracting,

      and you can return to your usual sense of touch

      whenever you consciously choose.


      Your inner sense of touch will also grow stronger.

      You will remember the softness of fabric,

      the smoothness of stone, the warmth of sunlight,

      and the gentle pressure of a familiar touch.


      Even without physical contact, you can imagine

      these sensations clearly, hold them in awareness,

      and change their texture, pressure, temperature,

      location, or movement through intention.


      Your tactile imagination will work naturally

      with remembered sights, sounds, smells, and tastes,

      allowing you to create richer inner experiences.

      You will know the difference between an imagined

      sensation and what your physical body is feeling.


      This ability to recall and create touch within your mind

      will become a lasting part of your total self.

      When desired, the same commands can make an imagined

      sensation more vivid or allow it to fade.


      Each time you use this function, physical touch regulation

      and inner tactile imagery will become clearer,

      easier, and more effective.'
  hplus.function.ocf-sen-005.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-SEN-005
      allowed:
      - cue.id.OCF-CMD-SEN-005-TOUCH-LESS
      - cue.primary
    text: 'Remember, to regulate your physical sense of touch

      or strengthen your inner experience of it, close your eyes,

      inhale deeply, and hold your breath.

      Think or say in your mind, "{{ cue.primary }}"

      or "{{ cue.id.OCF-CMD-SEN-005-TOUCH-LESS }}," according to your intention.

      Then exhale through your mouth as though gently

      blowing out a candle, and open your eyes.


      This concludes your OCF Touch exercise.'
