  hplus.function.ocf-bod-014.function-body:
    status: reviewed
    version: 1.1.0
    text: |-
      From this moment forward, all parts of your physical system will become more
      responsive to the pattern of repair, rebuilding, and continuing life that is
      natural to the individual self.

      Whenever a part of your physical body is injured, impaired, weakened, or in
      need of reconstruction, first identify that part clearly.

      Know the precise area you desire to support.

      Picture and remember the best normal form and function available to that part of your physical body.

      If the area is known to you, hold it clearly in your mind.

      If the exact internal condition is not known, direct the Function only toward the body area and allow the natural intelligence of your physical system to determine what proper repair and balance are possible.

      Inhale deeply and hold your breath.

      Then say or think in your mind:

      PLUS-BUILD, LIVE.

      Then exhale slowly through your mouth.

      When you do this, all parts of your physical system concerned with the
      selected area will begin to work together more completely toward repair, rebuilding, balance, and continuing life.

      Healthy living tissue in and around the selected area will respond more
      smoothly to the needs of repair.

      The circulation serving the selected area will support the movement of
      oxygen, nourishment, and the normal materials needed by the physical system.

      The natural processes of removal, replacement, and rebuilding will proceed in the best order available to your physical body.

      The selected area will move steadily toward the best structure and function that your physical system can produce.

      Where repair is possible, repair will be supported.

      Where replacement is possible, replacement will be supported.

      Where adaptation is required, the surrounding parts of your physical system will work toward greater balance and usefulness.

      All of this will proceed in harmony with the rest of your physical body.

      It will continue without unnecessary interference from your conscious mind.

      All when you state:

      PLUS-BUILD, LIVE.

      This is a permanently installed Function.

      The rebuilding pattern will remain available within your total physical
      system.

      Use the Function command to focus upon a particular area and enhance its
      effect.

      Use RESTORATIVE SLEEP to support the physical system during normal sleep.

      Use CIRCULATION to support blood flow and chemical transference.

      Use TUNE-UP to assist general physical balance and maintenance.

      Continue all appropriate diagnosis, treatment, rehabilitation, and care.

      The more calmly and consistently you use this command together with proper care, the smoother and easier the learned response will become.
    notes: 'User-proposed reconstruction with human edits; not a recovered historical transcript. Historical source availability remains unavailable and reimplementation remains planned. Proposed input Regenerate/Regenerate_881050P_reconstructed_clean.txt, SHA-256 365c64adc2ded19d193e8058fb6ad3a34f890f5fba269001220e51ee93ecdee1; user-selected proposed extent lines 150–227. User approved the body, including retained physiological/efficacy claims and removal of the proposed conventional-treatment disclaimer. No mechanism or outcome is thereby established. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
  hplus.function.ocf-bod-014.closer:
    status: reviewed
    version: 1.1.0
    text: |-
      Remember, when you desire to focus this permanently installed Function upon a
      particular part of your physical body, bring that area clearly into your
      mind.

      Inhale deeply and hold your breath.

      Say in your mind:

      PLUS-BUILD, LIVE.

      Then exhale slowly through your mouth.

      Continue all appropriate care while the natural processes of your physical
      system work toward the best repair, replacement, and balance available.

      This is the end of your OCF Function learning exercise.
