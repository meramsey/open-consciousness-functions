      Remember, whenever you wish to strengthen
      your ability to calculate or understand numbers,
      inhale deeply and hold your breath.

      Think or say in your mind, "Plus Calculate."

      Then exhale slowly through your mouth.

      This concludes your OCF Buy the Numbers exercise.
