  hplus.function.ocf-slp-005.function-body:
    status: reviewed
    version: 1.1.0
    text: |-
      At any time from this moment forward, whenever you desire normal sleep and
      the place or conditions are different, difficult or disturbing, first make
      your physical body as comfortable and secure as the situation permits.

      Close your eyes.

      Inhale deeply and hold your breath.

      Then say or think in your mind:

      PLUS-QUIET, SLEEP.

      Then exhale slowly through your mouth and continue to breathe easily and
      normally.

      When you do this, your physical body and mind will begin to move quickly and
      easily toward normal, natural sleep.

      Your physical body will loosen and relax.

      Your breathing will become slow, easy and even.

      Your thoughts will become quieter and quieter.

      Events and concerns that do not require your attention will move into the
      background.

      The unfamiliar place will become less important.

      Outside sound, light, movement and other surrounding conditions will become
      less and less important to your sleeping process.

      Such conditions may continue around you, but they will no longer hold your
      attention or prevent normal sleep.

      Your awareness of the outer environment will fade in the natural way of
      sleep.

      Your mind and body will accept the present place as a place where normal
      sleep can occur.

      You will drift easily and calmly into normal, natural, restful sleep.

      All when you state:

      PLUS-QUIET, SLEEP.

      Use this Function when normal sleep is desired under extreme, adverse or
      unfamiliar conditions.

      The Function will support normal sleep. It will not change the surrounding
      environment itself.

      Other sleep-related OCF Functions may be used with SLEEP EASY when their
      separate purposes are desired.

      The more you use this Function, the easier and more effective it will become.
