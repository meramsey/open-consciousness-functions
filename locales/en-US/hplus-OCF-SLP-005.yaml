entries:
  hplus.function.ocf-slp-005.opener:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF adaptation of user-proposed reconstruction; input
      Sleep Easy/Sleep_Easy_reconstructed_clean.txt;
      SHA-256 3ba4db73fb7a6c35631d6bec1f23599c40e5e77d33975a533a87cc465ee03309;
      proposed line 50. Source unavailable and historical authenticity unverified.
      Expands the original any-time, any-place purpose to include changing,
      distracting, and unfamiliar conditions. Spoken cue remains Plus Quiet Sleep;
      canonical Plus Sleep Easy registry naming is not asserted as source speech.
      Rights: user_cleared per user's lawyer-clearance attestation.
      Revised wording awaits editorial approval; finished-session release pending.
      Frozen Sleep Easy pilot resources and decisions remain unchanged.
    text: |-
      This OCF exercise will teach you to enter and remain in
      peaceful, natural sleep, even when your surroundings
      are unfamiliar, noisy, changing, or distracting.

  hplus.function.ocf-slp-005.function-body:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF adaptation of user-proposed reconstruction; input
      Sleep Easy/Sleep_Easy_reconstructed_clean.txt;
      SHA-256 3ba4db73fb7a6c35631d6bec1f23599c40e5e77d33975a533a87cc465ee03309;
      proposed lines 149–206. Original reference unchanged; authentication unverified.
      Preserves spoken Plus Quiet Sleep, which differs from canonical registry
      Plus Sleep Easy, and close-eyes-inhale-hold-command-exhale-normal-breathing
      sequence. Retains natural sleep in difficult or unfamiliar surroundings.
      User-directed OCF enhancements explicitly address unpredictable noises,
      shifting motion, renewed alertness after brief ordinary interruptions,
      adaptable attention, and a persistent learned ability invoked when desired.
      No promise that external sounds or conditions are physically altered;
      awareness of genuinely relevant signals is not intentionally disabled.
      No duplicated cue rehearsal or other function references. One body supports
      four passes across Focus 11 and Focus 20, with no session-return language.
      Effects are experiential suggestions, not verified outcomes. Rights:
      user_cleared per user's lawyer-clearance attestation. Revised wording
      awaits editorial approval; finished-session release pending. Frozen pilot
      resources and editorial decisions remain unchanged.
    text: |-
      From this moment forward, you have the ability
      to enter natural, restful sleep wherever you choose,
      even when the place around you is unfamiliar
      or the conditions are changing and distracting.

      Make yourself as comfortable as the situation permits.
      Close your eyes, inhale deeply, and hold your breath.
      Think or say in your mind, "Plus Quiet Sleep."
      Then exhale slowly through your mouth
      and allow your breathing to become easy and natural.

      Your physical body will loosen and relax.
      Your thoughts will become quiet and unhurried.
      The unfamiliar place will begin to feel ordinary,
      and your mind will accept it as a place for sleep.

      Sounds may rise and fade around you.
      Some may be sudden, irregular, or unexpected.
      Movement, voices, light, and changing conditions
      will no longer need to capture your attention.

      Your total self will distinguish what matters
      from ordinary background activity.
      Unimportant disturbances will pass through awareness
      without drawing you away from your chosen rest.

      If a passing sound or movement briefly stirs you,
      your body will settle again naturally.
      Your mind will release the interruption,
      your breathing will remain comfortable,
      and sleep will return smoothly and easily.

      You will no longer need perfect silence,
      familiar surroundings, or unchanging conditions
      to allow yourself peaceful, natural sleep.

      This ability will remain permanently available,
      ready whenever you choose to rest.
      Each use of Plus Quiet Sleep will make it easier
      to fall asleep, remain asleep, and settle again
      amid the ordinary changes around you.

  hplus.function.ocf-slp-005.closer:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-authored concise closer based on user-proposed reconstruction;
      input Sleep Easy/Sleep_Easy_reconstructed_clean.txt;
      SHA-256 3ba4db73fb7a6c35631d6bec1f23599c40e5e77d33975a533a87cc465ee03309;
      proposed lines 327–341. Historical source unavailable and unverified.
      One purpose reminder, original close-eyes-inhale-hold-Plus Quiet Sleep-
      exhale-normal-breathing sequence, and standard OCF closing. Canonical
      Plus Sleep Easy registry name is not silently substituted for the spoken
      cue. Rights: user_cleared per user's lawyer-clearance attestation.
      Revised wording awaits editorial approval; finished-session release pending.
      Frozen pilot resources remain unchanged.
    text: |-
      Remember, when you wish to sleep in unfamiliar
      or distracting surroundings, make yourself comfortable,
      close your eyes, inhale deeply, and hold your breath.
      Think or say in your mind, "Plus Quiet Sleep."
      Then exhale slowly through your mouth
      and continue breathing naturally.

      This concludes your OCF Sleep Easy exercise.
