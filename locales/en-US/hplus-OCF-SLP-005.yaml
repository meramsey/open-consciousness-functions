  hplus.function.ocf-slp-005.closer:
    status: reviewed
    version: 1.1.0
    text: |-
      Remember, when you desire normal sleep in a difficult or unfamiliar place,
      make yourself as comfortable and secure as possible.

      Close your eyes.

      Inhale deeply and hold your breath.

      Say in your mind:

      PLUS-QUIET, SLEEP.

      Then exhale slowly through your mouth and continue to breathe normally as
      you drift into sleep.

      This is the end of your OCF Function learning exercise.
