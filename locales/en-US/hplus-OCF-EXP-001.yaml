    text: Now, learn to program your future.
  hplus.function.ocf-exp-001.function-body:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Möbius West/Möbius West.txt; SHA-256 9013a12a0b32bb22db8433b49c2e834029456e01007534ebc42acfcd21adec78; lines 55–84. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. '
    text: |-
      From this moment on, whenever you desire to set in motion and bring into existence a different
      state of being for your own self, all you need do is think of the condition that you
      desire yourself to be, and when you wish such state to be complete, then inhale and
      hold your breath.
      Say or think in your mind, plus, change, change, then exhale slowly through your mouth.
      When you do this, your total being will begin immediately to create such changes as you
      desire, reaching into your physical self to adjust and modify as needed.
      Your mental self will so begin alterations in thought patterns as to achieve the desired
      goal, and your entire being will reach out beyond the limitations of your physical
      body to affect and attract those conditions necessary to create the reality you desire
      at the point in time you have so specified.
      All of this will take place and be completed as you wish, only if such changes are for
      your own greater well-being, and without destructively affecting others.
      The more you use this method of changing your pattern, the easier and more effectively
      will become.
