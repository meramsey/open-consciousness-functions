schema_version: '1.0'
locale: en-US
domain: narration
entries:
  hplus.function.ocf-exp-001.opener:
    status: reviewed
    version: 1.1.0
    notes: >-
      OCF-adapted opener based on the unverified Möbius West transcript.
      Original SOURCE +Transcripts From available tapes/Möbius West/Möbius West.txt;
      SHA-256 9013a12a0b32bb22db8433b49c2e834029456e01007534ebc42acfcd21adec78;
      line 1. Original reference remains unchanged. Expanded purpose emphasizes
      deliberate future-pattern creation through intention and the total self.
      Rights: user_cleared, per user's lawyer-clearance attestation.
      Finished-session release remains pending.
    text: |-
      This OCF exercise will teach you to set a desired future
      into motion, aligning your intention and total self
      with the reality you choose to create.

  hplus.function.ocf-exp-001.function-body:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-adapted narration based on the unverified Möbius West transcript.
      Original SOURCE +Transcripts From available tapes/Möbius West/Möbius West.txt;
      SHA-256 9013a12a0b32bb22db8433b49c2e834029456e01007534ebc42acfcd21adec78;
      lines 55–84. Original reference remains unchanged; duplicate second pass
      remains excluded. Adaptation preserves conscious selection of a future
      condition and desired completion time, exact Plus Change Change command,
      physical and mental alignment, intention reaching beyond the physical self,
      and the source condition of greater well-being without destructive effects
      on others. The exercise allows changes to unfold immediately or over time,
      and avoids establishing a fixed guaranteed completion. Lasting availability
      applies to the conscious patterning ability rather than uncontrolled
      alteration of the listener's circumstances. The purported manifestation
      mechanism and outcomes are unverified; affirmations are intended narration.
      Shared preparation, state, and return wording remain excluded.
      Rights: user_cleared, per user's lawyer-clearance attestation.
      Finished-session release remains pending.
    cue_template:
      function_id: OCF-EXP-001
      allowed: [cue.primary]
    text: |-
      From this moment forward, you have the ability
      to set in motion a new pattern for your future.

      Whenever you desire a different state of being,
      choose clearly what you wish to create.
      See yourself already living that reality.
      Feel its meaning, its harmony,
      and the change it brings into your life.

      Know the condition you desire,
      and choose when you wish it to be complete.
      Hold that intention clearly within your awareness.

      Inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth.

      Your total self will immediately begin
      aligning with the pattern you have chosen.
      Your thoughts, feelings, actions, and physical being
      will move into harmony with your intention.

      Your greater self will extend its awareness
      beyond the limits of your physical body,
      reaching into the wider field of consciousness
      and the possibilities available to you.

      Your intention will become a clear pattern,
      drawing together the conditions, connections,
      opportunities, and changes that support
      the reality you wish to experience.

      Some changes will begin at once.
      Others will unfold in their proper sequence,
      moving toward the completion you have envisioned.

      Your total self will continue this process
      without the need for constant conscious effort.
      You will recognize opportunities and act upon them
      naturally, confidently, and at the appropriate time.

      This pattern will operate in harmony
      with your greater well-being,
      without destructive effects upon others.

      From this moment forward, the ability
      to create and direct future patterns
      is permanently available to you.

      Each time you use {{ cue.primary }},
      your intention becomes clearer,
      your alignment stronger,
      and this process easier and more effective.

  hplus.function.ocf-exp-001.closer:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-authored closer adapted from the previously approved reminder.
      Original SOURCE +Transcripts From available tapes/Möbius West/Möbius West.txt;
      SHA-256 9013a12a0b32bb22db8433b49c2e834029456e01007534ebc42acfcd21adec78.
      The unverified source ends in numeric runs and has no recoverable
      function-specific closer. The closer contains one purpose reminder,
      the original intention/time selection and inhale-hold-command-exhale
      sequence, and the standard OCF ending. This is not historical wording.
      Rights: user_cleared, per user's lawyer-clearance attestation.
      Finished-session release remains pending.
    cue_template:
      function_id: OCF-EXP-001
      allowed: [cue.primary]
    text: |-
      Remember, whenever you wish to create
      a new future pattern, clearly envision
      the condition you desire and when it will be complete.

      Inhale deeply and hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth.

      This concludes your OCF exercise.
