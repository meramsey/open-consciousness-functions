entries:
  hplus.function.ocf-prf-004.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will teach you to move with lightness,

      quiet precision, and natural efficiency, making smooth,

      effortless steps an increasingly permanent part of the way you move.'
  hplus.function.ocf-prf-004.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-PRF-004
      allowed:
      - cue.primary
    text: 'From this moment forward, your body will learn

      a lighter, quieter, and more efficient way of moving.


      Whether walking through daily life, climbing steps,

      jogging, or running, your feet and legs will work

      together with natural ease and precision.


      Your feet will lift cleanly from the ground,

      moving forward without dragging or scraping.

      Each foot will return gently and deliberately,

      with just the pressure needed for stable support.


      Your steps will grow quieter, smoother, and lighter.

      Unnecessary impact, tension, and wasted motion

      will fade from the way you move.


      Your posture, balance, and rhythm will adjust together.

      You will place each foot where you intend,

      adapting naturally to the ground beneath you

      and the movement you have chosen.


      Your total self will learn this pattern so thoroughly

      that it becomes your natural way of walking,

      without needing to think about each separate step.


      This improvement will remain part of your everyday

      movement, even when you are not consciously

      using the Light Foot command.


      Whenever you wish to strengthen this lightness

      and efficiency even further, inhale deeply

      and gently hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth.


      Your movement will immediately become lighter,

      quieter, more balanced, and more economical,

      while maintaining the awareness and control

      appropriate to your surroundings.


      Each time you move, your body will reinforce

      this effortless pattern. Each time you use

      {{ cue.primary }}, it will become easier

      and more effective to express at will.'
  hplus.function.ocf-prf-004.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-PRF-004
      allowed:
      - cue.primary
    text: 'Remember, your lighter, quieter, more efficient way

      of moving will continue naturally, and whenever

      you wish to strengthen it, inhale deeply,

      hold your breath, and think or say in your mind,

      "{{ cue.primary }}."


      Then exhale slowly through your mouth.


      This concludes your OCF Light Foot exercise.'
