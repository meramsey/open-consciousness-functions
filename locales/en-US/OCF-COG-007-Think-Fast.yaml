entries:
  hplus.function.ocf-cog-007.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will strengthen your ability

      to think quickly, clearly, and accurately,

      using the full capabilities of your mind

      to understand, reason, and solve problems.'
  hplus.function.ocf-cog-007.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-COG-007
      allowed:
      - cue.primary
    text: 'From this moment forward, your entire mental process

      is becoming faster, clearer, and more capable.


      Your mind and brain work together

      with increasing speed, accuracy,

      and effortless coordination.


      You observe and understand information quickly,

      recognizing important details

      and their meaning with greater clarity.


      Your thoughts become organized and precise,

      allowing you to recognize patterns,

      connect ideas, and understand

      even complex situations more easily.


      You hold relevant information clearly

      in your awareness, bringing ideas together

      to form complete understanding.


      Whenever you encounter a problem,

      your mind will rapidly examine the information,

      recognize possible solutions,

      and identify the correct answer.


      New ideas and understanding will emerge

      naturally and quickly into your awareness.


      You will adapt easily to new information,

      seeing situations from different perspectives

      and recognizing the best way forward.


      Even when time is limited,

      your mind will remain calm, confident,

      focused, and fully alert.


      You will think quickly without rushing,

      responding with clarity, precision,

      and sound judgment.


      From this moment forward, this growing

      mental ability is permanently

      established within you.


      Your mental processing will continue

      becoming faster, clearer, and more efficient,

      naturally improving with every experience.


      Whenever you wish to intensify

      your mental clarity and thinking speed,

      inhale deeply and gently hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth.


      Your mind will immediately become

      clear, alert, focused, and responsive.


      You will understand information rapidly,

      recognize the connections that matter,

      and find solutions with increasing ease.


      Each time you use {{ cue.primary }},

      your thinking becomes faster,

      smoother, and more effective.


      Your ability to think clearly,

      completely, calmly, and rapidly

      will continue strengthening automatically,

      every day and every night.'
  hplus.function.ocf-cog-007.closer:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-COG-007
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to think

      more quickly, clearly, and accurately,

      inhale deeply and hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth.


      This concludes your OCF Think Fast exercise.'
