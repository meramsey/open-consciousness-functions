    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Recharge/Recharge.txt; SHA-256 56acb044e85ca8b34a54bb5cdc2c6f361a24b6818d0cac47a835fdb0fbf399a4; lines 38–60. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Unrelated Thank you for watching and Good night at 61–62 excluded.'
    text: |-
      At any point in the future, when you wish to recharge and re-energize quickly during
      a very short sleep period, all you need do is inhale deeply, hold your breath,
      and say or think in your mind, plus recharge.
      Then exhale as if you were blowing out a candle.
      When you do this, you will move easily and quickly into a normal, natural sleep.
      And during such sleep, your total self will smoothly and rapidly establish total
      balance and equalization throughout your entire system, bringing new vitality and
      freshness.
      And then you will awaken calm and sure and alert only minutes thereafter.
      The more you use this method of quick restoration during a short sleep,
      the easier it will become.
