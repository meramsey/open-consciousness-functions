schema_version: "1.0"
locale: en-US
domain: narration
entries:
  hplus.shared.transmutation-box.begin:
    status: reviewed
    version: "1.0.0"
    text: Turn now to your transmutation box. Raise the heavy lid.
  hplus.shared.transmutation-box.place:
    status: reviewed
    version: "1.0.0"
    text: Place in the box any worries, anxieties, and concerns that you may have right at this moment. You don't need them now, and they will simply get in the way of your learning process. Do this now....
  hplus.shared.transmutation-box.complete:
    status: reviewed
    version: "1.0.0"
    text: Close the lid of your transmutation box. Close it tightly. Turn away. Breathe slowly and deeply and relax.
