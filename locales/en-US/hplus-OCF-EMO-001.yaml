    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Let-Go/Let-Go.txt; SHA-256 604577ac7659c62380fa72f94501f8407172965942e22944d33774835c3e95a9; lines 45–64. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Website and copyright text at 65–68 is not narration and stays in SOURCE; unrelated opening video text excluded.'
    text: |-
      At any point in the future, when you desire to be free of any emotion,
      all you need do is simply inhale, hold your breath, and say in your mind,
      plus let go, then exhale as if you would blow out a candle.
      When you do this, any interfering emotion will flow out of you with the air that you exhale,
      out and away from you, so far that it will no longer be important,
      so far that it will no longer get in your way.
      You can be calm and serene with your mind brightly alert
      and your physical body relaxed and ready.
      The more you perform this pattern of letting go,
      the easier and more effective it will become.
