    text: |-
      From this moment forward, you have the ability
      to release any unwanted or interfering emotion
      whenever you choose.

      Your mind and body are becoming more balanced,
      allowing you to experience your emotions
      without being controlled by them.

      Whenever an emotion begins to interfere
      with your peace, clarity, or actions,
      simply recognize the feeling
      you wish to release.

      Inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      As you exhale, the unwanted emotion
      will flow out of you with your breath,
      moving farther and farther away.

      Its intensity will immediately diminish,
      fading until it no longer troubles you
      or interferes with your thoughts and actions.

      Your body will relax,
      releasing unnecessary tension,
      while your mind remains bright,
      clear, calm, and fully alert.

      You will retain any understanding
      or useful lessons from the experience,
      while releasing the emotional disturbance
      that no longer serves you.

      Your natural ability to feel,
      understand, and express emotions
      remains clear and complete.

      From this moment forward, this ability
      to consciously release interfering emotions
      is permanently established within you.

      Your mind and body will naturally
      return to emotional balance
      more quickly and easily.

      Whenever you use {{ cue.primary }},
      the chosen emotion will release
      smoothly and completely,
      leaving you calm, confident,
      and in control of your response.

      Each time you use this function,
      letting go becomes easier,
      faster, and more effective.

      You are free to experience your emotions
      while choosing which feelings
      you wish to release and which to retain.
