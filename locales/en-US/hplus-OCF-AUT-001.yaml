schema_version: '1.0'
locale: en-US
domain: narration
entries:
  hplus.function.ocf-aut-001.opener:
    status: reviewed
    version: 1.1.0
    notes: >-
      OCF-adapted opener based on the user-proposed See-Be
      reconstruction. Proposed input:
      See-Be/See_Be_881044_reconstructed_clean.txt;
      SHA-256 574d8a0921cd4cd91b6a3e5794510dbeecfd06838cb5569123b14e6777e6df5c;
      lines 39–40. Original reconstruction remains unchanged.
      Historical source availability remains unavailable.
      Wording simplified to emphasize transforming learned
      physical actions and mental-motor skills into lasting,
      automatic abilities. This is OCF-authored adapted
      narration, not a recovered historical transcript.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    text: |-
      This OCF exercise will teach you to transform learned
      actions and skills into smooth, natural, and automatic
      abilities that you can use whenever you choose.

  hplus.function.ocf-aut-001.function-body:
    status: reviewed
    version: 1.1.0
    notes: >-
      OCF-adapted narration based on the user-proposed See-Be
      reconstruction. Proposed input:
      See-Be/See_Be_881044_reconstructed_clean.txt;
      SHA-256 574d8a0921cd4cd91b6a3e5794510dbeecfd06838cb5569123b14e6777e6df5c;
      proposed extent lines 139–210. Original reconstruction
      remains unchanged. Historical source availability remains
      unavailable and reimplementation remains planned.
      The narration has been condensed into action selection,
      mental rehearsal, coordinated learning, conscious
      activation, automatic performance, and reinforcement.
      The exact Plus Automate command and breathing sequence
      are preserved. OCF-authored suggestions establish
      lasting, automatic execution of selected learned
      patterns while maintaining conscious control,
      adaptability, and continued improvement.
      Duplicate command instructions and companion function
      references have been removed from spoken narration.
      Companion functions remain available for separate
      session configuration and documentation.
      One reusable body supports repeated playback across
      Focus 11 and Focus 20.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    text: |-
      From this moment forward, you have the ability
      to transform any correctly learned action
      or skill into a natural, automatic response.

      Your mind and body work together,
      developing smooth, coordinated patterns
      that become easier and more effortless
      each time you perform them.

      Whenever you wish to automate an activity,
      first bring that activity clearly into your mind.

      See yourself performing it correctly,
      smoothly, and with complete confidence.

      Imagine the beginning of the action,
      each important movement or step,
      and its successful completion.

      Feel the entire sequence flowing naturally,
      with every part working together
      in perfect coordination.

      Your brain and nervous system recognize
      this complete pattern and organize it
      into an efficient, automatic response.

      Each correct repetition strengthens
      the connections that support this skill,
      making the action smoother, faster,
      and more precise.

      Unnecessary effort and hesitation disappear,
      allowing the activity to flow naturally
      without requiring constant conscious thought.

      Now bring the complete action clearly
      into your awareness.

      Inhale deeply and gently hold your breath.

      Think or say in your mind, "Plus Automate."

      Then exhale slowly through your mouth.

      The selected pattern is now becoming
      firmly and permanently established within you.

      Your mind and body will automatically
      coordinate the learned activity
      whenever you choose to perform it.

      The action will become natural,
      accurate, efficient, and effortless.

      Your conscious mind remains free
      to observe, guide, and adjust the activity
      whenever necessary.

      You remain in complete control,
      able to begin, modify, improve,
      or stop the action whenever you choose.

      Each time you perform the selected skill,
      its automatic pattern becomes stronger,
      smoother, and more reliable.

      The more you use Plus Automate,
      the easier and more effective
      this process will become.

      This lasting ability to develop
      automatic skills is now permanently
      available to you whenever you desire.

  hplus.function.ocf-aut-001.closer:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-adapted closer based on the user-proposed See-Be
      reconstruction. Proposed input:
      See-Be/See_Be_881044_reconstructed_clean.txt;
      SHA-256 574d8a0921cd4cd91b6a3e5794510dbeecfd06838cb5569123b14e6777e6df5c;
      proposed extent lines 331–346. Original reconstruction
      remains unchanged. Historical source availability
      remains unavailable. Closer shortened to one purpose
      reminder, the exact Plus Automate activation command,
      the breathing sequence, and the standard OCF ending.
      Additional reinforcement and practice guidance are
      reserved for the function body and documentation.
      This is OCF-authored adapted narration, not historical
      transcript wording.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    cue_template:
      function_id: OCF-AUT-001
      allowed: [cue.primary]
    text: |-
      Remember, whenever you wish to make a learned
      action or skill automatic, picture yourself
      performing it correctly and completely.

      Inhale deeply and hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth.

      This concludes your OCF Automatic Action exercise.
