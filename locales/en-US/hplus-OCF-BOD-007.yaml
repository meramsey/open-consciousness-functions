      At any point from this moment on
      Whenever you desire to know the condition of any part of your heart or blood vessel system and then to balance and adjust such
      Part all you need to is close your eyes
      Inhale deeply and hold your breath
      Look with your closed eyes at that portion of the heart and blood vessel system that you wish to know and direct and
      Then say in your mind
      plus
      balance blood pressure
      Then exhale slowly through your mouth and open your eyes
      When you do this you will immediately become consciously aware of the condition in that portion of your heart and blood vessel system and
      Your entire system will quickly and smoothly move to bring that portion into a normal natural and equalized state of being
      Your system knows and remembers how to do this and will so perform when you instructed by this method
      The more you perform this function of perceiving and balancing any portion of your system
      The easier and more effective it will become.
