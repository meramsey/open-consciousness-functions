  hplus.function.ocf-fnd-004.function-body:
    status: reviewed
    version: 1.3.0
    notes: >-
      OCF-adapted body based on the unverified Relax transcript.
      Original SOURCE +Transcripts From available tapes/Relax/Relax.txt;
      SHA-256 c0402141cd983ce02818c6a0bd427577c637810c572524e6e05e1a3168143209;
      lines 33–42. The source function introduction at line 33
      remains identified as body material. Source numeric labels,
      duplicated instruction, and overlapping relaxation passage
      remain excluded. The exact Plus Relax Relax command and
      inhale-hold-command-candle-exhale sequence are preserved.
      OCF-adapted suggestions reinforce full-body release of
      tension, calm and clear awareness, lasting availability,
      and consciously controlled use without permanent drowsiness.
      One body is intended for four playback passes across Focus 11
      and Focus 20. This is separate from frozen Relax pilot resources.
      Affirmative effects are exercise suggestions. Rights:
      user_cleared, per user's lawyer-clearance attestation.
      Finished-session release remains pending.
    text: |-
      From this moment forward, you have the ability
      to relax your entire body and mind deeply,
      naturally, and whenever you desire.

      Your body knows how to release unnecessary
      effort, strain, and tension, returning
      to a comfortable state of balance.

      Whenever you wish to relax, inhale deeply
      and gently hold your breath.

      Think or say in your mind, "Plus Relax Relax."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      With this breath, all unnecessary tension
      and stress will flow out of your body,
      leaving you comfortably relaxed.

      Your muscles will soften and release,
      from your face and shoulders to your hands,
      back, legs, and feet.

      Your breathing will become smooth and easy.
      Your nervous system will settle into
      a calm, balanced rhythm throughout your body.

      Your thoughts will become quiet and clear.
      Your mind will remain serene and at ease,
      free of unnecessary effort or distraction.

      You can enter this peaceful state while resting
      or remain comfortably alert when you need
      to think, move, or act.

      From this moment forward, your ability
      to release tension is permanently available,
      and your body will return to balance
      more naturally with each experience.

      Whenever you use Plus Relax Relax,
      relaxation will flow through your total self,
      deeper and more easily than before.

      Each time you use this function,
      becoming calm, comfortable, and relaxed
      will be easier, faster, and more effective.

