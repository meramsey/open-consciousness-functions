  hplus.function.ocf-fnd-004.function-body:
    status: reviewed
    version: 1.2.0
    notes: 'Reference-derived wording with human edits; transcript_unverified. Original SOURCE +Transcripts From available tapes/Relax/Relax.txt; SHA-256 c0402141cd983ce02818c6a0bd427577c637810c572524e6e05e1a3168143209; lines 33–42. User approved body with embedded count labels removed and the repeated function introduction, command and overlapping relaxation passage removed; first complete relaxation pass retained. Original SOURCE remains unchanged. Claims remain source claims, not established outcomes. This is separate from frozen Relax pilot resources. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      Here is your OCF function for total relaxation.
      When you inhale deeply, hold your breath and say in your mind, plus, relax, relax, and then exhale through your mouth as if you were blowing out a candle.
      When you do this, all stress and tension in your physical system will flow out of your body with the air you release. Your entire physical body will relax and release from strain. Your nerve system will send smooth signals to all parts of your body.
      Your mind will then relax and be calm and serene. The more you perform this particular method of relaxation by inhaling and saying in your mind, plus, relax, relax, the easier it will become.
