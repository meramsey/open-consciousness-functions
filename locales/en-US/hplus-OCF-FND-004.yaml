    text: |-
      13. Here is your H plus function for total relaxation.
      14. When you inhale deeply, hold your breath and say in your mind, plus, relax, relax, and then exhale through your mouth as if you were blowing out a candle.
      15. When you do this, all stress and tension in your physical system will flow out of your body with the air you release. Your entire physical body will relax and release from strain. Your nerve system will send smooth signals to all parts of your body.
      16. Your mind will then relax and be calm and serene. The more you perform this particular method of relaxation by inhaling and saying in your mind, plus, relax, relax, the easier it will become.
      17. When you do this, all stress and tension in your physical system will flow out of your body with the air you release. The more you perform this particular method of relaxation by inhaling and saying in your mind, plus, relax, relax, and then exhale through your mouth as if you were blowing out a candle.
