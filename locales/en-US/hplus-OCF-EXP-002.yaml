    status: reviewed
    version: 1.1.0
    text: |-
      Remember, when you desire to create a zone of temperature comfort around
      your physical body, inhale deeply and hold your breath.

      Say in your mind:

      PLUS-INSULATE, INSULATE.

      Then exhale slowly through your mouth.

      To cancel the present ZONING adjustment, use:

      PLUS-CANCEL.

      When the entire need has passed, use the RELEASE Function:

      PLUS-RELEASE.

      This is the end of your OCF Function learning exercise.
