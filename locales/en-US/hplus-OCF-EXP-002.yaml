    text: |-
      This OCF exercise will teach you to establish
      an insulating zone around your physical body,
      adjusting it to maintain your desired comfort
      as the surrounding temperature changes.

  hplus.function.ocf-exp-002.function-body:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-adapted function body based on the user-proposed Zoning
      reconstruction. Proposed input:
      Zoning/Zoning_881033_reconstructed_clean.txt;
      SHA-256 9af5acc2517dbb4dfb6b9d9abb674b58530ae81595d361aab6b26fe9e08aba2a;
      lines 152–220. Original reconstruction remains unchanged; source
      authenticity is unverified. Preserves a continuous, adjustable
      whole-body insulating-zone visualization, response to heat and cold,
      and the original inhale-hold-command-exhale method. Plus Cancel
      ends the current adjustment; Plus Release places the current
      application on hold without removing the learned ability. The
      function is consciously established and its intended regulation
      adjusts as circumstances change. Redundant command repetitions
      and companion-function references are omitted. Intended protection
      and temperature outcomes are narration suggestions, not verified
      physical insulation. One body supports four playback passes.
      Shared preparation, state, and return material remain excluded.
      Rights: user_cleared, per user's lawyer-clearance attestation.
      Finished-session release remains pending.
    text: |-
      From this moment forward, you have the ability
      to create a balanced zone of temperature comfort
      surrounding your entire physical body.

      Whenever you desire this protection,
      imagine a continuous, even layer of insulation
      extending around you from head to toe.

      Inhale deeply and gently hold your breath.

      Think or say in your mind, "Plus Insulate."

      Then exhale slowly through your mouth.

      Your zone will immediately begin to form,
      surrounding you in a smooth, balanced field
      adjusted to the comfort you desire.

      When the surroundings are cold,
      the zone will resist excessive cooling,
      conserving comfortable warmth around your body.

      When the surroundings are hot,
      the zone will resist excessive heating,
      maintaining a comfortable, balanced condition.

      As the environment changes, your zone
      will adjust continuously and evenly,
      strengthening or easing its insulating effect
      according to what is needed.

      Your physical body and your total self
      will work together in this pattern of balance,
      maintaining the zone without constant attention.

      The ability to use Insulate is now
      permanently available whenever you choose,
      and the selected zone continues operating
      until you consciously change or release it.

      To cancel the current temperature adjustment,
      inhale, hold your breath, think or say
      in your mind, "Plus Cancel," then exhale.

      That adjustment will end, leaving you free
      to establish a different one whenever desired.

      When you wish to place the entire Insulate
      application on hold, bring Insulate into your mind.
      Inhale, hold your breath, think or say
      in your mind, "Plus Release," then exhale.

      The present zone will rest, while your ability
      to create it remains ready for future use.

      Each time you use Insulate, establishing
      and adjusting your zone will become
      easier, smoother, and more effective.

  hplus.function.ocf-exp-002.closer:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-adapted closer based on the user-proposed Zoning reconstruction.
      Proposed input: Zoning/Zoning_881033_reconstructed_clean.txt;
      SHA-256 9af5acc2517dbb4dfb6b9d9abb674b58530ae81595d361aab6b26fe9e08aba2a;
