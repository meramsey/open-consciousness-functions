      the exact activation and adjustment/release commands, and the standard
      OCF ending. Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    text: |-
      Remember, to establish your zone of temperature comfort,
      inhale deeply, hold your breath, and think
      or say in your mind, "Plus Insulate."

      Then exhale slowly through your mouth.

      Use "Plus Cancel" to end the current adjustment,
      or "Plus Release" to place Insulate on hold.

      This concludes your OCF Insulate exercise.
