  hplus.function.ocf-sen-005.closer:
    status: reviewed
    version: 1.1.0
    text: |-
      Remember, to direct your sense of touch, close your eyes, inhale deeply, and hold your breath.

      Then say in your mind, PLUS-TOUCH MORE, if you wish to increase your tactile sensitivity, or PLUS-TOUCH LESS, if you want to turn down what and how you feel.

      Then exhale through your mouth as if you are blowing out a candle, and open your eyes.

      This is the end of your OCF Function learning exercise.
