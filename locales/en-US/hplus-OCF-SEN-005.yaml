  hplus.function.ocf-sen-005.function-body:
    status: reviewed
    version: 1.1.0
    text: |-
      At any time from this moment forward, whenever you desire to control the way you feel and perceive touch, all you need do is close your eyes, inhale deeply, and hold your breath.

      Then say or think in your mind, PLUS-TOUCH MORE, or PLUS-TOUCH LESS.

      Then exhale slowly through your mouth and open your eyes.

      When you do this, if you state more, your sense of touch will become much sharper and clearer.

      You will perceive and identify even the lightest touch to enter your system.

      You will perceive differences in pressure, texture, and temperature more clearly and accurately.

      All when you state PLUS-TOUCH MORE.

      When you state PLUS-TOUCH LESS, your tactile sensitivity will become lower and lower each time you state PLUS-TOUCH LESS, until any distracting, irritating, or unpleasant touch sensation is no longer important.

      Whenever you use this method of touch control, it will continue until you desire to return to your normal touch condition.

      The more you use this method, the easier and more effective it will become.
