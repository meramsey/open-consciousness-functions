    text: Primary
    status: draft
  commands.ocf-cmd-exp-005-primary.usage:
    text: Deliberately follow the ordered procedure; proposed exercise instructions,
      not software execution.
    status: draft
  commands.ocf-cmd-exp-005-primary.explanation:
    text: Establish an ongoing intention to discourage unwanted insect contact while
      maintaining calm awareness.
    status: draft
  commands.ocf-cmd-exp-005-observe.label:
    text: Observe
    status: draft
  commands.ocf-cmd-exp-005-observe.usage:
    text: Deliberately follow the ordered procedure; proposed exercise instructions,
      not software execution.
    status: draft
  commands.ocf-cmd-exp-005-observe.explanation:
    text: Pause outward-directed insect-discouragement intention while calm awareness
      remains.
    status: draft
  commands.ocf-cmd-exp-005-suspend.label:
    text: Suspend
    status: draft
  commands.ocf-cmd-exp-005-suspend.usage:
    text: Deliberately follow the ordered procedure; proposed exercise instructions,
      not software execution.
    status: draft
