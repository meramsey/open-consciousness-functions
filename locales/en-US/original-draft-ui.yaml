  functions.ocf-exp-005.title:
    text: Clear Zone
    status: draft
  functions.ocf-exp-005.purpose:
    text: Establish an ongoing intention to discourage unwanted insect contact while
      maintaining calm awareness.
    status: draft
  functions.ocf-exp-005.capability:
    text: Intended learned availability persists in every mode.
    status: draft
  functions.ocf-exp-005.baseline:
    text: Intended automatic non-destructive insect discouragement and calm awareness.
    status: draft
  functions.ocf-exp-005.application:
    text: Mutually exclusive Observe and Suspend overrides replace the prior mode
      and end at normal sleep onset, loss of consciousness or deliberate primary invocation.
    status: draft
