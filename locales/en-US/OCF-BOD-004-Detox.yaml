entries:
  hplus.function.ocf-bod-004.opener:
    status: reviewed
    version: 1.2.0
    text: This OCF exercise will teach you to strengthen and reinforce your body's natural processes of
      cleansing, renewal, and maintenance, establishing a lasting, automatic pattern of healthy balance
      throughout your body.
  hplus.function.ocf-bod-004.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-004
      allowed:
      - cue.primary
    text: 'From this moment forward, let your body''s natural processes of cleansing, renewal, and maintenance
      work together smoothly and efficiently.


      Your liver, kidneys, lungs, digestive system, and other natural cleansing pathways each perform
      their important work.


      Let your body retain and use what is beneficial, while processing and eliminating natural waste
      products and substances it no longer needs.


      Let every organ, tissue, and supporting system work together in healthy balance, providing nourishment,
      protection, maintenance, and renewal throughout your body.


      This pattern is permanently established within you and continues automatically, whether you are
      awake, resting, or asleep, adjusting naturally to your body''s changing needs without conscious
      effort.


      Whenever you wish to reinforce this pattern, simply close your eyes.


      Take a deep breath in and gently hold it.


      While holding your breath, silently say to yourself, "{{ cue.primary }}."


      Then slowly exhale through your mouth, as though gently blowing out a candle.


      As you exhale, let this pattern of natural cleansing, renewal, and maintenance continue throughout
      your body.


      The more you use this command, the easier and more effective this reinforcement becomes.'
  hplus.function.ocf-bod-004.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-004
      allowed:
      - cue.primary
    text: 'Remember, to reinforce your body''s natural cleansing, renewal, and maintenance, close your
      eyes.


      Inhale deeply and gently hold your breath.


      Silently say to yourself, "{{ cue.primary }}."


      Then slowly exhale through your mouth, as though gently blowing out a candle.


      This concludes your OCF Detox exercise.'
