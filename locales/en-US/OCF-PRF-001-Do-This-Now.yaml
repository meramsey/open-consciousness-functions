entries:
  hplus.function.ocf-prf-001.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to turn your

      intentions into action, bringing energy,

      enthusiasm, and momentum to starting,

      continuing, and completing what you choose.'
  hplus.function.ocf-prf-001.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-PRF-001
      allowed:
      - cue.primary
    text: 'From this moment forward, you have the ability

      to turn your intentions into action

      whenever you choose.


      Whether you wish to begin something new,

      continue what you have started,

      or bring an activity to completion,

      your total self is ready to move forward.


      Bring the activity you desire clearly into your mind.

      Know what you intend to do and the next action to take.


      Inhale deeply and gently hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth,

      as though gently blowing out a candle.


      Immediately, your conscious mind,

      subconscious mind, physical body,

      and higher self will work together

      in harmony with your chosen purpose.


      Hesitation, delay, and unnecessary resistance

      will release and fade away.

      Energy, willingness, and enthusiasm

      will rise naturally within you.


      You will move into action with confidence,

      ease, and a clear sense of direction.

      Each step will create momentum for the next,

      making it easier to continue and complete

      what you have chosen to accomplish.


      You will recognize the satisfaction of progress

      and the pleasure of creating positive change.

      Your attention and energy will remain aligned

      with the activity until its purpose is fulfilled.


      From this moment forward, this ability

      to begin, continue, and complete

      your chosen activities is permanently

      available whenever you desire.


      Each time you use {{ cue.primary }},

      moving from intention into action

      becomes easier, quicker, and more effective.'
  hplus.function.ocf-prf-001.closer:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-PRF-001
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to begin,

      continue, or complete an activity,

      bring that activity clearly into your mind.


      Inhale deeply and hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth,

      as though gently blowing out a candle.


      This concludes your OCF Do This Now exercise.'
