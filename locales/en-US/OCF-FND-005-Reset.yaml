entries:
  hplus.function.ocf-fnd-005.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to reset your

      physical and mental state quickly, shifting from

      weariness and feeling low to renewed energy,

      clarity, strength, and confidence.'
  hplus.function.ocf-fnd-005.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-FND-005
      allowed:
      - cue.primary
    text: 'From this moment forward, you have the ability

      to change your physical and mental pattern

      quickly and completely whenever you desire.


      Whenever you feel tired, weary, or emotionally low,

      you can immediately reset your state and return

      to renewed strength, clarity, and confidence.


      Inhale deeply, close your eyes,

      and gently hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth

      and open your eyes.


      As you exhale, weariness and heaviness

      will flow out of your body and mind.

      With each new breath, fresh energy and vitality

      will flow throughout your entire system.


      Your body will feel renewed, balanced,

      comfortable, and ready for action.

      Your mind will become clear, clean, sharp,

      and smooth, with bright, steady awareness.


      Your emotions will return to balance.

      You will feel strong and sure,

      calm and confident, ready to move forward.


      This change will take place immediately,

      bringing your entire being into the

      clear, energized state you have chosen.


      From this moment forward, this ability

      to reset your state is permanently

      available whenever you wish to use it.


      Your natural balance remains intact,

      and you can invoke this renewed wakefulness

      whenever a change of pattern is desired.


      Each time you use {{ cue.primary }},

      this shift becomes easier, faster,

      and more effective.'
  hplus.function.ocf-fnd-005.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-FND-005
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to change

      from tired and low to energized and strong,

      inhale deeply, close your eyes, and hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth

      and open your eyes.


      This concludes your OCF Reset exercise.'
