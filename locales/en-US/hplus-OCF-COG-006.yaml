  hplus.function.ocf-cog-006.function-body:
    status: reviewed
    version: 1.1.0
    notes: 'Reference-derived wording with human edit; partial_transcript. Original SOURCE +Transcripts From available tapes/Recall/Recall.txt; SHA-256 db0966369de99e181a3d2fc0a633454332785f322cc16b21e3836e5a8a92e3e3; lines 32–49. Human wording review: user approved the body with transcript labels “13.” and “15.” removed and the duplicated second pass omitted. Other wording retained; original SOURCE remains unchanged. Efficacy statements remain source claims, not established outcomes. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      At any point in the future when you desire to remember in great detail any part of your
      life experience, all you need do is inhale, hold your breath, and say in your mind,
      plus recall. And think of that area you want to remember. Inhale, hold your breath,
      say in your mind, plus recall. Then exhale through your mouth as it blowing out a candle.
      When you do this, you will remember immediately in full consciousness and great detail the
      information or experience that you desire. You will recall immediately in full consciousness
      and great detail the information or experience that you desire. The more you perform this
      method of remembering by inhaling, holding your breath, and saying, plus recall in your
      mind, the easier and more effective it will become.
