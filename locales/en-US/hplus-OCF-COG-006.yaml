      From this moment forward, your ability to remember
      and recall information and experiences is becoming
      stronger, clearer, and more effective.

      Your mind naturally organizes and preserves your memories,
      keeping the knowledge and experiences of your life
      available whenever you wish to remember them.

      Whenever you desire to recall something,
      begin by focusing on the information
      or experience you wish to remember.

      Inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      The memory you seek will immediately come into
      your conscious awareness, clear, vivid, and complete.

      You will remember the details of the experience,
      including the images, words, sounds, feelings,
      and sensations associated with it.

      The information will return naturally and effortlessly,
      allowing you to recognize and understand
      what you remember.

      From this moment forward, this ability to recall
      information and experiences is permanently
      established within you.

      Whenever you use {{ cue.primary }}, your mind will bring
      the desired information into your awareness
      quickly, clearly, and in great detail.

      Each time you use this function, recalling
      information becomes easier, faster,
      and more effective.

      Your memories remain available to you,
      ready to return to your conscious awareness
      whenever you desire.
