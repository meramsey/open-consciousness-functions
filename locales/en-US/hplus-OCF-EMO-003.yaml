  hplus.function.ocf-emo-003.function-body:
    status: draft
    version: 1.0.0
    text: |-
      At any time from this moment forward, when you desire greater awareness of
      another living physical being in a situation requiring clear communication,
      first identify the one being you desire to understand.

      Relax your physical body.

      Let go of unnecessary tension, fear, anger and expectation.

      Focus your attention upon the other being.

      Observe without forcing an answer.

      Notice movement, expression, voice, breathing, posture and all other
      information available through your physical senses.

      Remain open also to impressions that may arise below the level of deliberate
      thought.

      These impressions may concern drives, emotional condition, mental activity
      or physical state.

      Do not add your own desire, fear or judgment to what you receive.

      Allow the information to form quietly and completely.

      When the other being is clearly present in your awareness, inhale deeply
      and hold your breath.

      Then say or think in your mind:

      PLUS-PROFILE, PROFILE.

      Then exhale slowly through your mouth.

      When you do this, all parts of you will begin to gather and combine the
      information available concerning that living being.

      Your physical senses will observe more clearly.

      Your nonconscious awareness will compare and organize the signals you
      receive.

      You may receive the information as a feeling, a picture, a pattern, a
      thought, or a quiet knowing.

      Your understanding of the other being's emotional, mental and physical
      condition will become broader and more balanced.

      You will become more aware of the drives and needs that may be operating in
      the situation.

      You will remain calm, attentive and clear while this information forms.

      All when you state:

      PLUS-PROFILE, PROFILE.

      Use EMPATHIZING as needed in situations requiring clear communication.

      Use ATTENTION to remain focused.

      Use RELAX and LET GO to reduce your own tension and emotional distortion.

      Use SPEAK UP when clear expression is needed.

      Use EIGHT-GREAT when a positive and constructive response is desired.

      Treat each profile as information to be considered, not as certainty.

      Compare it with what you directly observe and what the other person
      communicates.

      Use the Function to improve understanding, not to control or manipulate.

      The more calmly and accurately you observe, the easier and more effective
      this Function will become.
    notes: 'User-proposed reconstruction draft; input lines 148–223. User-proposed reconstruction, not a recovered historical transcript. Historical source availability remains unavailable; reimplementation remains planned. Proposed input: Empathizing/Empathizing_881049_reconstructed_clean.txt; SHA-256 423aac8c941818fbc850a9fbdd3ebc9b08a3745ab1b2a93c79f6280c717f1b06; header ''EMPATHIZING (881049) — RECONSTRUCTED H-PLUS-STYLE AUDIO SCRIPT''. Identity checked against the document title and listed legacy commands, not inferred from the filename. Header claims of confirmation/authenticity are not independently verified. Only selected narration is reused; shared sections, production directions and non-narration prefatory notes remain separate. Suggested input timings are not measured evidence. Proposed perception/knowing assertions retained as claims for review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending.'
  hplus.function.ocf-emo-003.closer:
    status: draft
    version: 1.0.0
    text: |-
      Remember, when you desire greater awareness of another living physical
      being in a situation requiring clear communication, relax, let go of your
      own emotional distortion and focus your attention upon that being.

      Inhale deeply and hold your breath.

      Say in your mind:

      PLUS-PROFILE, PROFILE.

      Then exhale slowly through your mouth.

      Observe calmly and compare each impression with direct communication and
      what you can verify.

      This is the end of your H-PLUS Function learning exercise.
