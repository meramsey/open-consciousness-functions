entries:
  hplus.function.ocf-exp-001.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to manifest with clear,

      positive intention, aligning your total self with the reality

      you choose to create.'
    notes: 'OCF-adapted opener based on the unverified Möbius West transcript. Original SOURCE +Transcripts
      From available tapes/Möbius West/Möbius West.txt; SHA-256 9013a12a0b32bb22db8433b49c2e834029456e01007534ebc42acfcd21adec78;
      line 1. Original reference remains unchanged. Rewords the existing future-patterning purpose around
      clear, positive intention and total-self alignment. This is adapted narration, not historical transcript
      wording. Existing source rights: user_cleared, per user''s lawyer-clearance attestation. Revised
      wording awaits explicit editorial approval; that earlier attestation does not independently authenticate
      the comparison passage. Finished-session release remains pending.'
  hplus.function.ocf-exp-001.function-body:
    status: reviewed
    version: 2.0.0
    cue_template:
      function_id: OCF-EXP-001
      allowed:
      - cue.primary
    text: 'From this moment forward, you will direct your total self

      toward the reality you choose to create,

      with clear, positive intention.


      Whenever you desire a change, choose the outcome

      and when you wish it to take form.

      Whether the need is immediate or further ahead,

      picture, feel, or simply know the result as fulfilled.


      Inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth.


      Your total self will immediately align with your intention.

      Your conscious mind, subconscious mind, higher self,

      and physical being will work together in harmony.


      Struggle, fear, harsh judgment, and impatience will fall away.

      Your intention remains clear as you release the need

      to force each step or continually check the result.


      Center yourself in your heart.

      Let love fill your being and bring your energy centers

      into open, balanced harmony.

      Remain grounded and present, receptive to energy and light.

      You are worthy to create and receive good.


      Welcome the loving guidance of your higher self

      and the helpers you recognize.

      Your intuition will become clearer,

      guiding you to recognize opportunities and act.


      Your greater awareness will reach beyond your physical body,

      connecting with universal consciousness.

      Your intention will draw together and sustain

      the conditions and connections that support your chosen reality.


      Hold the essence of your desire while welcoming

      its fulfillment or something better,

      in harmony with your highest good and the good of others,

      without destructive effects upon anyone.


      This pattern will continue without constant conscious effort,

      unfolding immediately or through its natural sequence.

      Once learned, this ability remains permanently available,

      ready for everyday use with your intention, breath, and command.


      The more you use this function,

      the clearer your intention, the stronger your alignment,

      and the easier and more effective manifestation becomes.'
    notes: 'OCF-adapted narration based on the unverified Möbius West transcript. Original SOURCE +Transcripts
      From available tapes/Möbius West/Möbius West.txt; SHA-256 9013a12a0b32bb22db8433b49c2e834029456e01007534ebc42acfcd21adec78;
      lines 55–84. Original reference remains unchanged; duplicate second pass remains excluded. Preserves
      outcome and desired-time selection, the original inhale-hold-command-exhale sequence, total-self
      alignment, intention beyond the physical self, continuing operation, and greater well-being without
      destructive effects on others. The active command remains the reviewed Plus Manifest supplied through
      cue.primary; no command definition changes. Version 2.0.0 adds substantive editorial content informed
      by the user-supplied Plus Create comparison: release of struggle and impatience, heart-centered
      love, balanced energy centers, grounded receptivity, worthiness, supportive guidance, and the intended
      outcome or an aligned improvement. The comparison has no independently verified bibliographic attribution
      in this review; additions are not represented as recovered historical wording. Clear intention is
      supported through imagery, feeling, or conceptual knowing. Everyday use retains the existing breath
      and command without requiring a new meditation or Focus-state transition. The process is intended
      to begin immediately while fulfillment is not assigned a guaranteed deadline. Lasting availability
      applies to deliberately chosen patterns, not every passing thought. Spiritual and energetic language
      expresses the practice''s intention, not an established physical mechanism. Shared preparation,
      state, and return wording remain excluded. One body retains four-pass reuse. Existing source rights:
      user_cleared, per user''s lawyer-clearance attestation. Revised wording awaits explicit editorial
      approval; predecessor approval and integrity records remain unchanged. Finished-session release
      remains pending.'
  hplus.function.ocf-exp-001.closer:
    status: reviewed
    version: 1.3.0
    cue_template:
      function_id: OCF-EXP-001
      allowed:
      - cue.primary
    text: 'Remember, to manifest a chosen outcome,

      bring it clearly into your awareness

      and choose when you wish it to take form.


      Inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth.


      This concludes your OCF exercise.'
    notes: 'OCF-authored closer adapted from the previously approved reminder. Original SOURCE +Transcripts
      From available tapes/Möbius West/Möbius West.txt; SHA-256 9013a12a0b32bb22db8433b49c2e834029456e01007534ebc42acfcd21adec78.
      The unverified source ends in numeric runs and has no recoverable function-specific closer. Retains
      one purpose reminder, desired outcome and timing, the original inhale-hold-command-exhale sequence,
      and the existing OCF ending. Representation-neutral wording includes nonvisual intention. Plus Manifest
      remains resolved through cue.primary. This is OCF-authored wording, not historical transcription.
      Existing source rights: user_cleared, per user''s lawyer-clearance attestation. Revised wording
      awaits explicit editorial approval. Finished-session release remains pending.'
