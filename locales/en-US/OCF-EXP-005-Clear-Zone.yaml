lifecycle:
  persistence: permanent
  activation: automatic
  release:
    required: false
    command: null
  trigger_conditions:
  - Automatic is the intended baseline; deliberate primary invocation strengthens or restores it.
  - Observe pauses outward-directed insect-discouragement intention while calm awareness remains.
  - Suspend pauses the entire Clear Zone application, preserving ordinary awareness and natural bodily
    responses.
  - Modes are mutually exclusive; each deliberate selection replaces the prior mode.
  - Either override ends at normal sleep onset, loss of consciousness or deliberate primary invocation.
  - Relaxation, Focus-state labels and hearing a cue during narration are not reset or selection triggers.
  - These are exercise instructions, not executable detection or physiological control.
