entries:
  hplus.function.ocf-bod-009.opener:
    status: reviewed
    version: 1.2.0
    text: This OCF exercise will teach you to strengthen your respiratory system's natural processes of
      breathing, renewal, and maintenance, establishing a lasting, automatic pattern of healthy, efficient
      breathing.
  hplus.function.ocf-bod-009.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-BOD-009
      allowed:
      - cue.primary
    text: 'From this moment forward, let your entire respiratory system become stronger, healthier, and
      more efficient.


      Let your nose, throat, airways, and lungs work together smoothly, providing the oxygen your body
      needs.


      Let your nasal passages remain clear and comfortable, warming and moistening incoming air, while
      tiny protective cilia help carry mucus and trapped particles out of your airways.


      Let your airways remain open and flexible, allowing air to move smoothly and naturally.


      Within your lungs, millions of tiny air sacs exchange oxygen and carbon dioxide. Oxygen enters your
      bloodstream to nourish your body, while carbon dioxide passes into your lungs to be released as
      you exhale.


      Let this exchange remain smooth, balanced, and efficient.


      Your diaphragm and breathing muscles work together with natural strength and coordination, allowing
      you to breathe comfortably without unnecessary effort.


      Your body''s natural processes of maintenance and renewal support the strength, flexibility, and
      healthy function of your entire respiratory system.


      This pattern of efficient breathing and respiratory maintenance is permanently established within
      you.


      It continues automatically, whether you are awake, resting, or asleep, adjusting naturally to your
      body''s changing needs without conscious effort.


      Whenever you wish to reinforce this established pattern, take a deep breath in and gently hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      As you exhale, let this pattern of smooth, efficient breathing and natural respiratory maintenance
      continue throughout your body.


      The more you use this command, the easier and more effective this reinforcement becomes.'
  hplus.function.ocf-bod-009.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-009
      allowed:
      - cue.primary
    text: 'Remember, to reinforce healthy breathing and your respiratory system''s natural maintenance,
      inhale deeply and gently hold your breath.


      Silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth.


      This concludes your OCF Breathe Better exercise.'
