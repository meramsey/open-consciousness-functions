  hplus.function.ocf-bod-010.function-body:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Nutricia/Nutricia.txt; SHA-256 c57a1573700b190e1b76d34f083d6fb70de0d81aad43f540e09458a45abb7bb6; lines 33–56. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. '
    text: |-
      From this moment on, whenever you wish to control your use of the food you eat,
      all you need do is close your eyes, inhale and hold your breath. Then look with your
      closed eyes up and down that portion of your physical body that processes food
      into usable energy and say in your mind, plus food more or plus food less.
      Then exhale slowly through your mouth and open your eyes. When you do this,
      when you state plus food more, your body system will take from any food you eat
      the greatest possible energy and translate it quickly and efficiently into your bloodstream.
      When you state plus food less, your body system will take only that energy from the food you
      eat needed for proper balance and maintenance and pass any excess that is not so needed easily
      smoothly out of your system. Your body knows how to do this perfectly and will do so upon
      your stated command. The more you use this method of controlling your food energy intake,
      the easier and more effective it will become.
