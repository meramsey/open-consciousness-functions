  hplus.function.ocf-bod-010.function-body:
    status: reviewed
    version: 1.1.0
    notes: 'Reference-derived wording with human edits; transcript_unverified. Original SOURCE +Transcripts From available tapes/Nutricia/Nutricia.txt; SHA-256 c57a1573700b190e1b76d34f083d6fb70de0d81aad43f540e09458a45abb7bb6; lines 33–56. User supplied and approved one body passage, consolidating the source repeat and wording the command cue as supplied; original SOURCE remains unchanged. Physiological/efficacy statements remain source claims, not established outcomes. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      From this moment on, whenever you wish to control your use of the food you eat,
      all you need do is close your eyes, inhale and hold your breath. Then say or think in your mind, plus food more or plus food less.
      Then exhale slowly through your mouth and open your eyes. When you do this, when you state plus food more, your body system will take from any food you eat the greatest possible energy and translate it quickly and efficiently into your bloodstream.
      When you state plus food less, your body system will take only that energy from the food you eat needed for proper balance and maintenance and pass any excess that is not so needed easily and smoothly out of your system. Your body knows how to do this perfectly and will do so upon
      your stated command. The more you use this method of controlling your food energy intake, the easier and more effective it will become.
