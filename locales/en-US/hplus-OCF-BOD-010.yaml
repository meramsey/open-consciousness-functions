    text: |-
      Remember, whenever you wish to direct how your body
      uses food energy, close your eyes, inhale deeply,
      and hold your breath.

      Think or say in your mind, "Plus Food More"
      or "Plus Food Less," according to your desire.

      Then exhale slowly through your mouth
      and open your eyes.

      This concludes your OCF Nutricia exercise.
