    source_row_sha256: 9f4fa11b9369d703dcfd294cc0de5add041cddc427cd5035412ea9e40b9ce387
    classification: KEEP CUE — ALIGN TITLE OR NARRATION
    recommended_title: Imprint
    recommended_primary_cue: PLUS-IMPRINT
    prior_review_note: Approve paired title/cue, scope clarification and explicit body/reinforcement/closer
      association plan; approve controls together. No narration replacement text selected.
    contextual_review: 'Selected information/experience encoding: inhale/hold/complete repeated cue/focus
      target/exhale. Plus Recall retrieves imprinted material. Registry suggestion/intention rehearsal
      understates actual memory encoding/consolidation; the shorter Imprint is not independently taught.'
    pair_reason: IMPRINT clearly identifies deliberate encoding. The separate PLUS-RECALL retrieval record
      is functional reuse, not a duplicate activation to delete.
    title_cue_relationship_or_exception: Title and cue name the same selected operation; a concise verb,
      outcome or contextual mode can reinforce an umbrella title without copying it. IMPRINT clearly identifies
      deliberate encoding. The separate PLUS-RECALL retrieval record is functional reuse, not a duplicate
      activation to delete.
    teaching_disposition: New spoken association requires explicit body/reinforcement/closer approval
    documentary_intent: Deliberately encode selected experience/information and later retrieve it using
      a separate recall cue.
    alternatives: []
    technical_impact:
      cache: Any changed text/locale/voice needs matching fresh fingerprints, recordings/TTS and measured
        timing; do not rewrite old receipts/immutable locks.
      generated: Regenerate indexes, command guides and plans only after approved active changes; generated
        references are current metadata, not proof of taught speech.
      recordings: Private manifests/stems not inspected. Review event/resource/unit mappings and every
        composed nonspoken marker; preserve originals. No recording relabeling.
      rendered_transcripts: No new render. Source composition resolved without engines; recorded speech
        and final rendered transcripts unverified.
