entries:
  hplus.function.ocf-cog-004.opener:
    status: reviewed
    version: 1.2.0
    text: 'This OCF exercise will teach you to capture and

      permanently store information, knowledge, and

      experiences deep within your memory, preserving

      them clearly and accurately for future recall.'
  hplus.function.ocf-cog-004.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-COG-004
      allowed:
      - cue.id.OCF-CMD-COG-004-RECALL
      - cue.primary
    text: 'From this moment forward, your ability to capture,

      store, and remember information and experiences

      is becoming stronger, clearer, and more accurate.


      Whenever you wish to preserve something in memory,

      bring your complete attention to the information

      or experience you desire to remember.


      Inhale deeply and gently hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Focus clearly on what you wish to remember,

      then exhale slowly and easily.


      Your senses will become more attentive

      to every important detail of your experience.


      Images, sounds, words, feelings, and sensations

      will be perceived clearly and precisely.


      Your mind will organize this information,

      connecting it with your existing knowledge

      and placing it securely into long-term memory.


      Every important detail will be preserved,

      clear, complete, and accurate.


      The information you have chosen to imprint

      will remain firmly established within you,

      available whenever you desire to remember it.


      From this moment forward, your mind will

      automatically strengthen and maintain

      the memories you have consciously imprinted.


      Whether awake, resting, or sleeping,

      your natural processes of memory consolidation

      will continue organizing and reinforcing

      the information you have chosen to preserve.


      Whenever you wish to remember an imprinted

      experience or any part of its details,

      simply think or say in your mind,

      "{{ cue.id.OCF-CMD-COG-004-RECALL }}."


      The information will return immediately

      into your conscious awareness,

      clear, vivid, and complete.


      You will remember the knowledge,

      sensations, and details you have stored

      with confidence and accuracy.


      From this moment forward, this ability

      to consciously imprint information

      is permanently available to you.


      Each time you use {{ cue.primary }},

      your ability to capture and retain

      information becomes easier, faster,

      and more effective.


      Your selected memories will remain

      clear and accessible, ready to return

      to your awareness whenever you desire.'
  hplus.function.ocf-cog-004.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-COG-004
      allowed:
      - cue.primary
    text: 'Remember, whenever you wish to preserve

      information or an experience in your memory,

      inhale deeply and hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Focus on what you wish to remember,

      then exhale slowly and easily.


      This concludes your OCF Imprint exercise.'
