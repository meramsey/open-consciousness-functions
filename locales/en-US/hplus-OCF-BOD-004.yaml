  hplus.function.ocf-bod-004.function-body:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; partial_transcript. SOURCE +Transcripts From available tapes/De-Tox Body/De-Tox Body.txt; SHA-256 2eba3f1368745e99e3473e8923fcc9236e55baf6159dacab6c98f327bb04c4fc; lines 89–103. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Standalone numeric transcription runs at 104–130 are not function instructions.'
    text: |-
      Beginning now, more and more, from this moment forward,
      when your physical body is blocked or distorted by materials,
      substance, or other destructive forms within it,
      all of your physical systems will steadily, carefully,
      and easily cause the elimination of all those things that might hinder
      or prevent the body from being and giving totally of its normal,
      natural self, and will continue to do so until your body
      is completely balanced and equalized.
      Also, at any point in the future when you wish this cleansing to complete itself
      more rapidly, all you need do is close your eyes,
      inhale and hold your breath, and say in your mind,
      plus, clean, clear, then exhale slowly and easily.
      The more you perform this method of cleansing
      and keeping clean your physical body,
      the easier and more effective it will become.
