    text: |-
      Remember, your body's natural processes of cleansing,
      renewal, and maintenance are now firmly established
      as a lasting, automatic pattern.

      Whenever you wish to reinforce this pattern,
      simply close your eyes.

      Inhale deeply and gently hold your breath.

      Silently say to yourself, "Plus Clean Clear."

      Then slowly exhale through your mouth,
      as though gently blowing out a candle.

      This concludes your OCF De-Tox Body exercise.
