entries:
  hplus.function.ocf-bod-012.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will teach you to consciously direct

      your sexual desire and arousal, increasing or decreasing

      your responsiveness whenever you choose.'
  hplus.function.ocf-bod-012.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-BOD-012
      allowed:
      - cue.id.OCF-CMD-BOD-012-SEX-LESS
      - cue.primary
    text: 'From this moment forward, you have the ability

      to consciously direct your sexual desire

      and physical arousal whenever you choose.


      Your mind and body work together in harmony,

      responding quickly and naturally to your intentions.


      Whenever you wish to increase your sexual desire

      and arousal, use the command "{{ cue.primary }}."


      Your sexual energy will increase,

      bringing greater desire, sensitivity,

      and physical responsiveness.


      Feel this energy flowing naturally

      throughout your body, strengthening

      your sense of pleasure, vitality,

      and intimate connection.


      Whenever you wish to reduce sexual arousal,

      use the command "{{ cue.id.OCF-CMD-BOD-012-SEX-LESS }}."


      Your arousal will quickly and comfortably diminish,

      becoming less and less until your mind

      and body return to a calm, balanced state.


      The sexual energy you no longer wish to express

      will be redirected toward other constructive purposes,

      strengthening your physical vitality,

      mental clarity, creativity, and concentration.


      Your attention will shift naturally

      toward whatever you choose,

      free from unwanted sexual distraction.


      To activate either function,

      take a deep breath in and gently hold it.


      Think or say in your mind,

      "{{ cue.primary }}" or "{{ cue.id.OCF-CMD-BOD-012-SEX-LESS }},"

      according to your desire.


      Then exhale slowly through your mouth

      and resume breathing naturally.


      Your mind and body will respond

      quickly and effectively to your chosen command.


      From this moment forward, this ability

      to consciously regulate your sexual arousal

      is permanently established within you.


      Your natural sexual responsiveness will remain

      balanced and adaptable, responding appropriately

      to your intentions and circumstances.


      Whenever you wish greater arousal,

      you can increase it.


      Whenever you wish less arousal,

      you can comfortably release it.


      Each time you use these functions,

      directing your sexual energy becomes

      easier, faster, and more effective.


      This lasting ability is always available,

      allowing you to direct your sexual desire

      and responsiveness whenever you choose.'
  hplus.function.ocf-bod-012.closer:
    status: reviewed
    version: 1.1.0
    cue_template:
      function_id: OCF-BOD-012
      allowed:
      - cue.id.OCF-CMD-BOD-012-SEX-LESS
      - cue.primary
    text: 'Remember, whenever you wish to regulate

      your sexual arousal, inhale deeply

      and hold your breath.


      Think or say in your mind, "{{ cue.primary }}"

      to increase arousal, or "{{ cue.id.OCF-CMD-BOD-012-SEX-LESS }}"

      to reduce and redirect it.


      Then exhale slowly through your mouth

      and resume breathing naturally.


      This concludes your OCF Sex Drive exercise.'
