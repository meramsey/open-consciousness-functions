  hplus.function.ocf-prf-004.function-body:
    status: reviewed
    version: 1.1.0
    text: |-
      At any time from this moment forward, whenever you are walking, jogging or
      running and desire your movement to become lighter, easier and more
       effortless, inhale deeply and hold your breath.

      Then say or think in your mind:

      PLUS-LIGHTER, LIGHTER.

      Then exhale slowly through your mouth.

      When you do this, the learned LIGHT FOOT pattern will begin to operate more
      strongly while you are moving your feet.

      Your steps will become lighter and easier.

      The movement of your feet and legs will become smoother and more efficient.

      Your physical body will use less unnecessary effort in the act of walking,
      jogging or running.

      The separate movements required for each step will join together more
      smoothly.

      Your feet will lift, move and return in a more even rhythm.

      Your balance and direction will remain clear as your movement becomes more
      comfortable and more effortless.

      Unnecessary heaviness and strain in the act of moving your feet will become
      less important.

      You will remain aware of the ground, the surrounding conditions and the
      proper action required for safe movement.

      All when you state:

      PLUS-LIGHTER, LIGHTER.

      The learned LIGHT FOOT pattern is available only while you are actually
      moving your feet.

      When you stop walking, jogging or running, the present action of LIGHT FOOT
      will cease until you begin moving your feet again.

      Use the Function Command whenever you desire to improve and intensify the
      LIGHT FOOT pattern during movement.

      Use TUNE-UP or RESTORATIVE SLEEP when their separate purposes are appropriate
      for recovery and physical balance.

      Use SYNCHRONIZING when smooth, rapid and coordinated movement is desired.

      The more you use this Function, the easier and more effective it will become.
    notes: 'User-proposed reconstruction with human edit; original input lines 146–199. Not a recovered historical transcript. Historical source availability remains unavailable; reimplementation remains planned. Proposed input: Light Foot/Light_Foot_881047_reconstructed_clean.txt; SHA-256 b7162a671d0dbc3cfbcce49fa4c2057407eaec7bb91dbbc1f9e8cff75fc11b73. Human wording review: user approved body with its final sentence changed to the shared more-you-use-this-Function formulation, removing correctly and while-moving-your-feet from that sentence. Remaining wording and the supplied leading space on one wrapped line retained. Original reference remains unchanged. Effect statements remain proposed claims, not established outcomes. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
