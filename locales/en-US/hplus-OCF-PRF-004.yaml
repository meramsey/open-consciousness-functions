entries:
  hplus.function.ocf-prf-004.opener:
    status: reviewed
    version: 1.1.0
    notes: >-
      OCF adaptation of the user-proposed Light Foot reconstruction;
      proposed input Light Foot/Light_Foot_881047_reconstructed_clean.txt;
      SHA-256 b7162a671d0dbc3cfbcce49fa4c2057407eaec7bb91dbbc1f9e8cff75fc11b73;
      original input line 47. Historical source remains unavailable and
      authenticity unverified. The scope is deliberately expanded from
      walking, jogging, and running on command to a learned, lasting pattern
      of quiet, light, efficient daily movement. Rights: user_cleared per
      user's lawyer-clearance attestation. Finished-session release remains pending.
    text: |-
      This OCF exercise will teach you to move with lightness,
      quiet precision, and natural efficiency, making smooth,
      effortless steps an increasingly permanent part of the way you move.

  hplus.function.ocf-prf-004.function-body:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF adaptation of the user-proposed Light Foot reconstruction;
      proposed input Light Foot/Light_Foot_881047_reconstructed_clean.txt;
      SHA-256 b7162a671d0dbc3cfbcce49fa4c2057407eaec7bb91dbbc1f9e8cff75fc11b73;
      original input lines 146–199. Original reference unchanged;
      historical source unavailable and authenticity unverified.
      Deliberately replaces the reconstruction's restriction to an
      active-on-command movement-only pattern with a lasting baseline
      for quiet, economical gait in daily life; optional Plus Lighter Lighter
      intensifies the learned pattern. Retains exact inhale-hold-command-
      exhale sequence. Covers lifting the feet cleanly, reducing dragging
      and impact, controlled foot placement, balanced posture, natural
      rhythm, and adaptable surface awareness. No companion-function
      recommendations or duplicated commands. The previously preserved
      accidental indentation in the draft body is not carried into the
      new narration. One body supports four passes across Focus 11 and
      Focus 20. Intended effects are suggestions, not established outcomes.
      Rights: user_cleared per user's lawyer-clearance attestation.
      Finished-session release remains pending.
    text: |-
      From this moment forward, your body will learn
      a lighter, quieter, and more efficient way of moving.

      Whether walking through daily life, climbing steps,
      jogging, or running, your feet and legs will work
      together with natural ease and precision.

      Your feet will lift cleanly from the ground,
      moving forward without dragging or scraping.
      Each foot will return gently and deliberately,
      with just the pressure needed for stable support.

      Your steps will grow quieter, smoother, and lighter.
      Unnecessary impact, tension, and wasted motion
      will fade from the way you move.

      Your posture, balance, and rhythm will adjust together.
      You will place each foot where you intend,
      adapting naturally to the ground beneath you
      and the movement you have chosen.

      Your total self will learn this pattern so thoroughly
      that it becomes your natural way of walking,
      without needing to think about each separate step.

      This improvement will remain part of your everyday
      movement, even when you are not consciously
      using the Light Foot command.

      Whenever you wish to strengthen this lightness
      and efficiency even further, inhale deeply
      and gently hold your breath.

      Think or say in your mind, "Plus Lighter Lighter."

      Then exhale slowly through your mouth.

      Your movement will immediately become lighter,
      quieter, more balanced, and more economical,
      while maintaining the awareness and control
      appropriate to your surroundings.

      Each time you move, your body will reinforce
      this effortless pattern. Each time you use
      Plus Lighter Lighter, it will become easier
      and more effective to express at will.

  hplus.function.ocf-prf-004.closer:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-authored concise closer based on the user-proposed reconstruction;
      proposed input Light Foot/Light_Foot_881047_reconstructed_clean.txt;
      SHA-256 b7162a671d0dbc3cfbcce49fa4c2057407eaec7bb91dbbc1f9e8cff75fc11b73;
      original input lines 320–331. Historical source unavailable;
      authenticity unverified. Reminds the listener of lasting everyday
      light-footed movement and optional command reinforcement, preserves
      the original inhale-hold-command-exhale sequence, and uses standard
      OCF sign-off. Rights: user_cleared per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    text: |-
      Remember, your lighter, quieter, more efficient way
      of moving will continue naturally, and whenever
      you wish to strengthen it, inhale deeply,
      hold your breath, and think or say in your mind,
      "Plus Lighter Lighter."

      Then exhale slowly through your mouth.

      This concludes your OCF Light Foot exercise.
