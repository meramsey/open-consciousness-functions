    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/De-Hab/De-Hab.txt; SHA-256 77aadde917a6a06b9534060d2ecbfa904b6d107deb2a204ea2f81f0f39f82be6; lines 148–166. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Waking words sharing line 218 excluded; source numeric labels retained.'
    text: |-
      12. From this point forward, whenever you wish to reduce or eliminate any physical and mental
      habit pattern, all you need do when the pattern arises is to inhale deeply, hold your breath,
      and say or think in your mind, plus, no more, no more, then exhale slowly through your mouth
      as if you're blowing out a candle. When you do this, the unwanted pattern,
      the one you desire to eliminate, will become less and less, less and less throughout your entire system,
      less and less in every part of your total being until you no longer notice it, until it has
      been erased completely from all of your conscious awareness and your total system.
      The more you use this function of reducing and erasing unwanted patterns,
      the easier and more effective it will become.
