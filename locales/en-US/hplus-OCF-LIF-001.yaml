      No More command, the original breathing sequence, and the standard
      OCF ending. This is adapted narration, not verbatim source wording.
      Rights: user_cleared, per user's lawyer-clearance attestation.
      Revised wording awaits final editorial approval.
      Finished-session release pending.
    text: |-
      Remember, whenever an unwanted physical
      or mental habit begins to arise, bring
      that pattern clearly into your awareness.

      Inhale deeply and hold your breath.

      Think or say in your mind, "Plus No More No More."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      This concludes your OCF De-Hab exercise.
