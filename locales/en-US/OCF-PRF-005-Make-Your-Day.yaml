entries:
  hplus.function.ocf-prf-005.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will teach you to shape the day ahead,

      establishing the experiences, conditions, and outcomes

      you desire for yourself, beginning with this day.'
  hplus.function.ocf-prf-005.function-body:
    status: reviewed
    version: 1.1.0
    cue_template:
      function_id: OCF-PRF-005
      allowed:
      - cue.primary
    text: 'From this moment forward, you can begin each morning

      by creating the pattern you desire for the day ahead.


      Before the activities of the day begin,

      bring this day clearly into your awareness.

      See it unfolding as you most desire.


      Picture your physical self strong, comfortable,

      and moving through the day with ease.

      See your mind clear, capable, and aware.

      Feel the emotional harmony and confidence

      you wish to experience throughout this day.


      Now look beyond yourself to the day around you.

      See the meetings, events, opportunities,

      and circumstances taking shape in your favor.

      Picture the outcomes you desire as already

      becoming part of this day''s unfolding pattern.


      Express your intention clearly, in words

      and in the image or knowing you hold within.

      Be definite about what you wish to experience

      and accomplish before this day is complete.


      Inhale deeply and gently hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth.


      Your conscious mind, subconscious mind,

      higher self, and total being will immediately

      begin working together toward the pattern selected.

      Your thoughts, feelings, choices, and actions

      will align with the day you have envisioned.


      Opportunities and favorable possibilities

      will become apparent as events unfold.

      Remain open to unexpected ways your intention

      may take form, even better than you imagined.


      This pattern is for today, here and now.

      Each morning you may create a new one,

      and with each use, shaping your day through

      clear intention will become easier and stronger.'
  hplus.function.ocf-prf-005.closer:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-PRF-005
      allowed:
      - cue.primary
    text: 'Remember, each morning, clearly picture and express

      the experiences and outcomes you desire for this day.

      Inhale deeply and hold your breath.

      Think or say in your mind, "{{ cue.primary }}."

      Then exhale slowly through your mouth.


      This concludes your OCF Make Your Day exercise.'
