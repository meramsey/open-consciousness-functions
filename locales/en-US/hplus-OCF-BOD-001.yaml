    text: |-
      Remember, to direct the improving blood circulation in your brain and in your neck,
      all you need to do is close your eyes. Inhale and hold your breath.
      Think or say in your mind, plus, flow, better.
      Then exhale slowly through your mouth and open your eyes.
      This is the end of your OCF function exercise.
