    text: |-
      Remember, whenever harmful foreign substances
      enter or contact your body, you can consciously
      reinforce its natural protective response.

      Inhale deeply and hold your breath.

      Think or say in your mind,
      "Plus Clear Remove."

      Then exhale slowly through your mouth.

      This concludes your OCF Emergency: Toxic exercise.
