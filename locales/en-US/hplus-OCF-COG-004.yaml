  hplus.function.ocf-cog-004.function-body:
    status: reviewed
    version: 1.1.0
    notes: 'Reference-derived wording with human edit; transcript_unverified. Original SOURCE +Transcripts From available tapes/Imprint/Imprint.txt; SHA-256 679b468816d71bae4c02ec9a4192f074472735a466aecf1fcab0fbde8e9266e9; lines 32–51. Human wording review: user approved the body with the repeated second pass removed. Original SOURCE remains unchanged. Claims and source uncertainty remain explicit, not established outcomes. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      From this moment on, whenever you desire to remember in detail any information or experience,
      all you need do is inhale, hold your breath, and say in your mind,
      plus imprint, imprint, and focus your attention on that which you desire to remember.
      Then exhale slowly and easily.
      When you do this, all of your physical sensory systems will perceive with great intensity and detail the object of your attention.
      They will then route and place such perception into that part of you which retains and holds such signals,
      and they will remain there clear, clean, and precise until you direct otherwise.
      Also, whenever you so desire to perceive again such sensory signals or any part thereof,
      all you need do is say in your mind, plus recall, and then they will return immediately into your conscious awareness.
      The more you use this function of memory placement, the easier and more effective it will become.
