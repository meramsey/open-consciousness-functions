entries:
  hplus.function.ocf-bod-011.opener:
    status: reviewed
    version: 1.1.0
    text: |-
      This OCF exercise will strengthen your body's natural
      ability to maintain hormonal balance and harmony,
      supporting your physical, emotional, mental, and
      spiritual well-being throughout the hormonal changes
      of premenstrual cycles, perimenopause, menopause,
      and postmenopause.
  hplus.function.ocf-bod-011.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-011
      allowed:
      - cue.primary
    text: |-
      From this moment forward, your body's natural
      processes of hormonal regulation are becoming
      smoother, more balanced, and more harmonious.

      Your body recognizes its changing needs
      and adjusts naturally and appropriately
      through every stage of life.

      Your hormonal systems work together
      in harmony, maintaining the balance
      needed for your physical and emotional
      well-being.

      As your hormone levels naturally change,
      your body adapts smoothly and efficiently,
      maintaining its strength, comfort, and stability.

      Unnecessary physical discomfort and tension
      will diminish, allowing your body
      to remain comfortable and at ease.

      Your emotions will become calm and steady,
      your thoughts clear and focused,
      and your sense of inner balance stronger.

      You will move through hormonal changes
      with greater comfort, confidence,
      and emotional stability.

      From this moment forward, this pattern
      of healthy regulation and adaptation
      is firmly and permanently established within you.

      Whether awake, resting, or sleeping,
      your body's natural regulatory systems
      continue working automatically,
      maintaining the balance appropriate
      for your changing needs.

      Whenever you wish to reinforce this
      pattern of hormonal balance and harmony,
      inhale deeply and gently hold your breath.

      Think or say in your mind,
      "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      Your body will return to its natural balance,
      easing unwanted physical, mental,
      and emotional effects of hormonal changes.

      Each time you use {{ cue.primary }},
      this process becomes easier, smoother,
      and more effective.

      Your natural pattern of hormonal regulation,
      comfort, and harmony will continue
      working automatically,
      every day and every night.
  hplus.function.ocf-bod-011.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-011
      allowed:
      - cue.primary
    text: |-
      Remember, whenever you wish to restore
      physical, mental, and emotional balance
      during hormonal changes, inhale deeply
      and hold your breath.

      Think or say in your mind,
      "{{ cue.primary }}."

      Then exhale slowly through your mouth,
      as though gently blowing out a candle.

      As you exhale, you may also express gratitude
      to amplify the entire process.

      This concludes your OCF Hormonal Transitions exercise.
