  hplus.function.ocf-bod-006.function-body:
    status: reviewed
    version: 1.1.0
    notes: 'Reference-derived wording with human edits; transcript_unverified. Original SOURCE +Transcripts From available tapes/Heart Support and Maintenance/Heart Support and Maintenance.txt; SHA-256 f76a1fa970bac47adbde3cdb52f0bccf0e12468654b9596fe9dac68178738f31; lines 36–55. User supplied and approved the body without the transcript embedded count labels; all remaining supplied words and punctuation retained. Original SOURCE remains unchanged. Physiological/efficacy statements remain source claims, not established outcomes. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending. Shared consolidation at 56–59 excluded.'
    text: |-
      From this moment forward, the muscles, nerves, and blood vessels in and around your heart
      are beginning to move more and more into the strong and smooth pattern they are designed to be.
      See and feel as each muscle in your heart is getting stronger and stronger,
      exactly in the balance needed to keep your blood flowing evenly and steadily.
      Feel your blood vessels as they get stronger yet more flexible.
      Watch as any matter that hinders or restricts the easy flow of blood through such vessels
      is beginning to change, more and more,
      Change to soft liquid that the blood carries away to dispose of.
      See any condition is changing in your veins and arteries so as to improve the flow of blood
      through them. Watch the nerves in your heart area as they move their signals more smoothly
      and evenly, more and more, exactly as they are designed to be and do,
      giving strong and steady guidance to the muscles they direct.
      Look as your entire heart renews itself more and more as you desire it,
      More and more evenly pulsing, stronger, more sure, better in every way.
      Know from this moment forward such renewal will continue
      until your heart is exactly the perfection that it is designed to be.
      Also, whenever you wish to improve and speed up this process even more,
      all you need to do is close your eyes, inhale and hold your breath, and say in your mind,
      plus heart, better, better, then exhale slowly through your mouth.
      The more you use this function, the easier and more effective it will become.
