schema_version: '1.0'
locale: en-US
domain: narration
entries:
  hplus.function.ocf-bod-006.opener:
    status: reviewed
    version: 1.1.0
    notes: >-
      OCF-adapted narration based on the unverified Heart Support
      and Maintenance transcript. Original SOURCE +Transcripts From
      available tapes/Heart Support and Maintenance/Heart Support and Maintenance.txt;
      SHA-256 f76a1fa970bac47adbde3cdb52f0bccf0e12468654b9596fe9dac68178738f31;
      line 1. Original reference remains unchanged. Previously
      approved source wording has been simplified and expanded
      to emphasize the heart's natural strength, healthy
      circulation, coordinated function, and ongoing maintenance.
      This is adapted narration, not a verbatim transcription.
      Rights: user_cleared, per user's lawyer-clearance attestation.
      Finished-session release pending.
    text: |-
      This OCF exercise will strengthen and reinforce your heart's
      natural processes of renewal and maintenance, establishing
      a lasting, automatic pattern of healthy strength, balance,
      and efficient function throughout your heart.

  hplus.function.ocf-bod-006.function-body:
    status: reviewed
    version: 1.2.1
    notes: >-
      OCF-adapted narration based on the unverified Heart Support
      and Maintenance transcript. Original SOURCE +Transcripts From
      available tapes/Heart Support and Maintenance/Heart Support and Maintenance.txt;
      SHA-256 f76a1fa970bac47adbde3cdb52f0bccf0e12468654b9596fe9dac68178738f31;
      lines 36–55. Original reference remains unchanged.
      The narration has been reorganized into heart muscle
      strength, healthy blood vessels, circulation, nerve
      coordination, renewal, automatic maintenance, activation,
      and reinforcement. Previously removed transcript count
      labels remain excluded. Source imagery describing the
      liquefaction and transport of vascular obstructions
      has been replaced with nonliteral visualization of
      healthy circulation pathways. OCF-authored suggestions
      establish lasting, automatic, appropriately regulated
      maintenance while preserving confident affirmative wording.
      The exact Plus Heart Better Better activation phrase and
      breathing sequence are preserved. This exercise does
      not constitute a verified treatment for heart disease
      or guarantee anatomical repair. One reusable body is
      intended for repeated playback across Focus 11 and
      Focus 20. Shared consolidation at lines 56–59 remains
      excluded. Rights: user_cleared, per user's
      lawyer-clearance attestation.
      Finished-session release pending.
    cue_template:
      function_id: OCF-BOD-006
      allowed: [cue.primary]
    text: |-
      From this moment forward, the muscles, nerves,
      and blood vessels within and around your heart
      are becoming stronger, healthier, and more balanced.

      Bring your awareness to your heart,
      working steadily and naturally within your chest.

      Feel its strength and its steady rhythm.

      With every heartbeat, your heart performs
      its important work, circulating blood
      throughout your entire physical body.

      Now become aware of the muscles of your heart.

      See and feel these muscles becoming stronger,
      healthier, and more efficient.

      Every part of your heart works together
      in perfect coordination, providing exactly
      the strength needed for smooth, steady circulation.

      Your heart muscles are strong and balanced,
      working naturally and efficiently
      without unnecessary strain.

      Now bring your awareness to the blood vessels
      within and around your heart.

      Visualize each artery and vein becoming stronger,
      healthier, and more flexible.

      See the pathways of circulation becoming
      smooth and clear, allowing blood
      to flow freely and evenly.

      Your heart receives the oxygen and nourishment
      it needs to maintain its strength and vitality.

      Imagine every part of your heart receiving
      a steady, balanced supply of blood.

      See its entire circulation system
      working smoothly and efficiently.

      Now bring your awareness to the signals
      that guide and coordinate your heartbeat.

      These signals are clear, steady,
      and perfectly coordinated.

      Every signal reaches its intended destination,
      guiding your heart muscles to work together
      in a smooth and balanced rhythm.

      Your heart responds naturally and appropriately
      to the changing needs of your body.

      When you are resting, your heart works
      calmly and efficiently.

      When you are active, your heart adjusts
      its activity smoothly and naturally
      to provide the circulation your body needs.

      Every part of your heart works together
      in complete harmony.

      Now become aware of your heart's natural
      processes of maintenance and renewal.

      Visualize every muscle, vessel, and supporting
      structure receiving the nourishment
      and care it needs.

      See your body's natural maintenance systems
      working together, supporting the strength,
      balance, and healthy function of your heart.

      Your heart is growing stronger,
      steadier, and more efficient.

      Its muscles work in harmony,
      its circulation flows smoothly,
      and its rhythm remains naturally balanced.

      Now know that this pattern of healthy
      heart maintenance and renewal
      is becoming permanently established within you.

      From this moment forward, your body's natural
      processes of heart maintenance will continue
      automatically, without conscious thought or effort.

      Whether you are awake, resting, or sleeping,
      these processes will continue working for you.

      Your heart will maintain its natural strength,
      coordination, and healthy balance.

      These processes will always respond intelligently
      to the needs of your body, providing exactly
      the level of activity and support required.

      When more circulation is needed,
      your heart will respond appropriately.

      When your body is resting,
      your heart will return to its natural,
      comfortable, and efficient rhythm.

      This automatic pattern of healthy maintenance
      is now a lasting part of your everyday life.

      Each day, your heart's natural processes
      of maintenance and renewal will work
      more smoothly, efficiently, and effectively.

      Feel the confidence of knowing that
      your heart is supported by these
      automatic processes of healthy maintenance.

      Your heart is strong, steady,
      balanced, and full of natural vitality.

      Whenever you wish to consciously strengthen
      or reinforce this established pattern,
      you can do so quickly and easily.

      Simply close your eyes and bring
      your awareness to your heart.

      Take a deep breath in and gently hold it.

      While holding your breath, silently say
      to yourself, "{{ cue.primary }}."

      Then slowly exhale through your mouth,
      as though gently blowing out a candle.

      As you exhale, visualize your heart
      working smoothly, strongly,
      and in perfect coordination.

      Feel its natural rhythm,
      its steady strength,
      and its balanced activity.

      Your mind reinforces this established pattern
      of healthy heart maintenance and renewal.

      Every muscle, vessel, and supporting system
      works together in complete harmony.

      Each time you use {{ cue.primary }},
      your ability to consciously reinforce
      this pattern becomes easier, faster,
      and more effective.

      Remember, this process is now automatic.

      Your body's natural processes of heart maintenance
      will continue working whether or not
      you consciously think about them.

      {{ cue.primary }} is always available
      whenever you wish to give this established
      pattern additional attention and reinforcement.

      Your heart will continue maintaining
      its natural strength, balance,
      and efficient function every day and every night.

