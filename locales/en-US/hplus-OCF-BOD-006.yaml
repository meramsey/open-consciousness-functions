      function_id: OCF-BOD-006
      allowed: [cue.primary]
    text: |-
      Remember, your heart's natural processes
      of maintenance and renewal are now firmly
      established as a lasting, automatic pattern.

      Whenever you wish to consciously reinforce
      this pattern, simply close your eyes.

      Bring your attention to your heart.

      Inhale deeply and gently hold your breath.

      Silently say to yourself,
      "{{ cue.primary }}."

      Then slowly exhale through your mouth,
      as though gently blowing out a candle.

      This concludes your OCF Heart Flow exercise.
