  hplus.function.ocf-cog-003.function-body:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/Contemplation/Contemplation.txt; SHA-256 0246ff60f52cd8a9f13b23ea1df19350397b0eb0d07d7ce7e47005e6b3d9ef7d; lines 31–54. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. '
    text: |-
      From this moment on, whenever you desire to be as one with the entire you, all you
      need do is close your eyes, inhale deeply, hold your breath, then say or think in your
      mind, plus open, then exhale slowly through your mouth and breathe normally and deeply.
      When you do this, your physical system will relax more and more as you breathe, but
      your mind will remain bright and awake.
      Memory of any personal experience that you have lived in any form will become
      immediately available to you. Your complete, greater self will become ready
      for communication in whatever way you desire, and you will remain calm and serene as you
      perceive, understand, and remember. When you desire to end for the moment such
      state of contemplation, all you need do is say in your mind, plus closed, and you
      will return to your normal waking physical condition.
      The more you use this method of total communion, the easier and more effective it will become.
