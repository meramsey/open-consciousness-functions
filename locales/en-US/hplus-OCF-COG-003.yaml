    text: |-
      Remember, whenever you wish to commune
      with your total self, close your eyes,
      inhale deeply, and hold your breath.

      Think or say in your mind, "Plus Open."

      Then exhale slowly through your mouth
      and breathe naturally.

      When you wish to end the contemplation,
      think or say in your mind, "Plus Closed."

      This concludes your OCF Contemplation exercise.
