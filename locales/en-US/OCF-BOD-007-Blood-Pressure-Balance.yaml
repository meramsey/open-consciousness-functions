entries:
  hplus.function.ocf-bod-007.opener:
    status: reviewed
    version: 1.2.0
    text: This OCF exercise will teach you to reinforce your body's natural ability to regulate blood
      pressure, supporting healthy circulation, cardiovascular balance, and coordinated heart and blood
      vessel function.
  hplus.function.ocf-bod-007.function-body:
    status: reviewed
    version: 1.2.0
    cue_template:
      function_id: OCF-BOD-007
      allowed:
      - cue.primary
    text: 'From this moment forward, let your body''s natural systems of blood pressure regulation, circulation,
      and cardiovascular maintenance work together in healthy balance.


      Let your heart and blood vessels work smoothly and efficiently, supporting the circulation of oxygen
      and nourishment throughout your body.


      Let your blood vessels remain healthy, strong, and naturally flexible, responding appropriately
      to your body''s changing needs.


      When you are resting, let your cardiovascular system settle into calm, comfortable, and efficient
      activity.


      When you are active, let your heart and blood vessels adjust naturally, providing the circulation
      and support your body requires.


      Let unnecessary physical tension ease, allowing your breathing, muscles, and mind to return to a
      comfortable, balanced state.


      This pattern of healthy cardiovascular regulation and maintenance is permanently established within
      you.


      It continues automatically, whether you are awake, resting, or asleep, adjusting to your body''s
      needs without conscious effort.


      Whenever you wish to reinforce this established pattern, simply close your eyes.


      Take a comfortable breath in and gently hold it.


      While holding your breath, silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth, as though gently blowing out a candle.


      As you exhale, let your heart and blood vessels continue working together in natural balance, supporting
      healthy circulation and appropriate blood pressure regulation.


      The more you use this command, the easier and more effective this conscious reinforcement becomes.'
  hplus.function.ocf-bod-007.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-BOD-007
      allowed:
      - cue.primary
    text: 'Remember, to reinforce your body''s natural blood pressure regulation and cardiovascular balance,
      close your eyes.


      Inhale comfortably and gently hold your breath.


      Silently say to yourself,

      "{{ cue.primary }}."


      Then slowly exhale through your mouth, as though gently blowing out a candle.


      This concludes your OCF Blood Pressure Balance exercise.'
