  hplus.function.ocf-cog-001.function-body:
    status: reviewed
    version: 1.0.0
    notes: 'Reference-derived wording; transcript_unverified. SOURCE +Transcripts From available tapes/Access to Information/Access to Information.txt; SHA-256 f41db5dbb1bb123081cfb4dc8ce02d839c6b80f2d8c3f1213ee4e51b10a24a14; lines 39–49. Human wording review: user approved body unchanged. Shared preparation/state/return wording excluded. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      Here you can take information from your access channel, all of that which is you and yours, piece by piece, and place it in your waking conscious memory.
      It may be in the form of words or in pictures in your mind or emotions or feelings and sensations or all of these at once.
      These are a part of you and your life experiences.
      This is your personal library of knowledge and it is all available to you.
      To obtain knowledge from it, all you need do is say in your mind, say to yourself, plus retrieve and then think of the information you desire and the answer will come to you immediately.
      Here it is again.
      To access your own personal library of knowledge, all you need do is say in your mind, say to yourself, plus retrieve and then think of the information you desire.
      The information will then move immediately into your conscious awareness.
      To help you begin this process, recall a time in your life when you felt great wisdom, knowledge, or certainty.
      Right now, confidently say in your mind, plus retrieve.
      Explore now any information you desire to retrieve.
