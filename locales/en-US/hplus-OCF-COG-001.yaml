  hplus.function.ocf-cog-001.function-body:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-adapted narration based on the unverified Access to
      Information transcript. Original SOURCE +Transcripts From
      available tapes/Access to Information/Access to Information.txt;
      SHA-256 f41db5dbb1bb123081cfb4dc8ce02d839c6b80f2d8c3f1213ee4e51b10a24a14;
      lines 39–49. Original reference remains unchanged.
      The narration has been reorganized into personal knowledge
      awareness, forms of information, permanent availability,
      automatic organization, conscious retrieval, and affirmative
      reinforcement. The exact Plus Retrieve command is preserved.
      The original command-first, information-selection sequence
      remains supported. Duplicate activation instructions have
      been removed. OCF-authored suggestions establish lasting
      access and automatic organization of personal knowledge.
      No breathing instruction is added because the source
      function does not specify one. One reusable body supports
      four playback passes across Focus 11 and Focus 20.
      Shared preparation, state, and return wording remains
      excluded. Suggested outcomes are exercise intentions,
      not independently verified retrieval capabilities.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Revised wording awaits final editorial
      approval. Finished-session release pending.
    text: |-
      From this moment forward, your ability to access
      your personal library of information and knowledge
      is becoming stronger, faster, and more effective.

      Everything you have learned, experienced,
      observed, and understood contributes
      to this vast library within you.

      Information may come into your awareness
      as words, images, memories, feelings,
      sensations, or sudden understanding.

      Your mind recognizes these different forms
      and brings them together to provide
      the knowledge and understanding you seek.

      Your personal library is always available,
      ready to provide the information you desire.

      From this moment forward, this ability
      to access your knowledge is permanently
      established within you.

      Your mind will continue organizing
      information automatically, connecting
      related ideas and experiences,
      even when you are not consciously
      thinking about them.

      Whenever you desire information
      from your personal library,
      simply think or say in your mind,
      "Plus Retrieve."

      Then focus clearly on the information,
      knowledge, or understanding you desire.

      The information you seek will immediately
      begin moving into your conscious awareness.

      The answer will become clear to you,
      arriving naturally in whatever form
      best communicates the knowledge you need.

      Words, images, feelings, and understanding
      will come together, allowing you
      to recognize and use the information.

      The more you use Plus Retrieve,
      the easier, faster, and more effective
      this process will become.

      Your personal library of knowledge
      will remain available to you
      whenever you desire to access it.

      Now think of something you wish to know
      or understand more clearly.

      Silently say, "Plus Retrieve."

      Allow the information to come
      into your conscious awareness.

      Begin exploring your personal
      library of knowledge now.

  hplus.function.ocf-cog-001.closer:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-authored closer adapted from the previously approved
      proposal. The historical Access to Information transcript
      contains a session exploration handoff at line 50 rather
      than a complete function-specific waking closer.
      Original SOURCE +Transcripts From available
      tapes/Access to Information/Access to Information.txt;
      SHA-256 f41db5dbb1bb123081cfb4dc8ce02d839c6b80f2d8c3f1213ee4e51b10a24a14;
      line 50 remains outside the function closer.
      The closer contains one purpose reminder, the exact
      Plus Retrieve activation command, and the standard
      OCF ending. No additional reinforcement is included.
      This is OCF-authored wording, not historical transcript
      text. Rights: user_cleared, per user's lawyer-clearance
      attestation. Revised wording awaits final editorial
      approval. Finished-session release pending.
    text: |-
      Remember, whenever you wish to access
      your personal library of knowledge,
      think or say in your mind, "Plus Retrieve."

      Then focus on the information you desire,
      and allow it to enter your conscious awareness.

      This concludes your OCF Access to Information exercise.
