    text: |-
      Beginning now, right at this moment, more and more, the forces and systems in your physical body that attack and destroy
      and remove all harmful organisms that enter your body, such forces and systems are becoming stronger and stronger.
      So that any such organisms within or entering your body that may hinder or prevent it from being and living its greatest, most efficient and joyful state,
      such destructive organisms are quickly reduced and then eliminated.
      With each new day, week or month, such protective forces and systems in your body are becoming greater and greater, stronger and stronger,
      so that any new destructive organisms entering your body are much more easily and quickly controlled, destroyed and removed.
      Also, whenever you desire to increase such forces and systems even more, all you need do is inhale, hold your breath and say in your mind,
      Plus, alert, destroy, then exhale slowly through your mouth.
      The more you use this function, the easier and more effective it will become.
