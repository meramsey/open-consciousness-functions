entries:
  hplus.function.ocf-lif-001.opener:
    status: reviewed
    version: 1.1.0
    text: 'This OCF exercise will teach you to release

      and eliminate unwanted physical and mental

      habit patterns that interfere with your

      well-being, freedom, and growth.'
  hplus.function.ocf-lif-001.function-body:
    status: reviewed
    version: 1.3.1
    cue_template:
      function_id: OCF-LIF-001
      allowed:
      - cue.primary
    text: 'From this moment forward, you have the ability

      to eliminate any unwanted physical or mental

      habit pattern that you choose to release.


      A habit is a pattern repeated until it begins

      to operate automatically. You can recognize

      such a pattern and change it at its source.


      Whenever the unwanted habit begins to arise,

      recognize the particular pattern you wish

      to eliminate and bring it clearly into your mind.


      Inhale deeply and gently hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth,

      as though gently blowing out a candle.


      The unwanted pattern will immediately

      begin to weaken throughout your entire system.


      Its familiar impulse will become smaller,

      quieter, and less compelling, until it

      no longer directs your thoughts or actions.


      Your conscious mind, subconscious mind,

      physical body, and total self will release

      the old pattern together, completely.


      Each time the pattern would once have occurred,

      your freedom to choose will grow stronger.

      Your mind and body will respond naturally

      in the way you now desire.


      The unwanted habit will continue fading

      until it is completely eliminated

      from your automatic responses.


      Your useful memories, knowledge, and skills

      will remain intact, while the unwanted

      pattern loses its place in your life.


      From this moment forward, this ability

      to change and eliminate unwanted habits

      is permanently available whenever you choose.


      The more you use {{ cue.primary }},

      the easier, faster, and more effective

      this lasting change will become.'
  hplus.function.ocf-lif-001.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-LIF-001
      allowed:
      - cue.primary
    text: 'Remember, whenever an unwanted physical

      or mental habit begins to arise, bring

      that pattern clearly into your awareness.


      Inhale deeply and hold your breath.


      Think or say in your mind, "{{ cue.primary }}."


      Then exhale slowly through your mouth,

      as though gently blowing out a candle.


      This concludes your OCF Habit Freedom exercise.'
