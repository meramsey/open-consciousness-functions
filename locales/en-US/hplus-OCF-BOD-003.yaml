  hplus.function.ocf-bod-003.function-body:
    status: reviewed
    version: 1.1.0
    notes: 'Reference-derived wording with human selection/edit; transcript_unverified. Original SOURCE +Transcripts From available tapes/De-Discomfort/De-Discomfort.txt; SHA-256 bd84798ad0ac710ba5820ae872f077f2763ca20e7395d8880a78ac96e8492eae; selected body is the single first source occurrence within lines 30–50. User supplied and approved this single-pass body, selecting the first occurrence from the source partition and changing body references as written below; original reference remains unchanged. The source partition also contains repeated passages, which are not included in this user-selected draft. Physiological and efficacy statements remain claims, not established outcomes. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending.'
    text: |-
      At any point in your life from this moment forward, if you wish to reduce discomfort
      signals from any part of your body, all you need do is close your eyes, inhale deeply,
      and hold your breath. Then look with your closed eyes at that part of your physical
      body from which such signals begin, and say or think in your mind, plus five five five
      one five. Then exhale slowly. When you do this, such signals will quickly become less
      and less, less and less, until they are no longer important to you. The more you
      use this function of reducing discomfort signals, the easier and smoother it will become.
