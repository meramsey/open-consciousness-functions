    text: |-
      Remember to reduce discomfort signals in your
      physical body. Inhale deeply and slowly. Hold your breath. Look with your
      closed eyes at the source of such discomfort, and say or think in your
      mind, plus 5, 5, 5, 1, 5. Then exhale deeply and slowly. Use it as you need it.
      This is the end of this OCF function exercise.
