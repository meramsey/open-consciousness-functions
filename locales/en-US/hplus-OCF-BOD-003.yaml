  hplus.function.ocf-bod-003.function-body:
    status: draft
    version: 1.0.0
    notes: 'Reference-derived review candidate; transcript_unverified. SOURCE +Transcripts From available tapes/De-Discomfort/De-Discomfort.txt; SHA-256 bd84798ad0ac710ba5820ae872f077f2763ca20e7395d8880a78ac96e8492eae; lines 30–50. Selected words and punctuation retained; shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain for human review. Rights: user_cleared, per user''s lawyer-clearance attestation. Wording review and finished-session release pending. Waking text sharing line 104 stays in the shared return; trailing Thank you at 109 excluded.'
    text: |-
      At any point in your life from this moment forward, if you wish to reduce discomfort
      signals from any part of your body, all you need do is close your eyes, inhale deeply,
      and hold your breath. Then look with your closed eyes at that part of your physical
      body from which such signals begin, and say or think in your mind, plus five five five
      one five. Then exhale slowly. When you do this, such signals will quickly become less
      and less, less and less, until they are no longer important to you. The more you
      use this function of reducing discomfort signals, the easier and smoother it will become.
