  hplus.function.ocf-prf-006.function-body:
    status: draft
    version: 1.0.0
    text: |-
      At any time from this moment forward, when an emergency situation requires
      an instant and momentary application of unusual muscular strength and
      quickness, inhale deeply and hold your breath.

      Then say or think in your mind:

      PLUS-STRONG-QUICK.

      Then exhale slowly through your mouth.

      When you do this, your physical body will respond immediately to the action
      that is required.

      Your conscious mind will remain clear and alert.

      Your attention will move directly to the immediate need.

      All parts of your physical body involved in the action will work together
      more smoothly and completely.

      Your movement will become quicker, stronger and more coordinated.

      Your muscles will apply the greatest strength and speed readily available
      to them for the immediate action.

      Unrelated thought and hesitation will move into the background.

      You will know what action is needed, and your physical body will respond
      quickly and directly.

      All when you state:

      PLUS-STRONG-QUICK.

      This Function is for an emergency need only.

      Its application is instant and momentary.

      Use it only as needed and only for a short duration.

      It is not for practice, display, competition or continuous application.

      When the emergency need has passed, use the RELEASE Function.

      Bring STRONG-QUICK clearly into your mind.

      Inhale deeply and hold your breath.

      Say or think in your mind:

      PLUS-RELEASE.

      Then exhale slowly through your mouth.

      The present application of STRONG-QUICK will end, and your physical system
      will return smoothly to its normal condition.

      The learning of STRONG-QUICK will remain within you, ready for use again if
      a true emergency need arises.

      The more correctly you use this method, the easier and more effective it
      will become.
