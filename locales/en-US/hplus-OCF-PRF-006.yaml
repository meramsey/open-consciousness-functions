    text: |-
      Remember, when a true emergency requires instant and momentary strength and
      quickness, inhale deeply and hold your breath.

      Say in your mind:

      PLUS-STRONG-QUICK.

      Then exhale slowly through your mouth.

      Use it only as needed and for a short duration.

      When the need has passed, use the RELEASE Function:

      PLUS-RELEASE.

      This is the end of your H-PLUS Function learning exercise.
