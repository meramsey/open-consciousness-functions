      breathing sequence and exact spoken Plus Strong Quick command, the
      separate Plus Release cue, and standard OCF sign-off. Rights:
      user_cleared per user's lawyer-clearance attestation. Revised wording
      awaits editorial approval; finished-session release pending.
    text: |-
      Remember, when an immediate need calls for extraordinary
      strength and quickness, inhale deeply, hold your breath,
      and think or say in your mind, "Plus Strong Quick."
      Then exhale slowly through your mouth.

      When the need has passed, bring Strong-Quick to mind,
      inhale, hold your breath, think or say "Plus Release,"
      and exhale slowly through your mouth.

      This concludes your OCF Strong-Quick exercise.
