    text: This OCF function exercise is to explore the options available to you in a life activity.
  hplus.function.ocf-cog-005.function-body:
    status: reviewed
    version: 1.0.0
    notes: 'Reference-derived wording; partial_transcript. SOURCE +Transcripts From available tapes/Options/Options.txt; SHA-256 355fc430a981e1f1c97f529d2e80dc5febc6b0dea989ac6f271e4382aefce195; lines 38–56. Human wording review: user approved the body unchanged. Shared preparation/state/return wording excluded. Source repetitions, transcription uncertainties and claims remain explicit, not established outcomes. Rights: user_cleared, per user''s lawyer-clearance attestation. Finished-session release pending. Line 46 remains in the body.'
    text: |-
      At any point in the future when you desire to see with your mind's eye what options you do have in any of your life activity,
      all you need to do is close your eyes and hold your breath.
      Then think of the life activity on which you desire information.
      Then say in your mind, plus options, choices.
      Then exhale slowly and leave your eyes closed.
      When you do this, your total self will clearly and accurately present to your waking consciousness in great detail each possibility and probability related to the life activity in question.
      Your greater self will do so by reaching into your own life experience and gathering other information beyond the pattern of your own experience
      and will present such options to your conscious awareness in a manner and form you will understand clearly.
      The more you perform this method of seeing ahead, the easier and more effective it will become.
