# OCF-COG-005 — Options
# English function-specific OCF-adapted narration.
# Edit this file as the wording source of truth.
# Source status: partial_transcript; authentication remains unverified.
# Missing opener: The historical source begins with music and
# shared preparation; its purpose statement at line 46 remains
# part of the function body.
# Missing closer: The historical source ends in ellipsis runs
# without a recoverable function-specific closer.
# Review note: The opener and closer are OCF-authored adaptations.
# Review note: The Plus Options Choices command is preserved.
# Review note: The function explores possibilities, probabilities,
# potential outcomes, and information accessible through
# the listener's total self and greater consciousness.
# Review note: The listener retains conscious freedom of choice.
# Review note: The ability remains permanently available,
# with conscious activation whenever desired.
# Review note: One concise function body supports four-pass playback.
# Review note: Closer follows the standardized OCF reminder format.
schema_version: '1.0'
locale: en-US
domain: narration
entries:
  hplus.function.ocf-cog-005.opener:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-authored opener adapted from the previously approved
      Options function introduction. The partial historical
      transcript contains no distinct function-specific opener.
      The source purpose statement at line 46 remains assigned
      to the body. Wording has been expanded to emphasize
      conscious exploration of choices, possibilities,
      probabilities, and potential outcomes through
      the listener's greater awareness.
      This is OCF-authored narration, not historical wording.
      Historical source remains partial_transcript and unverified.
      Rights: user_cleared, per user's lawyer-clearance attestation.
      Finished-session release remains pending.
    text: |-
      This OCF exercise will teach you to explore
      the choices and possibilities available to you,
      drawing upon your greater consciousness
      to understand potential outcomes
      and discover new directions in your life.

  hplus.function.ocf-cog-005.function-body:
    status: reviewed
    version: 1.1.0
    notes: >-
      OCF-adapted narration based on the partial, unverified
      Options transcript. Original SOURCE +Transcripts From
      available tapes/Options/Options.txt;
      SHA-256 355fc430a981e1f1c97f529d2e80dc5febc6b0dea989ac6f271e4382aefce195;
      lines 38–56. Original reference remains unchanged.
      The purpose statement at line 46 remains in the
      original body source range.
      Previously approved wording has been reorganized into
      conscious intention, total-self awareness, exploration
      of possibilities and probabilities, perception of
      potential outcomes, freedom of choice, activation,
      and reinforcement. The exact Plus Options Choices
      command and original breathing sequence are preserved.
      OCF-authored suggestions reinforce access to the
      listener's greater self, including insights beyond
      ordinary waking awareness and personal experience.
      Possibilities and probabilities are presented as
      potential pathways rather than a fixed future.
      The listener retains conscious freedom to evaluate,
      select, and act upon the information received.
      The ability is established as permanently available,
      with conscious activation whenever desired.
      One reusable body supports repeated playback
      across Focus 11 and Focus 20.
      Shared preparation, state, and return wording excluded.
      Affirmative suggestions express the intended
      contemplative experience and are not independently
      verified predictions of future events.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    text: |-
      From this moment forward, you have the ability
      to explore the possibilities and choices
      available to you in any area of your life.

      Your total self holds a greater perspective,
      drawing upon your experiences, knowledge,
      subconscious awareness, and higher consciousness.

      Through this greater awareness,
      you can perceive possibilities and pathways
      beyond those ordinarily recognized
      by your waking conscious mind.

      Whenever you wish to explore your options,
      close your eyes and inhale deeply.

      Gently hold your breath and think clearly
      of the situation, decision, or life activity
      you wish to understand.

      Think or say in your mind,
      "Plus Options Choices."

      Then exhale slowly through your mouth,
      keeping your eyes closed.

      Your greater self will bring into
      your conscious awareness the possibilities,
      choices, and potential outcomes
      related to your selected situation.

      You will recognize different paths
      available to you and understand
      where each choice can lead.

      The probabilities, opportunities,
      advantages, and consequences
      of these paths will become clearer.

      Your greater self will draw upon
      your personal experiences and knowledge,
      together with information and understanding
      beyond your ordinary waking awareness.

      These insights will come to you as
      images, words, feelings, intuitive knowing,
      or clear and direct understanding.

      You will perceive and understand
      the information calmly and confidently,
      recognizing possibilities you had
      not previously considered.

      New choices and opportunities
      will become visible to you,
      expanding your understanding
      of what is possible.

      You remain completely free to choose
      the direction you wish to follow.

      Each choice creates new possibilities,
      and your greater awareness will help
      you recognize the paths available.

      From this moment forward, this ability
      to explore possibilities and probabilities
      is permanently established within you.

      Your mind and greater self will continue
      forming useful connections and insights,
      bringing new understanding into
      your awareness whenever it is needed.

      Each time you use Plus Options Choices,
      your ability to perceive and understand
      your available options becomes easier,
      clearer, and more effective.

      Your greater awareness is always available,
      ready to help you explore the possibilities
      and choices before you.

  hplus.function.ocf-cog-005.closer:
    status: reviewed
    version: 1.2.0
    notes: >-
      OCF-authored closer adapted from the previously approved
      Options function reminder. The partial historical transcript
      provides no recoverable function-specific closer.
      Original SOURCE +Transcripts From available
      tapes/Options/Options.txt;
      SHA-256 355fc430a981e1f1c97f529d2e80dc5febc6b0dea989ac6f271e4382aefce195.
      The closer has been shortened to one purpose reminder,
      the exact Plus Options Choices activation command,
      the original attention and breathing sequence,
      and the standard OCF ending.
      The instruction to keep the eyes closed after
      activation remains preserved.
      Additional reinforcement remains in the function body.
      This is OCF-authored wording, not historical transcript text.
      Rights: user_cleared, per user's lawyer-clearance
      attestation. Finished-session release remains pending.
    text: |-
      Remember, whenever you wish to explore
      the choices and possibilities available to you,
      close your eyes and inhale deeply.

      Hold your breath and focus on
      the situation you wish to understand.

      Think or say in your mind,
      "Plus Options Choices."

      Then exhale slowly through your mouth,
      keeping your eyes closed.

      This concludes your OCF Options exercise.
