- id: return
  timeline:
  - at: '00:26:22.640'
    id: e064
    text: I'm going to count now from twenty down to one, and when I reach the count of one, you will
      be completely wide awake and rested both physically and mentally.
  - at: '00:26:41.560'
    id: e065
    text: All of your senses will be operating clearly, cleanly, strongly, sharply, and beautifully. All
      when I reach the count of one.
  - at: '00:26:53.880'
    id: e066
    text: I'm going to count now. Twenty. Nineteen. Eighteen.
  - at: '00:27:12.960'
    id: e067
    text: Seventeen. Sixteen.
  - at: '00:27:26.920'
    id: e068
    text: Fifteen. Fourteen.
  - at: '00:27:39.400'
    id: e069
    text: Thirteen. Twelve.
  - at: '00:27:50.680'
    id: e070
    text: Eleven. Ten.
  - at: '00:28:10.280'
    id: e071
    text: Nine. Eight. Seven.
  - at: '00:28:21.680'
    id: e072
    text: When I reach the count of one, you will be completely wide awake both physically and mentally,
      and completely refreshed and full of new energy, with all of your five physical senses operating
      clearly, cleanly, sharply, and beautifully.
  - at: '00:28:32.520'
    id: e073
    text: All when I reach the count of one. Seven. Six. Five. Four. Three. Two. One.
  - at: '00:28:38.240'
    id: e074
    text: Wake up. Wake up. Open your eyes.
  - at: '00:29:01.600'
    id: e075
    text: You're completely wide awake and full of new energy.
  type: return
- id: closing
  role: closing reminder
  timeline:
  - at: '00:29:08.240'
    id: e076
    text: Remember, whenever you wish to focus your attention completely, all you need to do is inhale,
      hold your breath, and say or think in your mind, PLUS-FOCUS.
  - at: '00:29:17.320'
    id: e077
    text: Then exhale slowly, like blowing out a candle. Use it. This is the end of this Open Consciousness
      function exercise.
  type: outro
