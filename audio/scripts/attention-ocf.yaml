  - at: '00:16:18.320'
    id: e051
    text: Eighteen.
  - at: '00:16:36.320'
    id: e052
    text: Nineteen.
  - at: '00:16:54.320'
    id: e053
    text: Twenty. Twenty.
  type: state-transition
- gain_db: -24.0
  id: sleep20
