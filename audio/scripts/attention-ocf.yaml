id: OCF-SCRIPT-ATTENTION-001
schema_version: '1.0'
sections:
- id: opening
  role: settle and reach the tenth state
  timeline:
  - at: '00:00:00.000'
    id: e001
    text: This is your Open Consciousness function exercise to focus your attention.
  - at: '00:00:29.880'
    id: e002
    text: To prepare for this Open Consciousness function exercise, move now to make your body comfortable,
      whatever is best for you.
  - at: '00:00:48.800'
    id: e003
    text: You have made sure that you will not be interrupted during this learning period, and now get
      your body into your most relaxed position.
  - at: '00:01:02.120'
    id: e004
    text: Loosen any tight clothing. Stretch your arms and legs and let them droop, limp and relaxed.
  - at: '00:01:09.440'
    id: e005
    text: Turn your head slowly from side to side.
  - at: '00:01:18.160'
    id: e006
    text: Breathe easily and deeply. I will wait while you do this.
  - at: '00:01:48.600'
    id: e007
    text: Turn now to your energy conversion box and raise the heavy lid.
  - at: '00:01:59.200'
    id: e008
    text: Place inside it any worries, anxieties and concerns you are carrying right now.
  - at: '00:02:06.360'
    id: e009
    text: You do not need them now, and they will only get in the way of this session. Do this now.
  - at: '00:02:48.160'
    id: e010
    text: Close the lid of your energy conversion box. Close it tightly. Turn away. Breathe slowly and
      deeply and relax.
  - at: '00:03:18.160'
    id: e011
    text: Move now to the tenth state of total relaxation as I guide you.
  - at: '00:03:42.000'
    id: e012
    text: '2'
  - at: '00:03:55.320'
    id: e013
    text: '3'
  - at: '00:04:10.600'
    id: e014
    text: '4'
  - at: '00:04:12.000'
    id: e015
    text: '5'
  - at: '00:04:42.000'
    id: e016
    text: '6'
  - at: '00:05:01.360'
    id: e017
    text: '7'
  - at: '00:05:12.000'
    id: e018
    text: '8'
  - at: '00:05:34.960'
    id: e019
    text: '9'
  - at: '00:05:42.000'
    id: e020
    text: '10'
  - at: '00:06:01.200'
    id: e021
    text: '10'
  - at: '00:06:01.880'
    id: e022
    text: Relax calmly and serenely in the tenth state.
  type: preparation
- id: access-open
  role: open the access channel
  timeline:
  - at: '00:06:31.880'
    id: e023
    text: You will open your access channel now, as I guide you.
  - at: '00:06:51.880'
    id: e024
    text: '11'
  - at: '00:06:55.560'
    id: e025
    text: All parts of your being, from your conscious waking mind down to every living cell, are open
      to understand and act upon the instruction you are about to receive, to let it become the knowledge,
      the knowing, of your entire living system.
  - at: '00:07:40.720'
    id: e026
    text: Here is the instruction to all of you.
  type: access-open
- id: focus11
  role: PLUS-FOCUS function material
  timeline:
  - at: '00:07:56.783'
    id: e027
    text: From this moment on, when you want to focus your attention narrowly and closely, all you need
      do is inhale, hold your breath, and say in your mind, PLUS-FOCUS.
  - at: '00:08:09.287'
    id: e028
    text: When you do this, your mind and body will direct and hold all your senses, all your thoughts,
      and all of your thinking into one area of activity, whatever you so desire.
  - at: '00:08:21.790'
    id: e029
    text: When you do focus your attention by this method, you will remember in great detail all of that
      which you perceive and experience, and you will feel good, bright, and calmly sure.
  - at: '00:08:34.293'
    id: e030
    text: All of these will be yours when you inhale deeply and hold your breath and say, PLUS-FOCUS,
      in your mind, and then exhale through your mouth as if you were blowing out a candle.
  - at: '00:08:46.797'
    id: e031
    text: The more you perform this exercise of focusing your attention, the easier and more effective
      it will become.
  - at: '00:09:11.803'
    id: e032
    text: From this moment on, when you want to focus your attention narrowly and closely, all you need
      do is inhale, hold your breath, and say in your mind, PLUS-FOCUS.
  - at: '00:09:24.307'
    id: e033
