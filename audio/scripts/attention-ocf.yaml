      and all of your thinking into one area of activity, whatever you so desire.
  - at: '00:09:36.810'
    id: e034
    text: When you do focus your attention by this method, you will remember in great detail all of that
      which you perceive and experience, and you will feel good, bright, and calmly sure.
  - at: '00:09:49.313'
    id: e035
    text: All of these will be yours when you inhale deeply and hold your breath and say, PLUS-FOCUS,
      in your mind, and then exhale through your mouth as if you were blowing out a candle.
  - at: '00:10:01.817'
    id: e036
    text: The more you perform this exercise of focusing your attention, the easier and more effective
      it will become.
  type: function-intro
- id: access-close
  role: close the access channel
  timeline:
  - at: '00:11:30.440'
    id: e037
    text: You will remember and act upon this knowledge function at any point from this moment on. You
      will so act with your entire being when your conscious waking self gives the correct action signal,
      the one you have just learned. The more you use this signal and function, the smoother and easier
      it will become. You will close your Access Channel now as I guide you.
  - at: '00:12:11.160'
    id: e038
    text: Ten. Ten. You are moving back to the tenth state of total relaxation as the access signal goes
      away. Ten. The access signal is fading more and more. Ten. The access signal, the access channel
      is closed. It will stay closed until your next function learning exercise.
  - at: '00:12:50.480'
    id: e039
    text: Relax and feel calm and serene in the tenth state.
  type: access-close
- id: sleep-induction
  timeline:
  - at: '00:13:20.480'
    id: e040
    text: You will move now into easy and normal, restful sleep as I guide you. When I reach the count
      of twenty, you will be in normal, natural, restful sleep.
  - at: '00:13:45.000'
    id: e041
    text: Remember, the higher the number, the more deeply relaxed you become, and the more you drift
      easily and calmly into natural, complete sleep.
  - at: '00:13:52.320'
    id: e042
    text: I'm going to count now.
  type: state-transition
- id: count-to-twenty
  timeline:
  - at: '00:13:54.320'
    id: e043
    text: Ten.
  - at: '00:14:12.320'
    id: e044
    text: Eleven.
  - at: '00:14:30.320'
    id: e045
