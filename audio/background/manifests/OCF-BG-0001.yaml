      0:00-3:18  focus-3 (induction)
      3:18-6:31  linear crossfade focus-3 -> focus-10 (build)
      6:31-13:20 focus-10 hold (access channel opens ~6:31, closes ~12:50)
      13:20-16:54 linear crossfade focus-10 -> focus-3 (taper)
      16:54-29:33 focus-3 (sleep -> wake)
    A future focus-11 preset can be spliced into the 6:31-13:20 hold window.
    Sources: presets/focus-3.yaml and presets/focus-10.yaml of farfield 0.1.0.
