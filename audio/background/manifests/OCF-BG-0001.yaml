schema_version: "1.0"
id: "OCF-BG-0001"
name: "Attention access-channel bed (Focus 10 → Focus 11 → Focus 10)"
author: "pending-source-review"
engine: "farfield"
engine_source:
  repository: "https://github.com/txus/farfield"
  version: "0.1.0"
preset:
  file: audio/background/presets/attention-focus-10-11-10.yaml
focus_sequence:
- state: "focus-10"
  role: "pre-access"
  start_s: 0.0
- state: "focus-11"
  role: "access-channel"
  start_s: 391.0
  end_s: 770.0
  crossfade_s: 30
- state: "focus-10"
  role: "return"
  start_s: 770.0
render:
  output: "audio/background/rendered/attention-focus-bed.wav"
  seed: null
  deterministic: true
usage:
  functions:
  - "OCF-FND-002"
  audio_implementations:
  - "OCF-AUDIO-0001"
provenance:
  design: "derived"
  notes: |
    Canonical Focus 11 Access Channel background sequence:

      Focus 10  ->  Focus 11  ->  Focus 10
        pre-access   access window   return

    Focus 3 is NOT part of this sequence. It may serve as an optional
    induction/preparation mechanism in the preparation layer, but it must not
    redefine the Focus 11 Access Channel program.

    Corrected 2026-09-30. Earlier metadata for this id described a
    "focus-3 -> focus-10 -> focus-3" arc. That framing was wrong and has been
    superseded: the analyzed Human Plus / Focus 11 Access Channel source
    establishes Focus 10 -> Focus 11 -> Focus 10. The superseded arc is not
    authoritative and must not be restored.

    Timing. Only source-backed values are recorded, taken from the measured
    splice in OCF-BG-0011 (access window 6:31-12:50, 30 s linear crossfades):
      0:00-6:31   focus-10   pre-access
      6:31-12:50  focus-11   access channel open (391.0 s - 770.0 s)
      12:50-end   focus-10   return
    No other boundaries are asserted; the bed is trimmed to the narration
    length.

    Representation. preset.file points at one combined Farfield session,
    audio/background/presets/attention-focus-10-11-10.yaml, which carries
    this exact sequence: Focus 10 throughout, the Focus 11 access state
    layered over 6:31-12:50 with 30 s crossfades at each end, and Focus 10
    again for the return. That session is OCF-composed from the committed
    upstream focus-10 and focus-11-c mirrors; see its header for the
    composition gain. OCF-BG-0011 (engine reference-master) remains the
    alternative realization of the same sequence, built by splicing the
    Focus-11 access state over a Focus-10 base bed.

    The previously rendered audio/background/rendered/attention-focus-bed.wav
    was built from the superseded focus-3-based composite. It is retained as a
    historical artifact and is not canonical.

    Sources: focus-10 (presets/focus-10.yaml of farfield 0.1.0) and the
    committed Focus-11 access state (OCF-BG-0007).
safety:
  headphone_notice: true
  driving_warning: true
  notes:
  - Binaural-beat bed requires headphones to be heard as intended.
  - Background audio is not sleep/medical/performance therapy.
