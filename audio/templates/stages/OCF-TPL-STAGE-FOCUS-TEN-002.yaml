  auditory_cue: focus.ten.enter
  id: enter
  narration_required: false
  semantic: focus.ten.enter
- after: enter
  dsp:
    state: focus-10
  id: transition
  offset: 0
  semantic: focus.ten.transition
  timing:
    anchor: speech-end
- after: transition
