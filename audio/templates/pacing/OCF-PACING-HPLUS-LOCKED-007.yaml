evidence_notes:
- Explicit maintainer v3 approval; words and internal composition, not listening or publication.
- The initial recognition uses one 40-second hold; the former generic 30-second relaxation-whole hold
  is not stacked with it.
- Post-close recognition has no extra two-second event gap before the separate exact 60-second rest.
- Existing voice/rates, internal pause values, 20-second breathing and separate placement holds, 15-second
  Eleven gap, 60/60/3 sleep waits, -24 dB underlay and ten-second equal-power closing are retained.
- Closing transition ends at the explicitly reviewed fourth Ten unit; closed confirmation follows completed
  measured closure. No numeral creates state events.
