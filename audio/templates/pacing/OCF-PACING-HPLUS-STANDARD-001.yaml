schema_version: "1.0"
id: OCF-PACING-HPLUS-STANDARD-001
version: "0.3.0"
status: draft
voice_profile_id: OCF-VOICE-0003
estimate:
  words_per_minute: 160
  basis: "Planning estimate only, based on prior local Piper audition durations; final starts/ends come from measured TTS."
repetitions:
  focus11: 2
  focus20: 2
pauses:
  transmutation_box_begin_s: 5
  transmutation_box_place_s: 40
  transmutation_box_complete_s: 8
  optional_stage_begin_s: 3
  optional_stage_practice_s: 15
  optional_stage_complete_s: 3
  relaxation_begin_s: 5
  relaxation_breath_s: 15
  relaxation_step_s: 6
  relaxation_whole_s: 30
  focus10_learn_s: 3
  focus10_count_s: 5
  focus10_initial_hold_s: 40
  focus11_learning_s: 4
  focus11_prime_s: 6
  focus11_open_prepare_s: 2
  focus11_ready_s: 2
  focus11_close_prepare_s: 3
  focus10_return_ready_s: 2
  focus10_hold_s: 60
  focus11_repeat_gap_s: 15
  sleep20_pre_repeat_s: 600
  sleep20_repeat_gap_s: 60
  sleep20_post_repeat_s: 30
  waking_begin_s: 4
  waking_step_s: 5
  waking_complete_s: 3
transitions:
  fallback_seconds: 5
  focus10_to_focus11_s: 25
  focus11_to_focus10_s: 25
  focus10_to_focus20_s: 5
  focus20_to_focus10_s: 5
underlay:
  gain_db: -24
  audibility_note: "Barely-audible narration underlay; verify measured speech-band level in each mix."
  efficacy_claim: false
narration_pacing:
  profiles:
    relaxation-opening:
      rate_scale: 0.88
      default_unit: instruction
      require_unit_kinds: true
      pauses: {sentence: 2.0, instruction: 3.0, paragraph: 4.0}
    relaxation-body:
      rate_scale: 0.88
      default_unit: instruction
      require_unit_kinds: true
      pauses:
        sentence: 2.0
        instruction: 3.5
        count: 6.0
        phrase: 1.25
        landing: 5.0
        paragraph: 4.0
    focus20-countdown:
      rate_scale: 0.88
      default_unit: sentence
      require_unit_kinds: true
      pauses: {sentence: 2.0, instruction: 2.5, pre_countdown: 2.5, countdown: 5.0, paragraph: 4.0}
    waking-countdown:
      rate_scale: 0.90
      countdown_rate_scale_end: 0.97
      default_unit: sentence
      require_unit_kinds: true
      pauses:
        sentence: 2.0
        instruction: 2.5
        pre_countdown: 2.5
        countdown: 3.0
        final_countdown: 4.0
        phrase: 1.5
        landing: 3.0
        paragraph: 3.5
    guided-transition:
      rate_scale: 0.90
      default_unit: instruction
      pauses: {sentence: 2.0, instruction: 2.5, count: 2.5, phrase: 1.5, paragraph: 3.0}
    single-count:
      rate_scale: 0.90
      default_unit: count
      pauses: {count: 1.0}
  entries:
    hplus.shared.relaxation.begin: relaxation-opening
    hplus.shared.relaxation.face: relaxation-body
    hplus.shared.relaxation.shoulders: relaxation-body
    hplus.shared.relaxation.hands: relaxation-body
    hplus.shared.relaxation.torso: relaxation-body
    hplus.shared.relaxation.legs: relaxation-body
    hplus.shared.focus10.learn: guided-transition
    hplus.shared.focus10.count: single-count
    hplus.shared.focus10.enter: single-count
    hplus.shared.focus10.ready: guided-transition
    hplus.shared.focus10.return.ready: guided-transition
    hplus.shared.focus11.open.prepare: guided-transition
    hplus.shared.focus11.open: single-count
    hplus.shared.focus11.ready: guided-transition
    hplus.shared.focus11.close.prepare: guided-transition
    hplus.shared.focus11.close: guided-transition
    hplus.shared.focus20.enter: focus20-countdown
    hplus.shared.waking.begin: waking-countdown
pacing_auditions:
  relaxation-1-to-10: {label: Ten-point relaxation 1-10, file_name: relaxation-1-to-10, stage_id: relaxation}
  focus20-countdown-10-to-20: {label: Sleep entry countdown 10-20, file_name: focus20-10-to-20, event_id: focus20-enter.enter}
  waking-countdown-20-to-1: {label: Waking countdown 20-1, file_name: waking-20-to-1, event_id: return.begin}
optional_stages:
  affirmation: false
  resonant_tuning: false
  energy_ball: false
evidence_notes:
  - "Focus 10 hold: user-requested 60-second default."
  - "Focus 11 programming and low-level sleep body repetitions: user-requested twice each."
  - "Focus 20 pre-repeat pause: draft 600-second design choice, informed by the existing generic Learn shell's approximately 599-second sleep window; not a recovered source timing."
  - "Low-level sleep-body narration gain: configurable at underlay.gain_db; current draft value is -24 dB, reused from the Attention reference-derived template; not an efficacy or subliminal claim."
  - "15/60/30-second repetition gaps and 5-second fallback transitions are design-selected defaults pending review."
  - "Optional preparation stages default off. Their inclusion does not make Preparation Module features production-ready."
