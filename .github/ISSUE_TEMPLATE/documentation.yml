name: Documentation
description: Report a documentation gap, error, or contradiction.
title: "[Docs] "
labels: ["documentation"]
body:
  - type: input
    id: doc
    attributes:
      label: Document
      description: "Path or title of the affected document."
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What's wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested fix (optional)