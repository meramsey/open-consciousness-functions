name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  agent-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ".[mcp]"
      - name: Optional SDK protocol and persistent job integration
        run: python -m pytest tests/test_agent_api.py tests/test_agent_workflows.py tests/test_dev_jobs.py tests/test_mcp_protocol.py
      - name: Retain failed job diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-job-diagnostics-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .ocf-work/tmp/pytest-run-*/**/logs/jobs/**/worker.log
            .ocf-work/tmp/pytest-run-*/**/logs/jobs/**/state.json
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated unit contracts
        run: python -m pytest -m unit -n 2 --dist loadfile
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Repository and available external-audio integration
        run: python -m pytest -m integration -n 2 --dist loadfile
