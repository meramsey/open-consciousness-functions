name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-lsp:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt -e ".[lsp,python-lsp]"
      - name: Real Python and OCF language-server protocols
        env:
          OCF_REQUIRE_PYTHON_LSP: "1"
        run: python -m pytest tests/test_ocf_launch.py tests/test_python_lsp.py tests/test_ocf_lsp_launcher.py tests/test_lsp_protocol.py
  agent-tools:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e ".[mcp,artwork,lsp]"
      - name: Optional SDK protocol and persistent job integration
        run: python -m pytest tests/test_agent_api.py tests/test_agent_workflows.py tests/test_dev_jobs.py tests/test_mcp_protocol.py tests/test_artwork.py tests/test_brand_refinement.py tests/test_brand_import.py tests/test_public_branding.py tests/test_voice_datasets.py tests/test_session_overrides.py tests/test_media_tools.py tests/test_authoring.py tests/test_lsp_protocol.py
      - name: Retain failed job diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-job-diagnostics-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .ocf-work/tmp/pytest-run-*/**/logs/jobs/**/worker.log
            .ocf-work/tmp/pytest-run-*/**/logs/jobs/**/state.json
            .ocf-work/tmp/pytest-run-*/**/lsp-stderr.log
  unit:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Run isolated unit contracts
        run: python -m pytest -m unit -n 2 --dist loadfile
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          # Editorial inventory verification reads its immutable starting SHA.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - name: Repository and available external-audio integration
        run: python -m pytest -m integration -n 2 --dist loadfile
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install supported codec and speech integration tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development and optional adapter dependencies
        run: python -m pip install -r requirements-dev.txt -e ".[mcp,artwork,lsp,python-lsp]"
      - name: Measure the full suite and gate statement and branch metrics separately
        run: python -m ocf_tools.coverage_report run --output .ocf-work/logs/coverage/ci
      - name: Retain coverage and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-coverage-linux-python312
          include-hidden-files: true
          path: |
            .ocf-work/logs/coverage/ci/*.json
            .ocf-work/logs/coverage/ci/tests.xml
            .ocf-work/logs/coverage/ci/pytest.log
