name: open-roadmap-pr

on:
  push:
    branches: [automation/open-roadmap-pr-20261107]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: open-ocf-roadmap-pr-20261107
  cancel-in-progress: false

jobs:
  open-draft-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, user inputs, secrets output, code writes, approval or merge.
      - uses: actions/github-script@v7
        with:
          script: |
            if (context.ref !== 'refs/heads/automation/open-roadmap-pr-20261107') {
              throw new Error('Unexpected publishing branch');
            }
            const {owner, repo} = context.repo;
            const head = 'docs/complete-roadmap-performance-20261106';
            const base = 'engineering/per-locale-function-authority-20261103';
            const headRef = await github.rest.git.getRef({owner, repo, ref: `heads/${head}`});
            const baseRef = await github.rest.git.getRef({owner, repo, ref: `heads/${base}`});
            if (headRef.data.object.sha !== '8e8ff2d5aafe3c925b595d357dec38121fcb2979' ||
                baseRef.data.object.sha !== 'e65634eadb3567566568931ae00f293f2300812f') {
              throw new Error('Roadmap or reviewed base moved; refusing stale publication');
            }
            const existing = await github.rest.pulls.list({owner, repo, head: `${owner}:${head}`, state: 'open'});
            if (existing.data.length) {
              core.notice(`Existing roadmap PR: ${existing.data[0].html_url}`);
              return;
            }
            const result = await github.rest.pulls.create({
              owner, repo, head, base, draft: true,
              title: 'Preserve complete roadmap and specify five editorial/performance workstreams',
              body: [
                'Stacked documentation-only follow-up to #27; do not merge ahead of its required owner review.',
                '',
                '- Preserve all 102 previous checkbox states and all existing approved goals.',
                '- Expand existing relaxation, Nutricia persistence and Focus 11 reviews in place.',
                '- Add separate high-priority test and bulk-generation performance tasks.',
                '- Record acceptance criteria, priorities, dependencies and implementation order.',
                '- No requested feature is silently marked implemented; no listening, wording or publication approval is inferred.',
                '',
                'ROADMAP.md is byte-identical to the verified 9172168 checkpoint after synchronization with the corrected PR #27 base.',
                'Local documentation inventory and Markdown checks pass. Draft status is intentional; required CI and human review remain separate.',
                'This bounded publisher can create/reuse this draft only. It cannot approve, merge or modify repository contents.'
              ].join('\n')
            });
            core.notice(`Created draft roadmap PR: ${result.data.html_url}`);
