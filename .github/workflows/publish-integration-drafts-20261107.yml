name: Correct integration PR workflow note
on:
  push:
    branches: [automation/codex-integration-drafts-20261107]
    paths: [.github/workflows/publish-integration-drafts-20261107.yml]
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: ocf-integration-drafts-20261107
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'meramsey/open-consciousness-functions' && github.ref == 'refs/heads/automation/codex-integration-drafts-20261107' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Correct workflow note without other PR changes
        uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const plans = [{"number": 28, "head": "codex/integrate-roadmap-20261107", "head_sha": "f61e4190f26aab01f8f985058e6d591e59573641", "base": "main", "base_sha": "9fe1de6d6ac2cce29b0963b94b5910734f9d403d"}, {"number": 29, "head": "codex/integrate-test-performance-20261107", "head_sha": "405a1b9bab13f01e8da9fd407d58a7ae433c2568", "base": "codex/integrate-roadmap-20261107", "base_sha": "f61e4190f26aab01f8f985058e6d591e59573641"}, {"number": 30, "head": "codex/integrate-bulk-performance-20261107", "head_sha": "62ec70871ff9c72f95b516fec16ed0230f4ed8d7", "base": "codex/integrate-test-performance-20261107", "base_sha": "405a1b9bab13f01e8da9fd407d58a7ae433c2568"}];
            const oldText = 'Publication through GITHUB_TOKEN does not itself trigger downstream pull-request workflows.';
            const newText = 'Pull requests created through GITHUB_TOKEN do trigger pull-request workflows, which require approval before running. PR workflow approval and required gates remain separate from successful push checks; neither draft publication nor push-check success establishes readiness. See https://docs.github.com/en/actions/concepts/security/github_token.';
            function validate(pr,p) {
              if (pr.state !== 'open' || !pr.draft || pr.head.ref !== p.head || pr.head.sha !== p.head_sha || pr.base.ref !== p.base || pr.base.sha !== p.base_sha) throw new Error(`PR #${p.number} changed; reconcile before editing`);
            }
            for (const p of plans) {
              for (const [ref,sha] of [[p.head,p.head_sha],[p.base,p.base_sha]]) {
                const {data} = await github.rest.git.getRef({owner,repo,ref:`heads/${ref}`});
                if (data.object.sha !== sha) throw new Error(`Ref moved: ${ref}`);
              }
              const {data:pr} = await github.rest.pulls.get({owner,repo,pull_number:p.number});
              validate(pr,p);
              const original = pr.body || '';
              if (!original.includes(oldText) && original.includes(newText)) {core.info(`Already corrected #${p.number}`); continue;}
              if (original.split(oldText).length !== 2) throw new Error(`Unexpected body #${p.number}; preserve and reconcile`);
              const body=original.replace(oldText,newText);
              const {data:latest}=await github.rest.pulls.get({owner,repo,pull_number:p.number});
              validate(latest,p);
              if (latest.body !== original || latest.updated_at !== pr.updated_at) throw new Error(`Concurrent edit #${p.number}; stop`);
              const {data:updated}=await github.rest.pulls.update({owner,repo,pull_number:p.number,body});
              validate(updated,p);
              if (updated.body !== body) throw new Error(`Body verification failed #${p.number}`);
              core.info(JSON.stringify({number:p.number,url:updated.html_url,head:updated.head.sha,base:updated.base.sha,draft:updated.draft,body_only:true}));
              await core.summary.addRaw(`Corrected one workflow statement: ${updated.html_url}\n`).write();
            }
