name: generated-index-check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install PyYAML jsonschema
      - name: Verify generated indexes are current
        run: python scripts/ocf.py build-index --check