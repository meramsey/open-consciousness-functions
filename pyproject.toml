[build-system]
requires = ["setuptools>=68", "PyYAML>=6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "open-consciousness-functions"
version = "0.1.0"
description = "Open specification and reference framework for consciousness-function training exercises."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "OCF Contributors" }]
keywords = ["consciousness", "training", "specification", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.18",
  "referencing>=0.30",
]

[project.optional-dependencies]
listener = ["mutagen==1.47.0"]
guides = ["reportlab==4.4.10"]
artwork = ["Pillow==12.3.0", "fonttools==4.67.0"]
mcp = ["mcp==1.30.0"]
lsp = ["pygls==2.1.1", "lsprotocol==2025.0.0"]
python-lsp = ["pyright==1.1.408"]
dev = [
  "pytest>=8.0",
  "pytest-xdist==3.8.0",
  "ruff>=0.5",
  "coverage==7.16.2",
  "pytest-cov==7.1.0",
  "setuptools>=68",
  "numpy>=2.0",
  "scipy>=1.13",
  "soundfile>=0.12",
  "Pillow==12.3.0",
  "fonttools==4.67.0",
]
farfield = [
  "PyYAML>=6.0",
]

[project.scripts]
ocf = "ocf_tools.cli:main"
ocf-lsp = "ocf_tools.lsp_server:main"

[tool.setuptools]
packages = ["ocf_tools"]

[tool.setuptools.package-dir]
"" = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "unit: isolated application/library behavior; external process boundary stubbed",
  "integration: repository or multi-component integration",
  "audio_integration: actual audio engine/codec integration",
  "external_tool: invokes an external executable",
  "e2e: full workflow/CLI artifact integration",
  "platform: operating-system or installed-package integration",
  "slow: deliberately long-running integration (not excluded from full checks)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["audio/background/rendered"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["scripts", "tests", "setup.py"]
exclude = [
  ".ocf-work", ".venv", "venv", "build", "dist", "htmlcov",
  "audio/rendered", "audio/background/rendered", "**/node_modules",
  "**/__pycache__", ".pytest_cache", ".ruff_cache",
]
extraPaths = ["scripts", "tests"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.11"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["scripts/ocf_tools", "scripts/tools"]
parallel = true
relative_files = true
patch = ["subprocess", "_exit", "execv"]

[tool.coverage.report]
# Include reachable error paths even when old code carries pragma: no cover.
exclude_lines = []
show_missing = true

[tool.coverage.json]
show_contexts = true
