lifecycle:
  persistence: permanent
  activation: automatic
  release:
    required: false
    command: null
  trigger_conditions:
  - Automatic is the intended baseline; deliberate primary invocation strengthens
    or restores it.
  - Observe pauses outward-directed insect-discouragement intention while calm awareness
    remains.
  - Suspend pauses the entire Clear Zone application, preserving ordinary awareness
    and natural bodily responses.
  - Modes are mutually exclusive; each deliberate selection replaces the prior mode.
  - Either override ends at normal sleep onset, loss of consciousness or deliberate
    primary invocation.
  - Relaxation, Focus-state labels and hearing a cue during narration are not reset
    or selection triggers.
  - These are exercise instructions, not executable detection or physiological control.
  scopes:
    capability:
      persistence: permanent
      description: Intended learned availability persists in every mode.
      description_key: functions.ocf-exp-005.capability
    baseline:
      persistence: permanent
      activation: automatic
      description: Intended automatic non-destructive insect discouragement and calm
        awareness.
      description_key: functions.ocf-exp-005.baseline
    application:
      persistence: conditional
      activation: manual
      description: Mutually exclusive Observe and Suspend overrides replace the prior
        mode and end at normal sleep onset, loss of consciousness or deliberate primary
        invocation.
      description_key: functions.ocf-exp-005.application
purpose:
  summary: Establish an ongoing intention to discourage unwanted insect contact while
    maintaining calm awareness.
  source_description: null
  community_description: Experimental non-destructive intention with distinct automatic,
    Observe and Suspend modes.
safety:
  level: experimental
  medical_relevance: false
  notes:
  - Physical repellency or protection against bites, stings or insect-borne disease
    is not established.
claims:
  intended_effects:
  - Calm awareness and non-destructive intention to discourage unwanted insect contact.
  prohibited_claims:
  - No verified physical repellency or protection against insect-borne disease.
