entries:
  hplus.function.ocf-slp-002.opener:
    status: reviewed
    version: 1.2.0
    text: |-
      This OCF exercise will teach you to enter normal,
      natural, restful sleep whenever you choose,
      and awaken at the time you desire.
  hplus.function.ocf-slp-002.function-body:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-SLP-002
      allowed:
      - cue.primary
    text: |-
      From this moment forward, you have the ability
      to enter normal, natural, restful sleep
      whenever you consciously desire.

      When you choose to sleep, allow your body
      to settle comfortably and begin breathing
      slowly, deeply, and easily.

      As you exhale, think or say in your mind,
      "{{ cue.primary }}."

      With each gentle breath and each repetition
      of this command, you will move more deeply
      into calm, peaceful, natural sleep.

      Your thoughts will become quiet.
      Unnecessary effort and tension will fade.
      Your mind and body will recognize that
      the time for comfortable sleep has arrived.

      You will fall asleep smoothly and naturally,
      without needing to force or follow the process.

      During sleep, your total self will work
      toward harmony, balance, and equalization.
      Your nervous system and physical body
      will cooperate in their natural patterns
      of rest, maintenance, and renewal.

      Each part of your system will settle
      into the rhythms appropriate for sleep,
      allowing your body and mind to recover
      and restore their natural vitality.

      You will remain peacefully asleep for
      the rest you desire, and awaken at the
      time you have chosen, refreshed, alert,
      and ready to begin again.

      This ability to enter restful sleep
      will remain permanently available to you.
      It begins when you choose to use it,
      leaving your ordinary waking state
      clear and active at other times.

      Each time you use {{ cue.primary }},
      entering natural sleep and awakening
      refreshed will become easier and more effective.
  hplus.function.ocf-slp-002.closer:
    status: reviewed
    version: 1.2.1
    cue_template:
      function_id: OCF-SLP-002
      allowed:
      - cue.primary
    text: |-
      Remember, whenever you wish to enter normal,
      natural, restful sleep, breathe slowly and deeply.
      As you exhale, think or say in your mind,
      "{{ cue.primary }}."

      This concludes your OCF Sleep exercise.
