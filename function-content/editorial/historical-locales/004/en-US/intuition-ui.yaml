    text: Deliberate intuitive reinforcement
    status: reviewed
  commands.ocf-cmd-exp-006-primary.usage:
    text: Bring one question or situation into awareness; think or say Plus Intuition in the mind; allow
      a quiet moment; consider and choose a response.
