schema_version: "1.0"
method: complete-source-text-inspection
defaults:
  preparation: Brochure gives prior Preparation Exercise or prior H-PLUS learning, a quiet supported position, soft stereo/headphone listening and next-day target exercise. Exact lost narration procedure is unknown; mockup shell is related-function inference.
  state: Historical target recording's exact state sequence remains unknown. Mockup imports ten/eleven/ten/sleep/waking grammar from surviving Hearing/Seeing, not recovered target audio.
  opener: Historical opener unknown; mockup supplies purpose orientation and related-function learning shell as structural inference.
  association: Known command/purpose metadata is paired in the mockup with a proposed internal cue/breath procedure; the exact historical association wording/method is unknown.
  rehearsal: unknown
  suspend_cancel_reset: unknown
  closer: Historical closer unknown; annotated mockup borrows remember/use, access close and return shell from related transcripts.
  consolidation: Historical target consolidation unknown; proposed sleep/ambient segment is related-function inference, never measured target timing.
  handoff: Historical handoff unknown; mockup's waking return/reminder is inferred, not recovered.
  conversion: Original OCF design is still required; do not convert mockup expression by synonyms or adopt unsupported mechanisms. Any safer/material reframing needs explicit human review, not historical promotion.
  uncertainties: Annotated VERIFIED labels are reconstruction-author assertions, not independent authentication. Catalogue purpose/command/use limits and proposed mockup operations are separate evidence axes. Missing historical operations remain unknown.
  statuses: {identity: supported, purpose: supported, preparation: supported}
