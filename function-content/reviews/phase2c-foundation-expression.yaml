    purpose: Explore a purported internal energy reserve and direct a selected portion toward an imagined use.
    preparation: Comfortable posture, loosen clothing, eyes closed and counted ten-state entry; no repository-box step established in this version.
    state: Access/exploration context closes to ten; subsequent imaginative play occurs in ten. A final waking exit is not supplied.
    main: [recall-vigorous-experience, internally-issue-energize-cue, explore-felt-energy-source, become-familiar-with-experience, gather-portion-for-use, represent-intended-use]
    association: Energize cue is paired with recalled vigor and representation of a desired form of use; no breath-hold requirement is stated in this main instruction.
    rehearsal: Explicit guided inner exploration followed by post-close imaginative play applying the function to senses/emotions/thoughts.
    future_use: Energize cue followed by a representation of intended use; growing effectiveness is asserted with deliberate repeated use.
    suspend_cancel_reset: Release-eleven-access phrase closes the training context, not an established universal cancellation of the energy function.
    closer: Leave exploration/access and close to ten, then practice imaginative use rather than the usual immediate sleep consolidation.
    consolidation: Post-close imaginative experimentation is described; sleep-to-twenty is not established in this available text.
    handoff: unknown
    claims: [inner-energy-reserve, energy-as-identity-or-metaphysical-mechanism, enhanced-ability, experiential-vigor-recall]
    uncertainties: Ending after imaginative practice is absent; source naming of M-energy does not establish a physical mechanism or generation identity.
