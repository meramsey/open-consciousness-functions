schema_version: "1.0"
method: complete-source-text-inspection
defaults:
  preparation: Supported uninterrupted relaxed posture, settling movements/breathing, temporary setting-aside in repository representation and counted ten-state entry.
  state: Reference learning shell uses ten preparation, eleven opening, ten closure, sleep-to-twenty and waking return where the available ending supports it; not an OCF runtime requirement.
  opener: Orient to the target function and establish receptive learning context before the instruction.
  association: Pair the deliberately selected legacy cue with the target response and breathing procedure; canonical spelling/compatibility remains separate metadata.
  rehearsal: Repeated instruction does not establish a distinct listener performance trial; apparent ambient transcription artifacts are not practice evidence.
  suspend_cancel_reset: unknown
  closer: Reinforce future remembering/use and close the learning context to ten.
  consolidation: Counted sleep-to-twenty segment is present; automatic integration is a source assertion, not established mechanism.
  handoff: Waking countdown and eyes-open return, followed by target cue reminder.
  conversion: Preserve voluntary target selection and learned association where appropriate; breath holding, guaranteed response and automatic whole-system learning require editorial review rather than scientific endorsement.
  uncertainties: Source-designated derivative is not authenticated; ASR repetition/count artifacts do not establish original wording, duration or repetition intent. Undeclared reset/termination remains unknown.
