    main: [close-eyes, inhale-and-hold, internally-issue-open-cue, exhale-and-rest-with-mind-awake, attend-to-remembered-experience-or-self-communication]
    association: Open cue initiates contemplation; closed cue terminates it and is paired with ordinary waking return.
    rehearsal: Two full instruction presentations are present; they are repeated teaching, not proof of two explicit listener performance trials.
    future_use: Activate and communicate/recall as desired; terminate deliberately with the closed cue.
    suspend_cancel_reset: Internal closed cue explicitly ends the activated context.
    closer: Future-use reinforcement, learning-channel closure to ten, sleep/consolidation and waking return with open-cue reminder.
    consolidation: Counted sleep-to-twenty shell present; effectiveness/automatic consolidation not established.
    handoff: Counted waking return, eyes open; final reminder of future contemplation procedure.
    claims: [greater-self-communication, guaranteed-memory-availability, physiological-relaxation, automatic-whole-system-learning]
    conversion: Preserve deliberate open/close control; metaphysical and perfect-memory interpretations require explicit review rather than automatic secular equivalence.
    uncertainties: Transcript is source-designated but not authenticated; breath holding and automatic outcome claims need content review.
