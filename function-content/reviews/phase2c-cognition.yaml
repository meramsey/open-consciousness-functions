  OCF-COG-004:
    statuses: {rehearsal: not-present}
    title: Imprint
    source: "+Transcripts From available tapes/Imprint/Imprint.txt"
    inspected_lines: [1, 145]
    family: cognitive-encoding-retrieval
    purpose: Deliberately encode selected experience/information and later retrieve it using a separate recall cue.
