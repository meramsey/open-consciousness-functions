    association: Imprint cue is paired with attention/encoding; recall cue retrieves the selected sensory record. Legacy repeated imprint command differs from the canonical shortened metadata.
    rehearsal: Two instruction presentations; no distinct explicit encoding-and-retrieval listener trial is established.
    future_use: Encode a chosen target on demand; invoke recall for the whole retained record or selected parts.
    suspend_cancel_reset: Retention is said to persist until directed otherwise, but no specific erase/reset command is supplied.
    closer: Reinforce remembered use, close learning context to ten, sleep interval and waking return; final encoding reminder.
    consolidation: Sleep-to-twenty interval described; repeated ASR twenties are not intelligible reinforcement evidence.
    handoff: Waking countdown/eyes open and final reminder.
    claims: [guaranteed-detailed-sensory-encoding, indefinite-retention, immediate-perfect-retrieval, automatic-whole-system-learning]
    conversion: Preserve selection/attention/recall linkage; guarantees and implied anatomical storage cannot be accepted as mechanisms. Do not invent an erase command.
