  OCF-COG-002:
    title: Buy the Numbers
    source: "+Transcripts From available tapes/Buy the Numbers/Buy the Numbers.txt"
    inspected_lines: [1, 330]
    family: cognitive-enhancement
    purpose: Improve numerical memory, arithmetic, symbolic understanding and mathematical expression, with an optional intensification cue.
    preparation: Comfortable uninterrupted posture, ordinary settling movements/breathing and temporary setting-aside in a repository representation.
    state: Ten-state entry, eleven learning opening, ten-state closing; subsequent numbered sleep-like progression is incomplete and final return unavailable.
    opener: Establish learning receptivity before broad mathematical-ability suggestions.
    main: [associate-number-perception-with-memory, associate-arithmetic-with-speed-and-accuracy, associate-symbols-with-understanding-and-expression, intensify-via-breath-and-calculation-cue]
    association: Inhale/hold, internally issue calculation cue, exhale; cue intensifies an otherwise asserted persistent improvement.
    rehearsal: Instruction describes the procedure but no distinct listener practice trial is established in the inspected intelligible portion.
    future_use: Use the cue to focus/intensify mathematical ability; repeated use is asserted to improve efficiency.
    suspend_cancel_reset: unknown
    closer: Reinforce future remembering, close the learning channel and return to ten-state rest.
    consolidation: A subsequent numbered interval is present, but its complete sleep-entry explanation and final exit are not preserved here.
    handoff: unknown
    claims: [guaranteed-persistent-cognitive-improvement, broad-mathematical-accuracy, automatic-whole-system-learning]
    conversion: Distinguish a deliberate math-task cue from promises of permanent ability; concrete rehearsal must be an explicit OCF design, not recovered content.
    uncertainties: ASR count artifacts and missing later content do not establish timing, deliberate repetition or a complete return sequence.
    locators: {purpose: [7, 8], preparation: [9, 25], state: [26, 64], opener: [54, 66], main: [67, 92], association: [88, 92], rehearsal: [67, 114], future_use: [88, 113], suspend_cancel_reset: [1, 330], closer: [109, 125], consolidation: [126, 330], handoff: [126, 330], safety_claims: [59, 92]}
  OCF-COG-003:
    statuses: {rehearsal: not-present}
    title: Contemplation
    source: "+Transcripts From available tapes/Contemplation/Contemplation.txt"
    inspected_lines: [1, 93]
    family: cognitive-open-close
    purpose: Enter a voluntary contemplative communication/recall context described as communion with a greater/total self.
    preparation: Supported uninterrupted relaxation and temporary setting-aside; counted ten-state preparation.
