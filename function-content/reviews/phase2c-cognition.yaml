schema_version: "1.0"
method: complete-source-text-inspection
notes: Original analytical summaries, not narration or authenticated historical transcripts. Runtime states and editorial approval remain separate.
functions:
  OCF-COG-001:
    title: Access to Information
    source: "+Transcripts From available tapes/Access to Information/Access to Information.txt"
    inspected_lines: [1, 147]
    family: cognitive-retrieval
    purpose: Access one's personal information/experience library; the source promises immediate availability rather than verification of accuracy.
    preparation: Comfortable supported position, loosen clothing, eyes closed; count to ten; no repository-box step in this inspected version.
    state: Ten-state preparation, eleven/access opening, then unspecified deeper learning position; later return is missing in the available derivative.
    opener: Frame the information-retrieval task and enter a receptive learning context.
    main: [request-personal-information, internally-state-retrieval-cue, specify-information-target, attend-to-words-images-feelings-or-sensations]
    association: Cue is paired with selection of desired information and an asserted immediate response.
    rehearsal: Explicitly recall a prior moment of knowledge/certainty, use the cue and explore information while awaiting the narrator's return call.
    future_use: Retrieval cue plus chosen information target; no breath-hold condition is specified in the main instruction.
    suspend_cancel_reset: unknown
    closer: unknown
    consolidation: unknown
    handoff: unknown
    claims: [guaranteed-immediate-memory-access, unverified-complete-personal-library, experiential-multimodal-retrieval]
    conversion: Preserve voluntary recall/search and modality flexibility; perfect/immediate answers require review and accuracy caveats, not equivalence claims.
    uncertainties: Closing/return and end conditions unavailable after the practice invitation; do not invent them. Source derivative accuracy and generation unverified.
