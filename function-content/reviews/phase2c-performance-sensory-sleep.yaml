    main: [select-activity, inhale-and-hold, issue-do-this-now-cue, exhale, associate-action-with-readiness-and-momentum]
    future_use: Use the cue for beginning, continuing or completing a selected activity; voluntary desire is a condition, not an accidental spoken trigger.
    consolidation: Post-close ten-state enjoyment/rest of the asserted new pattern; sleep-to-twenty is not established in this available text.
    handoff: unknown
    claims: [automatic-resistance-removal, subconscious-self-programming, guaranteed-momentum, life-force-or-reality-creation]
    uncertainties: Final ending/return unavailable; numeric contamination before main instruction is not evidence of additional states.
