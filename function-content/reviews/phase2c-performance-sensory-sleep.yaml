schema_version: "1.0"
method: complete-source-text-inspection
defaults:
  preparation: Supported uninterrupted relaxation, temporary repository setting-aside and counted ten-state entry where described.
  state: Reference learning shell uses ten preparation, eleven opening, ten close and sleep-to-twenty/waking return where preserved; not runtime OCF state requirements.
  opener: Orient to the function and establish receptive learning context before the target instruction.
  association: Deliberate legacy cue paired with selected goal and breathing; canonical variants/aliases are separate identity metadata, not silently changed source speech.
  rehearsal: Repeated teaching does not prove an explicit listener performance trial; no distinct intelligible trial established in the available text.
  suspend_cancel_reset: unknown
  closer: Future-use reinforcement and learning-context closure to ten.
  consolidation: Sleep-to-twenty shell present; repeated ASR numbers do not establish reinforcement or measured timing.
  handoff: Waking countdown, eyes-open return and target reminder where preserved.
  conversion: Preserve deliberate agency/selection where useful, but guaranteed outcomes, breath holding and automatic whole-system learning need review. Reframing a physical/metaphysical goal is a material choice, not assumed equivalence.
  uncertainties: Source-designated text is unauthenticated; corrupted counts/ambient material cannot establish original repetition, timing or mechanism.
