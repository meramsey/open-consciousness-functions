schema_version: "1.0"
method: complete-source-text-inspection
defaults:
  preparation: Supported uninterrupted posture, settling movements/breathing, repository representation for temporary setting-aside and counted ten-state preparation.
  state: Reference learning shell prepares ten, opens eleven, closes to ten and uses sleep-to-twenty plus waking return where preserved; runtime OCF requirements remain separate and unknown.
  opener: Introduce a body-oriented intended response and receptive learning context, not evidence that the physiology changed.
  association: Pair source cue/breathing with the selected body-related response; actual canonical and legacy command variants stay in identity metadata.
  rehearsal: No distinct listener test of physiological outcome is established; teaching repetition and ASR ambient tokens are not outcome verification.
  future_use: Use the cue/breathing procedure as described for the selected response; asserted effectiveness is a claim, not an observed result.
  suspend_cancel_reset: unknown
  closer: Reinforce remembered future use and close the learning context to ten.
  consolidation: Sleep-to-twenty shell present; physiological/automatic integration is not established by that instruction.
  handoff: Counted waking/eyes-open return with target command reminder where intelligible.
  conversion: Do not reproduce unsupported physiological/medical mechanisms as fact or assume a psychological reinterpretation is equivalent. Useful experiential operations and material purpose changes require explicit content review; medical management and breath-hold issues remain outside software efficacy claims.
  uncertainties: Source-designated derivative is unauthenticated. Count/repetition/ambient artifacts do not establish exact timing or original underlay; unspecified cancellation remains unknown.
